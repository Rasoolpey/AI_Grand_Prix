tyle=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; rolling loss\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; hairpins, braking\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; corners vs energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; grip; 4× rolling\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Aero kit\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; drag\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; hairpins: little\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; drag, energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; too slow to help\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; launch vs top\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; hairpin exits\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; top speed vs energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; pull out of mud\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Driver\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; braking, the stop\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; eq. 6, no penalties\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; pace vs energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; read the mud\u003c/span>\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">How much the estimated time changes between a part's worst and best option, swapping one part at a time on the starting car: \u003cspan style=\"color:#B8500F\">●\u003c/span> under 2.5&nbsp;% · \u003cspan style=\"color:#B8500F\">●●\u003c/span> 2.5–5&nbsp;% · \u003cspan style=\"color:#B8500F\">●●●\u003c/span> over 5&nbsp;%. Driver: the starting controller scores 68 overall on a car whose estimate is about 100.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · from the Garage estimates (near-perfect driving)\u003c/p>\n\u003caside>Measured, not guessed: each option of each part swapped on the starting car with garage(d), estimated times compared. Biggest single effects: gearing on the endurance (18 %: short gearing tops out at 14 m/s), battery on the endurance (11 %: 45 Wh runs short), tyres on the technical circuit (11 %) and in the mud (10 %), motor and gearing on the drag strip (10 %), motor in the mud (8 %). The driver row is the reminder: the starting controller drives at 11 m/s everywhere: too fast for the hairpins (it slides off), too slow on the straights.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-tradeoffs", "html": "\u003csection id=\"p2-tradeoffs\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · TRADE-OFFS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Every gain has a price\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px\">\u003cp style=\"flex:1;font-size:23px;line-height:1.35;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Budget:\u003c/b> 80 credits; the best of everything costs 105\u003c/p>\u003cp style=\"flex:1;font-size:23px;line-height:1.35;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Mass:\u003c/b> every upgrade but tyres and gearing adds kilograms\u003c/p>\u003cp style=\"flex:1;font-size:23px;line-height:1.35;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Physics:\u003c/b> grip ↔ rolling loss · downforce ↔ drag · pull ↔ top speed\u003c/p>\u003c/div>\n\u003ctable style=\"font-size:28px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:24%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">UPGRADE\u003c/th>\u003cth style=\"width:34%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">\u003cspan style=\"color:#1A6B62\">▲ YOU GAIN\u003c/span>\u003c/th>\u003cth style=\"width:42%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">▼ YOU PAY WITH\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Bigger motor\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">faster on every path\u003c/td>\u003ctd style=\"padding:16px 18px\">credits, +4–5 kg, more energy per lap\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Bigger battery\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">endurance at full pace\u003c/td>\u003ctd style=\"padding:16px 18px\">credits, +3–4 kg on every path\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Softer tyres\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">faster corners, harder braking\u003c/td>\u003ctd style=\"padding:16px 18px\">rolling loss: energy (4× in mud), straight-line speed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Downforce kit\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">grip in fast corners\u003c/td>\u003ctd style=\"padding:16px 18px\">drag: slower straights, much more energy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Shorter gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">launch, hairpin exits\u003c/td>\u003ctd style=\"padding:16px 18px\">top speed (14 m/s)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Longer gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">top speed (20 m/s)\u003c/td>\u003ctd style=\"padding:16px 18px\">launch; energy at high speed\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · trade-offs\u003c/p>\n\u003caside>Three reasons no car wins everywhere: the budget, mass, and the physics built into each part. Go down the table and ask the room which path pays for each gain. Example: soft tyres win time on the technical circuit but cost energy on the endurance; the downforce kit helps the endurance's fast corners but its drag can make the starting car run short of energy.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-scoring", "html": "\u003csection id=\"p2-scoring\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · SCORING\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Balance beats one great result\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:26px 40px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:48px;font-weight:600;color:#13203A\">Overall = 0.6 × mean(s) + 0.4 × min(s)\u003c/p>\u003cp style=\"font-size:26px;color:#3E4A5C\">Per path: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">s = min(120, 100 × T_ref / T)\u003c/span>, T = your time + penalties, T_ref = the reference car. A DNF scores 0.\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#E9E6DF;padding:36px 40px;border-radius:16px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600\">Specialist\u003c/h3>\u003cp style=\"font-size:34px;color:#3E4A5C\">95 · 95 · 95 · 20\u003c/p>\u003cp style=\"font-size:40px;font-weight:600;color:#13203A\">Overall 54\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;padding:36px 40px;border-radius:16px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600\">All-rounder\u003c/h3>\u003cp style=\"font-size:34px;color:#3E4A5C\">75 · 75 · 75 · 75\u003c/p>\u003cp style=\"font-size:40px;font-weight:600;color:#B8500F\">Overall 75 · wins\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#13203A\">\u003cb>Your weakest path counts for 40&nbsp;%.\u003c/b> It is usually where your next point comes from.\u003c/p>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#13203A\">Cars that finish every path rank first. Awards: overall champion · best single path · best engineering explanation · best use of the agent.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · scoring\u003c/p>\n\u003caside>Specialist: 0.6 × 76.25 + 0.4 × 20 = 53.75. All-rounder: 0.6 × 75 + 0.4 × 75 = 75. Your weakest path counts for 40 %, so it is usually where the next point comes from. The last two awards are judged from the engineering log.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-sweetspot", "html": "\u003csection id=\"p2-sweetspot\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE SWEET SPOT\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Find your sweet spot: it's your call\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">WHY BETTER CAN LOSE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.2;color:#13203A\">+10 on your best path, −5 on your weakest\u003c/h3>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">0.6 × (10 − 5) / 4 − 0.4 × 5 = −1.25\u003c/span>\u003cbr>Check all four paths before you keep a change.\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">PARTS INTERACT\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.2;color:#13203A\">Is 70 Wh enough?\u003c/h3>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">It depends on the motor, gearing, aero, tyres and how hard you drive. Long gearing or the downforce kit pushes the starting car to 69 of its 70 Wh.\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">THE DRIVER IS HALF THE CAR\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.2;color:#13203A\">68 or 100 on the same car\u003c/h3>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Garage estimates assume a near-perfect driver (≈ 100). The starting controller scores 68. A better car pays off only if you drive near its limits.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:16px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">1\u003c/span>&nbsp; Find your weakest path\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">practiceRace('Path', 'all')\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">2\u003c/span>&nbsp; Ask the AI for options\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">what each gains and costs\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">3\u003c/span>&nbsp; Pick one: the AI builds it\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">and tests all four paths\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">4\u003c/span>&nbsp; Race your ghost\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">a higher overall is saved\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#13203A\">There is no answer key. Two teams can race different cars and both be right, as long as each can show why.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the sweet spot\u003c/p>\n\u003caside>The arithmetic assumes the weakest path stays the weakest: the mean rises by 5/4, times 0.6 is +0.75; the min drops by 5, times 0.4 is −2. The 69-of-70 Wh figure is the Garage estimate for the starting car with long gearing or with the downforce kit. Run garage once in a MATLAB session before the garage(d) trick, so MATLAB can find carDesign.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-best", "html": "\u003csection id=\"p2-best\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · YOUR BEST MODEL\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Race your own ghost; keep only what is better\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:12px;align-items:stretch\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:24px 26px;border-radius:14px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:600;color:#13203A\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">your car drives all four paths\u003c/p>\u003c/div>\u003cp style=\"font-size:34px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:24px 26px;border-radius:14px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600;color:#13203A\">Fast replay\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">you next to a grey ghost: your best run so far\u003c/p>\u003c/div>\u003cp style=\"font-size:34px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:24px 26px;border-radius:14px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600;color:#13203A\">Overall better than your best?\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">0.6 × mean + 0.4 × min, all four paths\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#E3F1E7;border:2px solid #9CCFAA;padding:24px 28px;border-radius:14px\">\u003cp style=\"font-size:28px;font-weight:600;color:#1F6B3A\">Yes: saved as your best model\u003c/p>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">It replaces the old one: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px\">best_model/&lt;team&gt;.zip\u003c/span>. There is only ever one, and it is what you hand in.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#E9E6DF;padding:24px 28px;border-radius:14px\">\u003cp style=\"font-size:28px;font-weight:600;color:#13203A\">No: nothing is saved\u003c/p>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Your best model stays as it was. An experiment can never cost you your best car.\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#13203A\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">bestModel\u003c/span> shows it: scores, parts, the file. The name on race day is \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">car.team\u003c/span> inside it, so set your team name first.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · your best model\u003c/p>\n\u003caside>This is what makes it safe to experiment: the best model only ever moves up. Students see the ghost in the fast replay of practiceRace('Path', 'all') and in single-path animated runs. Renaming the team (same car) refreshes the best model too. On race day you collect exactly these files.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-roles", "html": "\u003csection id=\"p2-roles\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · WHO DOES WHAT\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">You are the race engineer. The agent is your pit crew.\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:28px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:50%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">YOU\u003c/th>\u003cth style=\"width:50%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">THE AGENT\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Race the car and look at the results\u003c/td>\u003ctd style=\"padding:17px 18px\">Runs MATLAB for you: garage, practiceRace, plotLap\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Ask for options\u003c/td>\u003ctd style=\"padding:17px 18px\">Suggests 2–3 changes, with what each gains and costs\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">\u003cb>Pick one\u003c/b>, or ask for something else\u003c/td>\u003ctd style=\"padding:17px 18px\">Makes \u003cb>that one\u003c/b> change and tests it on all four paths\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Ask \"why?\" whenever it is unclear\u003c/td>\u003ctd style=\"padding:17px 18px\">Explains in simple words, with the physics\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Race your ghost; a better overall is saved\u003c/td>\u003ctd style=\"padding:17px 18px\">Never decides for you, never saves your best model\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Hand in your best model\u003c/td>\u003ctd style=\"padding:17px 18px\">Checks it with you before you submit\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">\u003cspan style=\"color:#FF8A3D\">If it decides for you:\u003c/span> Stop. Undo that and give me the options instead. I'll choose.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the agent's rules are in AI_Grand_Prix\\AGENTS.md\u003c/p>\n\u003caside>AGENTS.md tells the agent to ask for the student's view first, recommend only when asked, never write the student's explanations, and end every reply with the decision it needs. If a student's only input was 'OK', they weren't the engineer for that decision: that is the line to repeat while circulating.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-steps", "html": "\u003csection id=\"p2-steps\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · YOUR STEPS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Race, ask the AI to improve it, race again\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:10px;align-items:stretch\">\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:24px 22px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">1\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.15;color:#13203A\">Race the starting car\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;font-weight:600;letter-spacing:1px;color:#B8500F\">YOU · MATLAB\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">practiceRace('Path', 'all')\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;background:#E3EFEC;border:2px solid #CFE3DF;padding:24px 22px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">2\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.15;color:#13203A\">Improve the car\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;font-weight:600;letter-spacing:1px;color:#1A6B62\">ASK THE AI\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">it changes the parts\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;background:#E3EFEC;border:2px solid #CFE3DF;padding:24px 22px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">3\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.15;color:#13203A\">Improve the driver\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;font-weight:600;letter-spacing:1px;color:#1A6B62\">ASK THE AI\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">it changes the controller\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:24px 22px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">4\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.15;color:#13203A\">Race your ghost\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;font-weight:600;letter-spacing:1px;color:#B8500F\">YOU · MATLAB\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">better overall = saved\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:24px 22px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">5\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.15;color:#13203A\">Hand in\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;font-weight:600;letter-spacing:1px;color:#B8500F\">YOU · MATLAB\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">bestModel · submitCar\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#13203A;background:#FFFFFF;border:2px dashed #F3C9A8;padding:18px 28px;border-radius:14px\">\u003cb style=\"color:#B8500F\">Repeat steps 2–4\u003c/b> as long as you have time. You choose what the AI changes; it edits the files and tests them; you race the result against your ghost.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the prompts to type are in the README, Part 2\u003c/p>\n\u003caside>The whole of Part 2 on one slide. Students never edit code by hand: they look at the results, ask the AI for options, pick one, and the AI makes the change and tests it. Only their own practiceRace('Path', 'all') in MATLAB saves a new best model, so the ghost always shows their best run so far.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step1", "html": "\u003csection id=\"p2-step1\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 1 OF 5\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Race the starting car yourself\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">garage &nbsp;·&nbsp; practiceRace &nbsp;·&nbsp; practiceRace('Path', 'all')\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ your scores, and your first best model\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">What you see\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">First put your team name in student\\carDesign.m (car.team): it is the name on race day.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>garage: your car, its parts and its estimated times\u003c/li>\u003cli>practiceRace: one animated lap\u003c/li>\u003cli>practiceRace('Path', 'all'): all four paths, sped up, then your overall score\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">WHAT YOU USE\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">student/carDesign.m\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">car.team = your team name; the starting car's five parts\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">your score on each path and overall; saves your first best model\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">best_model/&lt;team&gt;.zip\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">your best model so far: the grey ghost from now on\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 1 of 5\u003c/p>\n\u003caside>Open MATLAB yourself and make the AI_Grand_Prix folder the current folder. Expected for the starting car: every path finishes, at one speed, 11 m/s: drag 15 s, technical 47 s (it slides wide in two hairpins: +10 s), endurance 180 s, muddy road 42 s; overall about 68. Ask: which path is weakest, and where did it slide?\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step2", "html": "\u003csection id=\"p2-step2\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 2 OF 5\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Ask the AI to improve your car\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Read AGENTS.md. I raced my car with practiceRace('Path', 'all'). Which path is my weakest, and why? Suggest 2–3 changes to my car's parts, with what each gains and costs. Don't change anything yet.\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ the AI edits student/carDesign.m\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Pick one, then let it build it\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Then type:  Make change 2 and test it on all four paths.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>Ask \"why?\" if a reason is unclear\u003c/li>\u003cli>Every part that helps somewhere costs somewhere else\u003c/li>\u003cli>Budget: 80 credits\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">car-design-review\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">compares designs with the Garage numbers and scores them like race day\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">matlab · garage, practiceRace\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the AI runs MATLAB for you and reads the results\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">AGENTS.md\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the AI's rule book for this project: you don't need to read it\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 2 of 5\u003c/p>\n\u003caside>AGENTS.md makes the agent offer options and wait for the student's choice, then make one change and test it. Its test runs do not save the best model: the student does that in step 4.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step3", "html": "\u003csection id=\"p2-step3\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 3 OF 5\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Ask the AI to improve the driver\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Improve my controller so the car is faster on my weakest path without new penalties. Explain the change in simple words, make one change, and test it on all four paths.\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ the AI edits controller.m / robotConfig.m\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Agree, or ask for something else\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">One change at a time: you see what each one does.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>\"Why should that help?\" is always a good question\u003c/li>\u003cli>Slower somewhere? Ask it to undo the change\u003c/li>\u003cli>Must work on new tracks: no track-specific tricks\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">race-debrief\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">races one path, reads the lap report, proposes one change\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">matlab · practiceRace, plotLap\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the race and its lap report: speed, grip, battery\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">student/controller.m\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the driver: throttle and steering, 50 times a second\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 3 of 5\u003c/p>\n\u003caside>The biggest gains are here: the starting driver goes 11 m/s everywhere, too fast for hairpins and mud, too slow on straights. Typical first changes: slow down only for corners (eq. 6), brake just in time, steer smoother.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step4", "html": "\u003csection id=\"p2-step4\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 4 OF 5\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Race your ghost\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ a better overall = your new best model\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">What you see\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Your car next to a grey ghost: your best run so far.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>Overall better: NEW BEST, saved automatically\u003c/li>\u003cli>Not better: nothing saved, your best is safe\u003c/li>\u003cli>Then back to step 2 or 3\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">WHAT YOU USE\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">all four paths, sped up, against your ghost; saves a better overall\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">bestModel\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">your best model: scores per path, parts, the file\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">best_model/&lt;team&gt;.zip\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">only ever one: the best you have done\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 4 of 5\u003c/p>\n\u003caside>Students run this themselves in MATLAB, so they see the replay. Only this run saves the best model, never the agent's test runs.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step5", "html": "\u003csection id=\"p2-step5\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 5 OF 5\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Hand in your best model\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">bestModel &nbsp;·&nbsp; submitCar\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ best_model/&lt;team&gt;.zip, to your instructor\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Your best model, with your name\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Not the files you are editing now: the best you have done.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>bestModel: check the team name and the score\u003c/li>\u003cli>submitCar: checks it and hands it in\u003c/li>\u003cli>Resubmit until the code freeze\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">WHAT YOU USE\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">bestModel\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">shows the model you will hand in\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">submitCar\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">checks it on each path, then copies it to the shared folder, or tells you which file to send\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">best_model/&lt;team&gt;.zip\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">this file races on the projector on race day\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 5 of 5\u003c/p>\n\u003caside>Optional final prompt: 'Check my controller for anything that only works on the practice tracks.' On race day every model races together on four new tracks.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-control", "html": "\u003csection id=\"p2-control\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STAY IN CHARGE\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Check the agent's work, and take back control\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;align-items:stretch\">\u003cdiv style=\"width:640px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">CHECK ITS WORK\u003c/p>\u003cul style=\"font-size:24px;line-height:1.4;color:#1B2433\">\u003cli>It \u003cb>ran the race\u003c/b> after every change: the numbers come from that run\u003c/li>\u003cli>It changed \u003cb>one\u003c/b> thing, only in student/, after you said yes\u003c/li>\u003cli>It named the \u003cb>equation\u003c/b> behind each claim, and it makes sense to you\u003c/li>\u003cli>Nothing in controller.m uses practice coordinates or lap distances\u003c/li>\u003cli>You can explain each change in your own words\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">IF THE AGENT…, TYPE\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…decided something for you\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Stop. Undo that and give me the options instead. I'll choose.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…changed several things\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Undo all of that. Make only the first change, run it, show me the numbers.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…wrote a reply you can't follow\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">In 3 bullet points: what you ran, what the numbers say, what you suggest.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…claims without running it\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Run it and show me the numbers.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…wrote your explanation\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Delete that. I'll write it, and you check it.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · also in AI_Grand_Prix\\README.md\u003c/p>\n\u003caside>Same list as the README. Point out that the agent is set up to ask first, so most of the time the student only needs the first prompt. Leave this slide up during the development session if there is a second screen.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-raceday", "html": "\u003csection id=\"p2-raceday\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · RACE DAY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Every best model, one folder, one race\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:stretch;gap:16px\">\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">1\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Hand in\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Your best model, with your name inside it: submitCar.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">2\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">One folder\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Every team's model goes into one folder on the instructor's computer.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">3\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Scrutineering\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Each model is checked, then driven on all four new paths here, with the same physics.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">4\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Four races\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">All cars on the track at once, 3-2-1-GO, about 12 s each, a live running order.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">5\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Results\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Each race's results, then the overall standings and the awards.\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#13203A\">Ghost cars: they never touch, so nothing one car does can slow another. The names on screen are the team names inside the models.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · race day\u003c/p>\n\u003caside>Instructor: makeFinals(secret seed) once, then finalRace('\u003cfolder with the models>'). It scans and drives every model (scrutineering screen), then shows each race paced to about 12 s, its results, and the standings. Results are saved in instructor/race/results/; raceDay('Out', folder) replays them. Full steps: instructor/race/submissions/README.md.\u003c/aside>\n\u003c/section>\n"}, {"id": "wrap", "html": "\u003csection id=\"wrap\" data-section=\"What students leave with, and the decisions still open.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#9AA7BD\">WRAP-UP\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#F5F3EE\">What you take home\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600;color:#7FD3C7\">Part 1\u003c/h3>\n\u003cp style=\"font-size:30px;line-height:1.5;color:#C9D3E3\">A literature review backed by evidence, a research proposal with a figure, and a MATLAB experiment ready to build\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #FF8A3D;padding:24px 0 0 0\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600;color:#FF8A3D\">Part 2\u003c/h3>\n\u003cp style=\"font-size:30px;line-height:1.5;color:#C9D3E3\">Your best model (a car and driver you designed), your race results, and one design trade-off you can explain\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"font-size:32px;line-height:1.4;color:#F5F3EE\">And a way of working: agents do the legwork, you make the decisions and check the evidence.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#9AA7BD\">Keep your workshop folder (AI_Grand_Prix-main) · Shared PC: run remove-keys.ps1\u003c/p>\n\u003caside>Close with awards (fastest, best engineering, best use of the agent) once the scoring is final, then remind shared-PC users to clear their keys.\u003c/aside>\n\u003c/section>\n"}, {"id": "open-decisions", "html": "\u003csection id=\"open-decisions\" data-transition=\"fade\" style=\"background:#E9E6DF;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">OPEN DECISIONS\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#13203A;color:#F5F3EE;padding:6px 20px;border-radius:999px;white-space:nowrap\">Instructor only · hide before class\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">What we still need to decide\u003c/h2>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#B8500F\">Grand Prix\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.5\">\n\u003cli>How models reach you: shared folder or e-mail\u003c/li>\n\u003cli>The race-day secret number\u003c/li>\n\u003cli>Prizes for the four awards\u003c/li>\n\u003cli>On-screen length of a race (now 12 s)\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#1A6B62\">Workshop\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.5\">\n\u003cli>Date, length, time per part\u003c/li>\n\u003cli>PaperViz: image generation in the VS Code extension?\u003c/li>\n\u003cli>Topic list for Part 1\u003c/li>\n\u003cli>Test the VS Code extension on a lab PC\u003c/li>\n\u003cli>Freeze main before the workshop\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Instructor view (see instructor/TODO_WORKSHOP.md §3)\u003c/p>\n\u003caside>Instructor-only slide: mark it hidden before presenting.\u003c/aside>\n\u003c/section>\n"}]</script>
<script>
const data = JSON.parse(document.getElementById('slideData').textContent);
const canvas = document.getElementById('canvas');
const picker = document.getElementById('picker');
const notes = document.getElementById('notes');
const hiddenIds = new Set(['status', 'open-decisions']);
let visible = [], current = 0;
for (const item of data) {
  const template = document.createElement('template');
  template.innerHTML = item.html.trim();
  item.node = template.content.firstElementChild;
  if (!item.node || item.node.tagName !== 'SECTION') throw new Error('Invalid slide: ' + item.id);
  item.title = item.node.querySelector('h1, h2')?.textContent.trim() || item.id;
  canvas.appendChild(item.node);
}
function filterSlides() {
  const previous = visible[current]?.id;
  const include = document.getElementById('instructor').checked;
  visible = data.filter(item => include || !hiddenIds.has(item.id));
  for (const item of data) item.node.classList.toggle('excluded', !visible.includes(item));
  picker.replaceChildren();
  visible.forEach((item, i) => {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `${i + 1}. ${item.title}${hiddenIds.has(item.id) ? ' [instructor]' : ''}`;
    picker.appendChild(option);
  });
  const retained = visible.findIndex(item => item.id === previous);
  show(retained < 0 ? Math.min(current, visible.length - 1) : retained);
}
function show(index) {
  current = Math.max(0, Math.min(index, visible.length - 1));
  for (const item of data) item.node.classList.remove('active');
  const item = visible[current];
  item.node.classList.add('active');
  picker.value = current;
  notes.textContent = item.node.querySelector('aside')?.textContent.trim() || 'No speaker notes.';
  document.getElementById('count').textContent = `Slide ${current + 1} of ${visible.length}${hiddenIds.has(item.id) ? ' · Instructor only' : ''}`;
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === visible.length - 1;
  fit();
}
function fit() {
  const stage = document.getElementById('stage');
  const scale = Math.min(stage.clientWidth / 1920, stage.clientHeight / 1080);
  canvas.style.transform = `scale(${scale})`;
  canvas.style.left = `${(stage.clientWidth - 1920 * scale) / 2}px`;
  canvas.style.top = `${(stage.clientHeight - 1080 * scale) / 2}px`;
}
function toggleNotes() {
  notes.hidden = !notes.hidden;
  document.getElementById('notesToggle').setAttribute('aria-pressed', String(!notes.hidden));
  fit();
}
async function present() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (error) { alert('Fullscreen is unavailable. You can maximise the browser window.'); }
}
document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
picker.onchange = () => show(Number(picker.value));
document.getElementById('instructor').onchange = filterSlides;
document.getElementById('notesToggle').onclick = toggleNotes;
document.getElementById('present').onclick = present;
document.getElementById('print').onclick = () => window.print();
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', Boolean(document.fullscreenElement));
  fit();
});
document.addEventListener('keydown', event => {
  if (event.target.matches('input, select, button, textarea, summary')) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1); }
  if (event.key === 'Home') { event.preventDefault(); show(0); }
  if (event.key === 'End') { event.preventDefault(); show(visible.length - 1); }
  if (event.key.toLowerCase() === 'n') toggleNotes();
  if (event.key.toLowerCase() === 'f') present();
});
new ResizeObserver(fit).observe(document.getElementById('stage'));
canvas.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
filterSlides();
</script>
