"padding:17px 18px\">Gets the numbers, checks your prediction against the equations\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">\u003cb>Choose\u003c/b> the parts and the driving strategy\u003c/td>\u003ctd style=\"padding:17px 18px\">Lays out options, pros and cons, when you ask\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Approve, change or reject every change; keep or undo it\u003c/td>\u003ctd style=\"padding:17px 18px\">Makes \u003cb>one\u003c/b> change, runs it, reports the numbers\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Write your trade-off in your own words\u003c/td>\u003ctd style=\"padding:17px 18px\">Checks it against the data; never writes it for you\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Keep \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">engineering_log.md\u003c/span>\u003c/td>\u003ctd style=\"padding:17px 18px\">Fills in measured numbers when you ask\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">\u003cspan style=\"color:#FF8A3D\">If it decides for you:\u003c/span> Stop. Undo that and give me the options instead. I'll choose.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the agent's rules are in AI_Grand_Prix\\AGENTS.md\u003c/p>\n\u003caside>AGENTS.md tells the agent to ask for the student's view first, recommend only when asked, never write the student's explanations, and end every reply with the decision it needs. If a student's only input was 'OK', they weren't the engineer for that decision: that is the line to repeat while circulating.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-loop", "html": "\u003csection id=\"p2-loop\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · WORKING WITH YOUR AGENT\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">One change, one run, one lesson\u003c/h2>\n\u003c/div>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#13203A\">Four of the seven steps are yours. \u003cb>Predict\u003c/b> and \u003cb>Compare\u003c/b> are where you learn something: never skip them.\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:10px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Specify\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#B8500F\">YOU\u003c/p>\u003c/div>\u003cp style=\"font-size:28px;color:#B8500F\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Predict\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#B8500F\">YOU\u003c/p>\u003c/div>\u003cp style=\"font-size:28px;color:#B8500F\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Inspect\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#3E4A5C\">AGENT\u003c/p>\u003c/div>\u003cp style=\"font-size:28px;color:#B8500F\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Propose\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#3E4A5C\">AGENT\u003c/p>\u003c/div>\u003cp style=\"font-size:28px;color:#B8500F\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Decide\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#B8500F\">YOU\u003c/p>\u003c/div>\u003cp style=\"font-size:28px;color:#B8500F\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Run\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#3E4A5C\">AGENT\u003c/p>\u003c/div>\u003cp style=\"font-size:28px;color:#B8500F\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:30px 6px;border-radius:12px\">\u003cp style=\"font-size:30px;font-weight:600;color:#13203A\">Compare\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;letter-spacing:1px;color:#B8500F\">YOU\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;align-items:stretch\">\u003cpre style=\"flex:1;margin:0;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:27px;line-height:1.7;background:#13203A;color:#F5F3EE;padding:26px 30px;border-radius:12px;white-space:pre-wrap\">GOAL:      faster on the technical circuit\nKEEP:      no penalties on any path\nI THINK:   it brakes far too early for the hairpins (eq. 6)\nSHOW ME:   speed vs the eq. 6 line, where it is furthest below\nTHEN WAIT: propose one change; don't make it until I say yes\u003c/pre>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:26px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">A GOOD PROMPT HAS\u003c/p>\u003cp style=\"font-size:27px;line-height:1.5;color:#3E4A5C\">a \u003cb>goal\u003c/b>, what to \u003cb>keep\u003c/b>, \u003cb>your guess\u003c/b> and why, what to \u003cb>show\u003c/b> you, and an instruction to \u003cb>wait\u003c/b>. Most bad prompts miss the last three.\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · prompt patterns in AI_Grand_Prix\\AGENT_GUIDE.md\u003c/p>\n\u003caside>Four of the seven steps are the student's. Predict and Compare are where the learning happens: never skip them. Anti-patterns to call out: 'make it faster' with no data, many changes at once, trusting a change without running it, and copying the agent's explanation into the log.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-steps", "html": "\u003csection id=\"p2-steps\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · YOUR STEPS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Six steps from the starting car to race day\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(3, 1fr);gap:24px\">\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:30px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">1\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Meet your car\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#3E4A5C\">your name, then MATLAB · 5 min\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">2\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Brief the agent\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#3E4A5C\">summary you check · 3 min\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">3\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Design the car\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#3E4A5C\">skill: car-design-review · 10 min\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">4\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Choose how to drive\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#3E4A5C\">three options, you pick · 5 min\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">5\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Improve, one change at a time\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#3E4A5C\">race-debrief, then your ghost · 20 min\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:30px;border-radius:16px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">6\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Check and hand in\u003c/h3>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#3E4A5C\">Pattern 7, bestModel, submitCar · 5 min\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#13203A\">Everything you decide goes in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px\">student/engineering_log.md\u003c/span>, handed in with your best model.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · steps 5 and 6 come back in the final sprint\u003c/p>\n\u003caside>Step 1 is deliberately by hand: students run the car themselves and watch it before the agent is involved. Steps 5 and 6 repeat in the final sprint before the code freeze, and students can go back to step 3 once their driver improves.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step1", "html": "\u003csection id=\"p2-step1\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 1 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Meet your car: run it yourself, in MATLAB\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">garage &nbsp;·&nbsp; practiceRace &nbsp;·&nbsp; practiceRace('Path', 'all')\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ engineering_log.md §1\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU DECIDE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Your weakest path, and why\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">First write your team name in carDesign.m. Watch your car drive, then write the baseline scores.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>Which path scores lowest?\u003c/li>\u003cli>Which part, or which part of the driving, limits it?\u003c/li>\u003cli>Name the equation\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">WHAT YOU USE (NO AGENT YET)\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">student/carDesign.m\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">car.team = your name on race day; the starting car's five parts\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">practiceRace\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the animated race: speed, battery and the friction-circle dot on the HUD\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">all four paths and your overall score; saves your first best model\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 1 of 6\u003c/p>\n\u003caside>No agent yet, on purpose: five minutes with their own car makes everything after concrete. In MATLAB, make the workshop folder's AI_Grand_Prix the current folder (address bar, or cd). Expected baseline: every path finishes, slowly: drag 22.4 s, technical 54.0 s, endurance 278 s, muddy road 64 s, overall about 48.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step2", "html": "\u003csection id=\"p2-step2\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 2 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Brief the agent\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Read AGENTS.md and the project, then tell me in 5 bullet points what you understood. Don't change anything.\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ a summary you check\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU DECIDE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Is its summary right?\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Correct it now, before it writes any code.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>What the three paths test and how they're scored\u003c/li>\u003cli>What the controller receives and returns\u003c/li>\u003cli>Which files it may change\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">AGENTS.md\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">its rules: you decide, it asks first, one change at a time\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">README.md · PHYSICS.md · student/\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the rules, the nine equations, your files and your log\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">matlab · garage\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the agent's own MATLAB; it starts on first use (about a minute)\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 2 of 6\u003c/p>\n\u003caside>This is the 'read before you write' habit from Part 1. If the summary is wrong (paths, scoring, which files are editable), the student corrects it in one message. Students who skip this get an agent that guesses.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step3", "html": "\u003csection id=\"p2-step3\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 3 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Design the car\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the car-design-review skill on the candidates in my engineering log.\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ carDesign.m · engineering_log.md §2\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU DECIDE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Which car you race, and why\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Before: 1–2 candidate designs and your prediction in the log.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>After: your choice and your trade-off, 3–4 sentences, with numbers\u003c/li>\u003cli>Edit carDesign.m yourself: five lines\u003c/li>\u003cli>Not sure? Ask for the swaps that target your weakest path\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">car-design-review\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">scores your candidates like race day and shows where your prediction was wrong; no recommendation unless you ask\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">matlab · garage(d, 'Plot', false)\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">every candidate's numbers without editing a file\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">practiceReference\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">T_ref per path, for the score\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 3 of 6\u003c/p>\n\u003caside>The skill asks for the candidates and predictions if the log is empty, and never picks for the student. The trade-off paragraph is the written deliverable: the agent checks it against the numbers but does not rewrite it. Expect estimates within a few points of each other: the bigger gap is the driver.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step4", "html": "\u003csection id=\"p2-step4\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 4 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Choose how to drive\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Propose three ways my controller could choose its target speed from obs.previewPoints and obs.car. Pros, cons, risk on new layouts. Don't implement anything.\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ engineering_log.md §3\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU DECIDE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Your driving strategy\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">The driver answers two questions, 50 times a second: where to steer, and how fast to go.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>Pick one approach and say why\u003c/li>\u003cli>Then implement it conservatively and predict the result (Pattern 4)\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">student/controller.m\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">throttle and steering in [−1, 1], every 0.02 s\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">obs.previewPoints · obs.car\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the next ~60 m of road; your car's own numbers\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">cornerSpeed(obs.car, kappa)\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">eq. 6, ready to use: the safe speed for a curve\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 4 of 6\u003c/p>\n\u003caside>Students don't need to know the best algorithm: they need to choose between options and say why. The common good answer is curvature from the preview points, eq. 6 for the corner speed, and a braking curve to reach it in time (PHYSICS.md, 'How to use equation 6').\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step5", "html": "\u003csection id=\"p2-step5\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 5 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Improve, one change at a time\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the race-debrief skill on the technical path.\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ lapPlot.png · engineering_log.md §4\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU DECIDE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">What limits the car, and whether to keep the change\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Say it before the agent does: power, grip, energy or control?\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>Approve, change or reject its \u003cb>one\u003c/b> proposal\u003c/li>\u003cli>Then race your best model's ghost: practiceRace('Path', 'all')\u003c/li>\u003cli>Better overall: saved as your new best\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">race-debrief\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">races one path, asks for your diagnosis, then gives its own and proposes one change\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">matlab · practiceRace, plotLap\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">headless race and the six-panel lap report\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">fast replay against your ghost; a better overall replaces your best model\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 5 of 6\u003c/p>\n\u003caside>Most of the session is spent here, in a loop. On the starting car the usual limiting factor is control: speed far below the eq. 6 line. Watch for students who type only 'OK': ask them what they predicted.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-step6", "html": "\u003csection id=\"p2-step6\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STEP 6 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Check and hand in\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;line-height:1.35;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run Pattern 7 from AGENT_GUIDE.md. &nbsp;then&nbsp; bestModel &nbsp;·&nbsp; submitCar\u003c/p>\u003cp style=\"width:500px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.35;color:#B8500F;background:#FBE8DA;padding:24px 28px;border-radius:12px\">→ best_model/&lt;team&gt;.zip\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\u003cdiv style=\"width:620px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FBE8DA;border:2px solid #F3C9A8;padding:28px 32px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU DECIDE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#13203A\">Is your best model ready for layouts you've never seen?\u003c/h3>\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Fix what the overfitting check finds, then race your ghost again.\u003c/p>\u003cul style=\"font-size:26px;line-height:1.4;color:#1B2433\">\u003cli>No coordinates, corner positions, lap distances or path timings\u003c/li>\u003cli>bestModel: your team name, your best overall\u003c/li>\u003cli>Resubmit until the code freeze: the newest counts\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 34px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#3E4A5C\">THE AGENT · WHAT IT USES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">AGENT_GUIDE.md · Pattern 7\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">the overfitting check: lists track-specific hacks, changes nothing\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">bestModel\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">your best model: scores per path, parts, the file you hand in\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MATLAB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:25px;color:#13203A\">submitCar\u003c/p>\u003cp style=\"font-size:25px;line-height:1.35;color:#3E4A5C\">checks your best model, runs it on each path, adds your log, copies it to the shared folder\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · step 6 of 6\u003c/p>\n\u003caside>The final paths change straight lengths, corner radii and direction, so the overfitting check is not optional. What is handed in is the best model, not the files open in the editor; submitCar warns if it is still called 'Team Name'.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-control", "html": "\u003csection id=\"p2-control\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · STAY IN CHARGE\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Check the agent's work, and take back control\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;align-items:stretch\">\u003cdiv style=\"width:640px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">CHECK ITS WORK\u003c/p>\u003cul style=\"font-size:24px;line-height:1.4;color:#1B2433\">\u003cli>It \u003cb>ran the race\u003c/b> after every change: the numbers come from that run\u003c/li>\u003cli>It changed \u003cb>one\u003c/b> thing, only in student/, after you said yes\u003c/li>\u003cli>It named the \u003cb>equation\u003c/b> behind each claim, and it makes sense to you\u003c/li>\u003cli>Nothing in controller.m uses practice coordinates or lap distances\u003c/li>\u003cli>You can explain every row of your log \u003cb>without\u003c/b> its replies\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">IF THE AGENT…, TYPE\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…decided something for you\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Stop. Undo that and give me the options instead. I'll choose.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…changed several things\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Undo all of that. Make only the first change, run it, show me the numbers.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…wrote a reply you can't follow\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">In 3 bullet points: what you ran, what the numbers say, what you suggest.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…claims without running it\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Run it and show me the numbers.\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3DDD2;padding-top:12px\">\u003cp style=\"font-size:22px;color:#3E4A5C\">…wrote your explanation\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#13203A\">Delete that. I'll write it, and you check it.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · also in AI_Grand_Prix\\README.md\u003c/p>\n\u003caside>Same list as the README. Point out that the agent is set up to ask first, so most of the time the student only needs the first prompt. Leave this slide up during the development session if there is a second screen.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-raceday", "html": "\u003csection id=\"p2-raceday\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · RACE DAY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Every best model, one folder, one race\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:stretch;gap:16px\">\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">1\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Hand in\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Your best model, with your name inside it: submitCar.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">2\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">One folder\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Every team's model goes into one folder on the instructor's computer.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">3\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Scrutineering\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Each model is checked, then driven on all four new paths here, with the same physics.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">4\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Four races\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">All cars on the track at once, 3-2-1-GO, about 12 s each, a live running order.\u003c/p>\u003c/div>\u003cp style=\"font-size:30px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:24px 22px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:700;color:#B8500F\">5\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600\">Results\u003c/h3>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Each race's results, then the overall standings and the awards.\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#13203A\">Ghost cars: they never touch, so nothing one car does can slow another. The names on screen are the team names inside the models.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · race day\u003c/p>\n\u003caside>Instructor: makeFinals(secret seed) once, then finalRace('\u003cfolder with the models>'). It scans and drives every model (scrutineering screen), then shows each race paced to about 12 s, its results, and the standings. Results are saved in instructor/race/results/; raceDay('Out', folder) replays them. Full steps: instructor/race/submissions/README.md.\u003c/aside>\n\u003c/section>\n"}, {"id": "wrap", "html": "\u003csection id=\"wrap\" data-section=\"What students leave with, and the decisions still open.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#9AA7BD\">WRAP-UP\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#F5F3EE\">What you take home\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600;color:#7FD3C7\">Part 1\u003c/h3>\n\u003cp style=\"font-size:30px;line-height:1.5;color:#C9D3E3\">A literature review backed by evidence, a research proposal with a figure, and a MATLAB experiment ready to build\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #FF8A3D;padding:24px 0 0 0\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600;color:#FF8A3D\">Part 2\u003c/h3>\n\u003cp style=\"font-size:30px;line-height:1.5;color:#C9D3E3\">Your best model (a car and driver you designed), your race results, and one design trade-off you can explain\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"font-size:32px;line-height:1.4;color:#F5F3EE\">And a way of working: agents do the legwork, you make the decisions and check the evidence.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#9AA7BD\">Keep your workshop folder (AI_Grand_Prix-main) · Shared PC: run remove-keys.ps1\u003c/p>\n\u003caside>Close with awards (fastest, best engineering, best use of the agent) once the scoring is final, then remind shared-PC users to clear their keys.\u003c/aside>\n\u003c/section>\n"}, {"id": "open-decisions", "html": "\u003csection id=\"open-decisions\" data-transition=\"fade\" style=\"background:#E9E6DF;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">OPEN DECISIONS\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#13203A;color:#F5F3EE;padding:6px 20px;border-radius:999px;white-space:nowrap\">Instructor only · hide before class\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">What we still need to decide\u003c/h2>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#B8500F\">Grand Prix\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.5\">\n\u003cli>How models reach you: shared folder or e-mail\u003c/li>\n\u003cli>The race-day secret number\u003c/li>\n\u003cli>Prizes for the four awards\u003c/li>\n\u003cli>On-screen length of a race (now 12 s)\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#1A6B62\">Workshop\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.5\">\n\u003cli>Date, length, time per part\u003c/li>\n\u003cli>PaperViz: image generation in the VS Code extension?\u003c/li>\n\u003cli>Topic list for Part 1\u003c/li>\n\u003cli>Test the VS Code extension on a lab PC\u003c/li>\n\u003cli>Freeze main before the workshop\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Instructor view (see instructor/TODO_WORKSHOP.md §3)\u003c/p>\n\u003caside>Instructor-only slide: mark it hidden before presenting.\u003c/aside>\n\u003c/section>\n"}]</script>
<script>
const data = JSON.parse(document.getElementById('slideData').textContent);
const canvas = document.getElementById('canvas');
const picker = document.getElementById('picker');
const notes = document.getElementById('notes');
const hiddenIds = new Set(['status', 'open-decisions']);
let visible = [], current = 0;
for (const item of data) {
  const template = document.createElement('template');
  template.innerHTML = item.html.trim();
  item.node = template.content.firstElementChild;
  if (!item.node || item.node.tagName !== 'SECTION') throw new Error('Invalid slide: ' + item.id);
  item.title = item.node.querySelector('h1, h2')?.textContent.trim() || item.id;
  canvas.appendChild(item.node);
}
function filterSlides() {
  const previous = visible[current]?.id;
  const include = document.getElementById('instructor').checked;
  visible = data.filter(item => include || !hiddenIds.has(item.id));
  for (const item of data) item.node.classList.toggle('excluded', !visible.includes(item));
  picker.replaceChildren();
  visible.forEach((item, i) => {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `${i + 1}. ${item.title}${hiddenIds.has(item.id) ? ' [instructor]' : ''}`;
    picker.appendChild(option);
  });
  const retained = visible.findIndex(item => item.id === previous);
  show(retained < 0 ? Math.min(current, visible.length - 1) : retained);
}
function show(index) {
  current = Math.max(0, Math.min(index, visible.length - 1));
  for (const item of data) item.node.classList.remove('active');
  const item = visible[current];
  item.node.classList.add('active');
  picker.value = current;
  notes.textContent = item.node.querySelector('aside')?.textContent.trim() || 'No speaker notes.';
  document.getElementById('count').textContent = `Slide ${current + 1} of ${visible.length}${hiddenIds.has(item.id) ? ' · Instructor only' : ''}`;
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === visible.length - 1;
  fit();
}
function fit() {
  const stage = document.getElementById('stage');
  const scale = Math.min(stage.clientWidth / 1920, stage.clientHeight / 1080);
  canvas.style.transform = `scale(${scale})`;
  canvas.style.left = `${(stage.clientWidth - 1920 * scale) / 2}px`;
  canvas.style.top = `${(stage.clientHeight - 1080 * scale) / 2}px`;
}
function toggleNotes() {
  notes.hidden = !notes.hidden;
  document.getElementById('notesToggle').setAttribute('aria-pressed', String(!notes.hidden));
  fit();
}
async function present() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (error) { alert('Fullscreen is unavailable. You can maximise the browser window.'); }
}
document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
picker.onchange = () => show(Number(picker.value));
document.getElementById('instructor').onchange = filterSlides;
document.getElementById('notesToggle').onclick = toggleNotes;
document.getElementById('present').onclick = present;
document.getElementById('print').onclick = () => window.print();
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', Boolean(document.fullscreenElement));
  fit();
});
document.addEventListener('keydown', event => {
  if (event.target.matches('input, select, button, textarea, summary')) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1); }
  if (event.key === 'Home') { event.preventDefault(); show(0); }
  if (event.key === 'End') { event.preventDefault(); show(visible.length - 1); }
  if (event.key.toLowerCase() === 'n') toggleNotes();
  if (event.key.toLowerCase() === 'f') present();
});
new ResizeObserver(fit).observe(document.getElementById('stage'));
canvas.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
filterSlides();
</script>

<script>
/* Topic draw: turns slide "p1-draw" into the live draw. The list is remembered in this browser (localStorage).
   The draw is seeded (the seed is shown), so the same list + seed always gives the same result. */
(() => {
  const item = data.find(i => i.id === 'p1-draw');
  if (!item) return;
  const topics = JSON.parse(document.getElementById('topicData').textContent).sort((a, b) => a.id - b.id);
  const KEY = 'aiw-topic-draw-v1';
  let S = { people: [], draw: null };
  try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && Array.isArray(saved.people)) S = saved; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const sec = item.node;
  const notesAside = sec.querySelector('aside');
  sec.removeAttribute('style');
  sec.classList.add('drawapp');
  sec.innerHTML = `
    <div class="da-head">
      <div><p class="da-eyebrow">PART 1 · TOPIC DRAW</p><h2 class="da-title">Who works on what</h2></div>
      <div class="da-stats"><div><b id="daPool">0</b><span>in the pool</span></div><div><b id="daOwn">0</b><span>own topic</span></div><div><b id="daTopicN">0</b><span>topics</span></div></div>
      <div class="da-actions"><button id="daDraw" class="da-btn da-primary" type="button">Draw lots</button><button id="daReplay" class="da-btn" type="button">Replay reveal</button><button id="daReset" class="da-btn" type="button">Reset draw</button></div>
    </div>
    <p class="da-note" id="daNote"></p>
    <div class="da-body">
      <div class="da-pane">
        <form id="daForm" autocomplete="off">
          <input id="daName" maxlength="80" placeholder="Name, or group (e.g. Ana + Ben)" aria-label="Name or group">
          <div class="da-choice" role="group" aria-label="Topic choice"><button type="button" data-c="pool" class="on" aria-pressed="true">Pool</button><button type="button" data-c="own" aria-pressed="false">Own topic</button></div>
          <input id="daOwnTopic" maxlength="160" placeholder="Their own topic" aria-label="Own topic" hidden>
          <button class="da-btn" type="submit">Add</button>
        </form>
        <details><summary>Paste a list of names</summary><textarea id="daPaste" aria-label="Names, one per line" placeholder="One name or group per line. All go into the pool."></textarea><button id="daPasteBtn" class="da-btn" type="button">Add all to the pool</button></details>
        <ul class="da-list" id="daPeople"></ul>
      </div>
      <div class="da-pane">
        <h3 class="da-h3">Topic pool <span class="da-seed" id="daSeed"></span></h3>
        <ol class="da-topics" id="daTopics"></ol>
        <div class="da-actions"><button id="daCsv" class="da-btn" type="button">Save assignments.csv</button><button id="daCopy" class="da-btn" type="button">Copy as text</button></div>
      </div>
    </div>
    <div class="da-stage" id="daStage" hidden>
      <p class="da-count" id="daCount"></p>
      <p class="da-name" id="daStageName"></p>
      <div class="da-slip" id="daSlip"><span class="no" id="daSlipNo"></span><span class="t" id="daSlipT"></span></div>
      <div class="da-actions"><button id="daNext" class="da-btn da-primary" type="button">Next</button><button id="daClose" class="da-btn" type="button">Close</button></div>
      <p class="da-hint">Space or → for the next draw · Esc to close</p>
    </div>`;
  if (notesAside) sec.appendChild(notesAside);
  const $ = id => sec.querySelector('#' + id);
  const node = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const pool = () => S.people.filter(p => p.choice === 'pool');
  function computeDraw(seed) {
    const rnd = mulberry32(seed);
    const order = shuffle(pool(), rnd);
    const picks = shuffle(topics, rnd).slice(0, order.length);
    return order.map((p, i) => ({ pid: p.id, name: p.name, topicId: picks[i].id, title: picks[i].title, keywords: picks[i].keywords || '' }));
  }
  function armed(btn, label, action) {
    if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove('da-armed'); action(); return; }
    const old = btn.textContent; btn.dataset.armed = '1'; btn.classList.add('da-armed'); btn.textContent = label;
    setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove('da-armed'); btn.textContent = old; } }, 3000);
  }

  function render() {
    const p = pool(), own = S.people.filter(x => x.choice === 'own'), drawn = !!S.draw;
    const got = new Map((S.draw ? S.draw.assignments : []).map(a => [a.pid, a]));
    $('daPool').textContent = p.length; $('daOwn').textContent = own.length; $('daTopicN').textContent = topics.length;
    const tooMany = p.length > topics.length;
    $('daDraw').hidden = drawn; $('daDraw').disabled = !p.length || tooMany;
    $('daReplay').hidden = !drawn; $('daReset').hidden = !drawn;
    $('daSeed').textContent = drawn ? '· seed ' + S.draw.seed : '';
    const late = drawn && p.some(x => !got.has(x.id));
    $('daNote').textContent = !topics.length ? 'No topics found: check instructor/topics/topic_pool.csv and run build_preview.py again.'
      : drawn ? (late ? 'Some pool entries were added after the draw. Reset the draw to include them.' : 'Done. Students: copy your topic into 1_topic/my_topic.md, then run the research-question skill.')
      : tooMany ? p.length + ' in the pool but only ' + topics.length + ' topics: add topics to topic_pool.csv or move people to Own topic.'
      : p.length ? p.length + ' pool entries will each get a different topic. Press Draw lots.'
      : 'Add every student or group, as Pool or Own topic. Then press Draw lots.';

    const ul = $('daPeople'); ul.replaceChildren();
    if (!S.people.length) ul.appendChild(node('li', 'da-empty', 'Nobody yet. Type a name above and press Add.'));
    for (const x of S.people) {
      const li = node('li');
      li.appendChild(node('span', 'da-chip ' + x.choice, x.choice === 'own' ? 'OWN' : 'POOL'));
      const who = node('span', 'da-who'); who.appendChild(node('b', null, x.name));
      const a = got.get(x.id);
      if (x.choice === 'own') who.appendChild(node('small', 'got', x.ownTopic || 'own topic (not given)'));
      else if (a) who.appendChild(node('small', 'got', '#' + a.topicId + '  ' + a.title));
      li.appendChild(who);
      const rm = node('button', 'da-x', 'Remove'); rm.type = 'button'; rm.setAttribute('aria-label', 'Remove ' + x.name);
      rm.onclick = () => armed(rm, 'Sure?', () => { S.people = S.people.filter(y => y.id !== x.id); save(); render(); });
      li.appendChild(rm); ul.appendChild(li);
    }
    const taken = new Set((S.draw ? S.draw.assignments : []).map(a => a.topicId));
    const ol = $('daTopics'); ol.replaceChildren();
    for (const t of topics) { const li = node('li', taken.has(t.id) ? 'taken' : null); li.appendChild(node('span', null, String(t.id).padStart(2, '0'))); li.appendChild(document.createTextNode(t.title)); ol.appendChild(li); }
  }

  function rows() {
    const got = new Map((S.draw ? S.draw.assignments : []).map(a => [a.pid, a]));
    return S.people.map(x => { const a = got.get(x.id); return x.choice === 'own' ? [x.name, 'own', 'own', x.ownTopic || '', ''] : [x.name, 'pool', a ? a.topicId : '', a ? a.title : '', a ? a.keywords : '']; });
  }
  const cell = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

  let choice = 'pool';
  sec.querySelectorAll('.da-choice button').forEach(b => b.onclick = () => {
    choice = b.dataset.c;
    sec.querySelectorAll('.da-choice button').forEach(o => { o.classList.toggle('on', o === b); o.setAttribute('aria-pressed', String(o === b)); });
    $('daOwnTopic').hidden = choice !== 'own';
  });
  $('daForm').onsubmit = e => {
    e.preventDefault();
    const name = $('daName').value.trim(); if (!name) return;
    S.people.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, choice, ownTopic: choice === 'own' ? $('daOwnTopic').value.trim() : '' });
    $('daName').value = ''; $('daOwnTopic').value = ''; sec.querySelector('.da-choice button[data-c="pool"]').click(); save(); render(); $('daName').focus();
  };
  $('daPasteBtn').onclick = () => {
    const names = $('daPaste').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    names.forEach((name, i) => S.people.push({ id: Date.now().toString(36) + i + Math.random().toString(36).slice(2, 6), name, choice: 'pool', ownTopic: '' }));
    $('daPaste').value = ''; sec.querySelector('details').open = false; save(); render();
  };
  $('daDraw').onclick = () => {
    const seed = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
    S.draw = { seed, drawnAt: Date.now(), assignments: computeDraw(seed) }; save(); render(); openStage();
  };
  $('daReplay').onclick = openStage;
  $('daReset').onclick = () => armed($('daReset'), 'Click again to reset', () => { S.draw = null; save(); render(); });
  $('daCsv').onclick = () => {
    const text = [['name', 'choice', 'topic_id', 'topic', 'keywords'], ...rows()].map(r => r.map(cell).join(',')).join('\n') + '\n';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = 'assignments.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  $('daCopy').onclick = async () => {
    const text = rows().map(r => r[0] + ': ' + (r[1] === 'own' ? r[3] + ' (own topic)' : r[2] ? '#' + r[2] + ' ' + r[3] : 'no topic yet')).join('\n');
    try { await navigator.clipboard.writeText(text); $('daCopy').textContent = 'Copied'; } catch (e) { $('daCopy').textContent = 'Copy blocked'; }
    setTimeout(() => ($('daCopy').textContent = 'Copy as text'), 2000);
  };

  // reveal
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let R = { i: -1, busy: false };
  function openStage() { if (!S.draw || !S.draw.assignments.length) return; R = { i: -1, busy: false }; $('daStage').hidden = false; next(); }
  function closeStage() { $('daStage').hidden = true; }
  function next() {
    const list = S.draw.assignments;
    if (R.busy) return;
    if (R.i >= list.length - 1) { closeStage(); return; }
    const a = list[++R.i];
    $('daCount').textContent = (R.i + 1) + ' / ' + list.length + '   ·   seed ' + S.draw.seed;
    $('daStageName').textContent = a.name;
    $('daNext').textContent = R.i === list.length - 1 ? 'Show the list' : 'Next';
    const land = () => { $('daSlip').classList.remove('spinning'); $('daSlipNo').textContent = '#' + String(a.topicId).padStart(2, '0'); $('daSlipT').textContent = a.title; R.busy = false; };
    if (reduce || topics.length < 2) return land();
    R.busy = true; $('daSlip').classList.add('spinning'); let n = 0;
    const tick = () => { const t = topics[Math.floor(Math.random() * topics.length)]; $('daSlipNo').textContent = '#' + String(t.id).padStart(2, '0'); $('daSlipT').textContent = t.title; if (++n < 14) setTimeout(tick, 60 + n * 8); else land(); };
    tick();
  }
  $('daNext').onclick = next;
  $('daClose').onclick = closeStage;
  // While the reveal is open, Space / → / Enter / Esc drive the draw instead of changing slides.
  window.addEventListener('keydown', e => {
    if ($('daStage').hidden || !sec.classList.contains('active')) return;
    if ([' ', 'ArrowRight', 'Enter', 'Escape'].includes(e.key)) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.key === 'Escape') closeStage(); else next();
    }
  }, true);
  render();
})();
</script>
</body>
</html>
