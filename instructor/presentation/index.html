ont-size:28px;color:#F5F3EE;background:#13203A;padding:28px 32px;border-radius:12px\">Read AGENTS.md and the project, then run the race-debrief skill.\u003c/p>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#13203A\">The skill races your car in MATLAB, reads the telemetry plots and proposes \u003cb>one\u003c/b> change, with the reason and the risk. You decide.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · prompt patterns in AI_Grand_Prix\\AGENT_GUIDE.md\u003c/p>\n\u003caside>This part works today: the agent runs practiceRace through the MATLAB tool, exports the four-panel lap plot and diagnoses from data. Anti-patterns to call out: \"make it faster\" with no data, many changes at once, and trusting a change without running it.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-raceday", "html": "\u003csection id=\"p2-raceday\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · RACE DAY\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#FF8A3D;color:#13203A;padding:6px 20px;border-radius:999px;white-space:nowrap\">DRAFT · to be decided\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Up to 30 cars, one live race\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:16px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;padding:28px;border-radius:16px\">\n\u003cx-icon name=\"PaperPlane\" style=\"color:#B8500F;width:44px;height:44px\">\u003c/x-icon>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Submit\u003c/h3>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Car design and controller\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#B8500F;width:56px;height:28px\">\u003c/x-shape>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;padding:28px;border-radius:16px\">\n\u003cx-icon name=\"Verified\" style=\"color:#B8500F;width:44px;height:44px\">\u003c/x-icon>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Qualify\u003c/h3>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Each car checked alone; crashes and hangs caught\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#B8500F;width:56px;height:28px\">\u003c/x-shape>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;padding:28px;border-radius:16px\">\n\u003cx-icon name=\"Play\" style=\"color:#B8500F;width:44px;height:44px\">\u003c/x-icon>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Race\u003c/h3>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">All cars together on the projector\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#B8500F;width:56px;height:28px\">\u003c/x-shape>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;padding:28px;border-radius:16px\">\n\u003cx-icon name=\"Star\" style=\"color:#B8500F;width:44px;height:44px\">\u003c/x-icon>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Results\u003c/h3>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">Live leaderboard, every path\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#13203A\">All simulations run on the instructor's machine with the same physics, so the race is fair and nothing drops out.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · draft race format\u003c/p>\n\u003caside>DRAFT. Open: ghost cars (no contact, recommended) or interacting cars; how submissions are collected (shared folder or upload page); the time limit per path. Qualifying in separate MATLAB processes is what protects the live race from a crashing or hanging controller.\u003c/aside>\n\u003c/section>\n"}, {"id": "wrap", "html": "\u003csection id=\"wrap\" data-section=\"What students leave with, and the decisions still open.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#9AA7BD\">WRAP-UP\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#F5F3EE\">What you take home\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600;color:#7FD3C7\">Part 1\u003c/h3>\n\u003cp style=\"font-size:30px;line-height:1.5;color:#C9D3E3\">A literature review backed by evidence, a research proposal with a figure, and a MATLAB experiment ready to build\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #FF8A3D;padding:24px 0 0 0\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600;color:#FF8A3D\">Part 2\u003c/h3>\n\u003cp style=\"font-size:30px;line-height:1.5;color:#C9D3E3\">A car and controller you designed, your race results, and one design trade-off you can explain\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"font-size:32px;line-height:1.4;color:#F5F3EE\">And a way of working: agents do the legwork, you make the decisions and check the evidence.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#9AA7BD\">Keep your AI_Workshop folder · Shared PC: run remove-keys.ps1\u003c/p>\n\u003caside>Close with awards (fastest, best engineering, best use of the agent) once the scoring is final, then remind shared-PC users to clear their keys.\u003c/aside>\n\u003c/section>\n"}, {"id": "open-decisions", "html": "\u003csection id=\"open-decisions\" data-transition=\"fade\" style=\"background:#E9E6DF;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">OPEN DECISIONS\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#13203A;color:#F5F3EE;padding:6px 20px;border-radius:999px;white-space:nowrap\">Instructor only · hide before class\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">What we still need to decide\u003c/h2>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#B8500F\">Grand Prix\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.5\">\n\u003cli>Which car parts, costs, budget\u003c/li>\n\u003cli>Which paths, and how many\u003c/li>\n\u003cli>Failing a path: zero or disqualified\u003c/li>\n\u003cli>Ghost cars or interacting cars\u003c/li>\n\u003cli>Teams or individuals\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#1A6B62\">Workshop\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.5\">\n\u003cli>Date, length, time per part\u003c/li>\n\u003cli>Figure tools: PaperViz needs a paid Gemini key?\u003c/li>\n\u003cli>Topic list for Part 1\u003c/li>\n\u003cli>Test the VS Code extension on a lab PC\u003c/li>\n\u003cli>Create the AI_Workshop repo\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Instructor view (see instructor/TODO_WORKSHOP.md §3)\u003c/p>\n\u003caside>Instructor-only slide: mark it hidden before presenting.\u003c/aside>\n\u003c/section>\n"}]</script>
<script>
const data = JSON.parse(document.getElementById('slideData').textContent);
const canvas = document.getElementById('canvas');
const picker = document.getElementById('picker');
const notes = document.getElementById('notes');
const hiddenIds = new Set(['status', 'open-decisions']);
let visible = [], current = 0;
for (const item of data) {
  const template = document.createElement('template');
  template.innerHTML = item.html.trim();
  item.node = template.content.firstElementChild;
  if (!item.node || item.node.tagName !== 'SECTION') throw new Error('Invalid slide: ' + item.id);
  item.title = item.node.querySelector('h1, h2')?.textContent.trim() || item.id;
  canvas.appendChild(item.node);
}
function filterSlides() {
  const previous = visible[current]?.id;
  const include = document.getElementById('instructor').checked;
  visible = data.filter(item => include || !hiddenIds.has(item.id));
  for (const item of data) item.node.classList.toggle('excluded', !visible.includes(item));
  picker.replaceChildren();
  visible.forEach((item, i) => {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `${i + 1}. ${item.title}${hiddenIds.has(item.id) ? ' [instructor]' : ''}`;
    picker.appendChild(option);
  });
  const retained = visible.findIndex(item => item.id === previous);
  show(retained < 0 ? Math.min(current, visible.length - 1) : retained);
}
function show(index) {
  current = Math.max(0, Math.min(index, visible.length - 1));
  for (const item of data) item.node.classList.remove('active');
  const item = visible[current];
  item.node.classList.add('active');
  picker.value = current;
  notes.textContent = item.node.querySelector('aside')?.textContent.trim() || 'No speaker notes.';
  document.getElementById('count').textContent = `Slide ${current + 1} of ${visible.length}${hiddenIds.has(item.id) ? ' · Instructor only' : ''}`;
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === visible.length - 1;
  fit();
}
function fit() {
  const stage = document.getElementById('stage');
  const scale = Math.min(stage.clientWidth / 1920, stage.clientHeight / 1080);
  canvas.style.transform = `scale(${scale})`;
  canvas.style.left = `${(stage.clientWidth - 1920 * scale) / 2}px`;
  canvas.style.top = `${(stage.clientHeight - 1080 * scale) / 2}px`;
}
function toggleNotes() {
  notes.hidden = !notes.hidden;
  document.getElementById('notesToggle').setAttribute('aria-pressed', String(!notes.hidden));
  fit();
}
async function present() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (error) { alert('Fullscreen is unavailable. You can maximise the browser window.'); }
}
document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
picker.onchange = () => show(Number(picker.value));
document.getElementById('instructor').onchange = filterSlides;
document.getElementById('notesToggle').onclick = toggleNotes;
document.getElementById('present').onclick = present;
document.getElementById('print').onclick = () => window.print();
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', Boolean(document.fullscreenElement));
  fit();
});
document.addEventListener('keydown', event => {
  if (event.target.matches('input, select, button, textarea, summary')) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1); }
  if (event.key === 'Home') { event.preventDefault(); show(0); }
  if (event.key === 'End') { event.preventDefault(); show(visible.length - 1); }
  if (event.key.toLowerCase() === 'n') toggleNotes();
  if (event.key.toLowerCase() === 'f') present();
});
new ResizeObserver(fit).observe(document.getElementById('stage'));
canvas.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
filterSlides();
</script>
<script id="topicData" type="application/json">[{"id": 1, "title": "Battery thermal management in electric vehicles", "keywords": "battery cooling; thermal runaway; liquid cooling; EV"}, {"id": 2, "title": "Model predictive control for autonomous racing", "keywords": "MPC; trajectory tracking; racing line; vehicle dynamics"}, {"id": 3, "title": "State-of-charge estimation for lithium-ion batteries", "keywords": "SOC; Kalman filter; equivalent circuit model"}, {"id": 4, "title": "Grid-forming inverters in renewable-rich power grids", "keywords": "grid-forming; virtual inertia; inverter control; stability"}, {"id": 5, "title": "Pitch control of wind turbines in turbulent wind", "keywords": "wind turbine; pitch control; load reduction; PID"}, {"id": 6, "title": "Regenerative braking strategies for electric vehicles", "keywords": "regenerative braking; energy recovery; brake blending"}, {"id": 7, "title": "Path planning for mobile robots among moving obstacles", "keywords": "path planning; A*; RRT; dynamic obstacles"}, {"id": 8, "title": "Vibration suppression in lightweight robot arms", "keywords": "flexible manipulator; vibration; input shaping"}, {"id": 9, "title": "Fault detection in electric motors from vibration signals", "keywords": "condition monitoring; bearing fault; FFT; machine learning"}, {"id": 10, "title": "Home batteries and solar PV for demand response", "keywords": "demand response; home energy management; PV; battery scheduling"}, {"id": 11, "title": "Attitude control of quadrotor drones under wind gusts", "keywords": "quadrotor; attitude control; disturbance rejection"}, {"id": 12, "title": "Active noise cancellation in headphones", "keywords": "ANC; adaptive filter; LMS; acoustics"}, {"id": 13, "title": "Maximum power point tracking for solar PV under partial shading", "keywords": "MPPT; partial shading; perturb and observe; PV"}, {"id": 14, "title": "Vehicle-to-grid support for frequency regulation", "keywords": "V2G; frequency regulation; EV fleet; ancillary services"}, {"id": 15, "title": "Traffic signal control with reinforcement learning", "keywords": "traffic control; reinforcement learning; queue length"}, {"id": 16, "title": "Tyre–road friction estimation for vehicle safety", "keywords": "friction estimation; ABS; slip; vehicle safety"}, {"id": 17, "title": "Digital twins for predictive maintenance", "keywords": "digital twin; predictive maintenance; degradation model"}, {"id": 18, "title": "Energy-efficient HVAC control in buildings", "keywords": "HVAC; building energy; thermal comfort; MPC"}, {"id": 19, "title": "Energy management in hydrogen fuel cell vehicles", "keywords": "fuel cell vehicle; energy management; hybrid battery"}, {"id": 20, "title": "Sensor fusion of IMU and GPS for vehicle localisation", "keywords": "sensor fusion; Kalman filter; IMU; GPS; localisation"}]</script>
<script>
/* Topic draw: turns slide "p1-draw" into the live draw. The list is remembered in this browser (localStorage).
   The draw is seeded (the seed is shown), so the same list + seed always gives the same result. */
(() => {
  const item = data.find(i => i.id === 'p1-draw');
  if (!item) return;
  const topics = JSON.parse(document.getElementById('topicData').textContent).sort((a, b) => a.id - b.id);
  const KEY = 'aiw-topic-draw-v1';
  let S = { people: [], draw: null };
  try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && Array.isArray(saved.people)) S = saved; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const sec = item.node;
  const notesAside = sec.querySelector('aside');
  sec.removeAttribute('style');
  sec.classList.add('drawapp');
  sec.innerHTML = `
    <div class="da-head">
      <div><p class="da-eyebrow">PART 1 · TOPIC DRAW</p><h2 class="da-title">Who works on what</h2></div>
      <div class="da-stats"><div><b id="daPool">0</b><span>in the pool</span></div><div><b id="daOwn">0</b><span>own topic</span></div><div><b id="daTopicN">0</b><span>topics</span></div></div>
      <div class="da-actions"><button id="daDraw" class="da-btn da-primary" type="button">Draw lots</button><button id="daReplay" class="da-btn" type="button">Replay reveal</button><button id="daReset" class="da-btn" type="button">Reset draw</button></div>
    </div>
    <p class="da-note" id="daNote"></p>
    <div class="da-body">
      <div class="da-pane">
        <form id="daForm" autocomplete="off">
          <input id="daName" maxlength="80" placeholder="Name, or group (e.g. Ana + Ben)" aria-label="Name or group">
          <div class="da-choice" role="group" aria-label="Topic choice"><button type="button" data-c="pool" class="on" aria-pressed="true">Pool</button><button type="button" data-c="own" aria-pressed="false">Own topic</button></div>
          <input id="daOwnTopic" maxlength="160" placeholder="Their own topic" aria-label="Own topic" hidden>
          <button class="da-btn" type="submit">Add</button>
        </form>
        <details><summary>Paste a list of names</summary><textarea id="daPaste" aria-label="Names, one per line" placeholder="One name or group per line. All go into the pool."></textarea><button id="daPasteBtn" class="da-btn" type="button">Add all to the pool</button></details>
        <ul class="da-list" id="daPeople"></ul>
      </div>
      <div class="da-pane">
        <h3 class="da-h3">Topic pool <span class="da-seed" id="daSeed"></span></h3>
        <ol class="da-topics" id="daTopics"></ol>
        <div class="da-actions"><button id="daCsv" class="da-btn" type="button">Save assignments.csv</button><button id="daCopy" class="da-btn" type="button">Copy as text</button></div>
      </div>
    </div>
    <div class="da-stage" id="daStage" hidden>
      <p class="da-count" id="daCount"></p>
      <p class="da-name" id="daStageName"></p>
      <div class="da-slip" id="daSlip"><span class="no" id="daSlipNo"></span><span class="t" id="daSlipT"></span></div>
      <div class="da-actions"><button id="daNext" class="da-btn da-primary" type="button">Next</button><button id="daClose" class="da-btn" type="button">Close</button></div>
      <p class="da-hint">Space or → for the next draw · Esc to close</p>
    </div>`;
  if (notesAside) sec.appendChild(notesAside);
  const $ = id => sec.querySelector('#' + id);
  const node = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const pool = () => S.people.filter(p => p.choice === 'pool');
  function computeDraw(seed) {
    const rnd = mulberry32(seed);
    const order = shuffle(pool(), rnd);
    const picks = shuffle(topics, rnd).slice(0, order.length);
    return order.map((p, i) => ({ pid: p.id, name: p.name, topicId: picks[i].id, title: picks[i].title, keywords: picks[i].keywords || '' }));
  }
  function armed(btn, label, action) {
    if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove('da-armed'); action(); return; }
    const old = btn.textContent; btn.dataset.armed = '1'; btn.classList.add('da-armed'); btn.textContent = label;
    setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove('da-armed'); btn.textContent = old; } }, 3000);
  }

  function render() {
    const p = pool(), own = S.people.filter(x => x.choice === 'own'), drawn = !!S.draw;
    const got = new Map((S.draw ? S.draw.assignments : []).map(a => [a.pid, a]));
    $('daPool').textContent = p.length; $('daOwn').textContent = own.length; $('daTopicN').textContent = topics.length;
    const tooMany = p.length > topics.length;
    $('daDraw').hidden = drawn; $('daDraw').disabled = !p.length || tooMany;
    $('daReplay').hidden = !drawn; $('daReset').hidden = !drawn;
    $('daSeed').textContent = drawn ? '· seed ' + S.draw.seed : '';
    const late = drawn && p.some(x => !got.has(x.id));
    $('daNote').textContent = !topics.length ? 'No topics found: check instructor/topics/topic_pool.csv and run build_preview.py again.'
      : drawn ? (late ? 'Some pool entries were added after the draw. Reset the draw to include them.' : 'Done. Students: copy your topic into 1_topic/my_topic.md, then run the research-question skill.')
      : tooMany ? p.length + ' in the pool but only ' + topics.length + ' topics: add topics to topic_pool.csv or move people to Own topic.'
      : p.length ? p.length + ' pool entries will each get a different topic. Press Draw lots.'
      : 'Add every student or group, as Pool or Own topic. Then press Draw lots.';

    const ul = $('daPeople'); ul.replaceChildren();
    if (!S.people.length) ul.appendChild(node('li', 'da-empty', 'Nobody yet. Type a name above and press Add.'));
    for (const x of S.people) {
      const li = node('li');
      li.appendChild(node('span', 'da-chip ' + x.choice, x.choice === 'own' ? 'OWN' : 'POOL'));
      const who = node('span', 'da-who'); who.appendChild(node('b', null, x.name));
      const a = got.get(x.id);
      if (x.choice === 'own') who.appendChild(node('small', 'got', x.ownTopic || 'own topic (not given)'));
      else if (a) who.appendChild(node('small', 'got', '#' + a.topicId + '  ' + a.title));
      li.appendChild(who);
      const rm = node('button', 'da-x', 'Remove'); rm.type = 'button'; rm.setAttribute('aria-label', 'Remove ' + x.name);
      rm.onclick = () => armed(rm, 'Sure?', () => { S.people = S.people.filter(y => y.id !== x.id); save(); render(); });
      li.appendChild(rm); ul.appendChild(li);
    }
    const taken = new Set((S.draw ? S.draw.assignments : []).map(a => a.topicId));
    const ol = $('daTopics'); ol.replaceChildren();
    for (const t of topics) { const li = node('li', taken.has(t.id) ? 'taken' : null); li.appendChild(node('span', null, String(t.id).padStart(2, '0'))); li.appendChild(document.createTextNode(t.title)); ol.appendChild(li); }
  }

  function rows() {
    const got = new Map((S.draw ? S.draw.assignments : []).map(a => [a.pid, a]));
    return S.people.map(x => { const a = got.get(x.id); return x.choice === 'own' ? [x.name, 'own', 'own', x.ownTopic || '', ''] : [x.name, 'pool', a ? a.topicId : '', a ? a.title : '', a ? a.keywords : '']; });
  }
  const cell = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

  let choice = 'pool';
  sec.querySelectorAll('.da-choice button').forEach(b => b.onclick = () => {
    choice = b.dataset.c;
    sec.querySelectorAll('.da-choice button').forEach(o => { o.classList.toggle('on', o === b); o.setAttribute('aria-pressed', String(o === b)); });
    $('daOwnTopic').hidden = choice !== 'own';
  });
  $('daForm').onsubmit = e => {
    e.preventDefault();
    const name = $('daName').value.trim(); if (!name) return;
    S.people.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, choice, ownTopic: choice === 'own' ? $('daOwnTopic').value.trim() : '' });
    $('daName').value = ''; $('daOwnTopic').value = ''; sec.querySelector('.da-choice button[data-c="pool"]').click(); save(); render(); $('daName').focus();
  };
  $('daPasteBtn').onclick = () => {
    const names = $('daPaste').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    names.forEach((name, i) => S.people.push({ id: Date.now().toString(36) + i + Math.random().toString(36).slice(2, 6), name, choice: 'pool', ownTopic: '' }));
    $('daPaste').value = ''; sec.querySelector('details').open = false; save(); render();
  };
  $('daDraw').onclick = () => {
    const seed = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
    S.draw = { seed, drawnAt: Date.now(), assignments: computeDraw(seed) }; save(); render(); openStage();
  };
  $('daReplay').onclick = openStage;
  $('daReset').onclick = () => armed($('daReset'), 'Click again to reset', () => { S.draw = null; save(); render(); });
  $('daCsv').onclick = () => {
    const text = [['name', 'choice', 'topic_id', 'topic', 'keywords'], ...rows()].map(r => r.map(cell).join(',')).join('\n') + '\n';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = 'assignments.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  $('daCopy').onclick = async () => {
    const text = rows().map(r => r[0] + ': ' + (r[1] === 'own' ? r[3] + ' (own topic)' : r[2] ? '#' + r[2] + ' ' + r[3] : 'no topic yet')).join('\n');
    try { await navigator.clipboard.writeText(text); $('daCopy').textContent = 'Copied'; } catch (e) { $('daCopy').textContent = 'Copy blocked'; }
    setTimeout(() => ($('daCopy').textContent = 'Copy as text'), 2000);
  };

  // reveal
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let R = { i: -1, busy: false };
  function openStage() { if (!S.draw || !S.draw.assignments.length) return; R = { i: -1, busy: false }; $('daStage').hidden = false; next(); }
  function closeStage() { $('daStage').hidden = true; }
  function next() {
    const list = S.draw.assignments;
    if (R.busy) return;
    if (R.i >= list.length - 1) { closeStage(); return; }
    const a = list[++R.i];
    $('daCount').textContent = (R.i + 1) + ' / ' + list.length + '   ·   seed ' + S.draw.seed;
    $('daStageName').textContent = a.name;
    $('daNext').textContent = R.i === list.length - 1 ? 'Show the list' : 'Next';
    const land = () => { $('daSlip').classList.remove('spinning'); $('daSlipNo').textContent = '#' + String(a.topicId).padStart(2, '0'); $('daSlipT').textContent = a.title; R.busy = false; };
    if (reduce || topics.length < 2) return land();
    R.busy = true; $('daSlip').classList.add('spinning'); let n = 0;
    const tick = () => { const t = topics[Math.floor(Math.random() * topics.length)]; $('daSlipNo').textContent = '#' + String(t.id).padStart(2, '0'); $('daSlipT').textContent = t.title; if (++n < 14) setTimeout(tick, 60 + n * 8); else land(); };
    tick();
  }
  $('daNext').onclick = next;
  $('daClose').onclick = closeStage;
  // While the reveal is open, Space / → / Enter / Esc drive the draw instead of changing slides.
  window.addEventListener('keydown', e => {
    if ($('daStage').hidden || !sec.classList.contains('active')) return;
    if ([' ', 'ArrowRight', 'Enter', 'Escape'].includes(e.key)) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.key === 'Escape') closeStage(); else next();
    }
  }, true);
  render();
})();
</script>
</body>
</html>
