redits, mass, more energy.\u003c/p>\u003cp>\u003cb style=\"color:#1A6B62\">▲ Short gearing:\u003c/b> launch, hairpin exits. \u003cb style=\"color:#B8500F\">▼\u003c/b> stuck at 14 m/s.\u003c/p>\u003cp>\u003cb style=\"color:#1A6B62\">▲ Long gearing:\u003c/b> 20 m/s on long straights. \u003cb style=\"color:#B8500F\">▼\u003c/b> weak launch, energy at speed.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the model: motor and gearing\u003c/p>\n\u003caside>Read the three small plots left to right: the motor's power curve P/v (dashed) is the same in all three; the gearing caps the push at low speed (the flat top) and cuts it off at its top speed. Short gearing pulls hard but stops at 14 m/s; long gearing reaches 20 m/s but pulls weakly. A bigger motor lifts the dashed curve, which only matters above v = P / F_gear. Gearing costs no credits: the trade-off is pure physics.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model-grip", "html": "\u003csection id=\"p2-model-grip\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL · TYRES AND AERO\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Grip, rolling loss, drag and downforce\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:36px;align-items:flex-start\">\u003cdiv style=\"width:880px;flex:none;display:flex;flex-direction:column;gap:14px\">\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:31%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">TYRES\u003c/th>\u003cth style=\"width:21%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">GRIP μ\u003c/th>\u003cth style=\"width:26%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">ROLLING C_rr\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"hard\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.9\u003c/td>\u003ctd style=\"padding:11px 18px\">0.012\u003c/td>\u003ctd style=\"padding:11px 18px\">5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"medium\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">1.1\u003c/td>\u003ctd style=\"padding:11px 18px\">0.020\u003c/td>\u003ctd style=\"padding:11px 18px\">12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"soft\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">1.3\u003c/td>\u003ctd style=\"padding:11px 18px\">0.032\u003c/td>\u003ctd style=\"padding:11px 18px\">20\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#3E4A5C;padding:0 18px\">F_roll = C_rr·N &nbsp;(eq. 4) · grip budget μ·N &nbsp;(eq. 5)\u003c/p>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:25%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">AERO KIT\u003c/th>\u003cth style=\"width:20%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">DRAG C_D·A\u003c/th>\u003cth style=\"width:25%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">DOWNFORCE C_L·A\u003c/th>\u003cth style=\"width:14%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MASS\u003c/th>\u003cth style=\"width:16%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"none\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.35 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">0\u003c/td>\u003ctd style=\"padding:11px 18px\">0 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"lowdrag\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.30 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">0.3 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">2 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"downforce\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.50 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">1.2 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">4 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">20\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#3E4A5C;padding:0 18px\">F_drag = ½ρ·C_D·A·v² · F_down = ½ρ·C_L·A·v² &nbsp;(eq. 3)\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:26px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">SAFE CORNER SPEED · EQ. 6\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.4;color:#13203A\">v² = μ·g·cos α / (|κ| − μ·ρ·C_L·A / (2m))\u003c/p>\u003ctable style=\"font-size:22px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:56%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">STARTING CAR WITH…\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">R 10 m\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">R 40 m\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">hard tyres\u003c/td>\u003ctd style=\"padding:11px 18px\">9.5\u003c/td>\u003ctd style=\"padding:11px 18px\">19.5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">medium tyres \u003cspan style=\"color:#6B7280\">(starting car)\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">10.5\u003c/td>\u003ctd style=\"padding:11px 18px\">21.7\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">soft tyres\u003c/td>\u003ctd style=\"padding:11px 18px\">11.4\u003c/td>\u003ctd style=\"padding:11px 18px\">23.8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">no aero kit\u003c/td>\u003ctd style=\"padding:11px 18px\">10.4\u003c/td>\u003ctd style=\"padding:11px 18px\">20.8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">downforce kit\u003c/td>\u003ctd style=\"padding:11px 18px\">10.9\u003c/td>\u003ctd style=\"padding:11px 18px\">25.6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>medium tyres in mud\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cb>8.1\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cb>16.5\u003c/b>\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-size:19px;color:#6B7280\">m/s, from the Garage. Only one part changed each time.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;font-size:25px;line-height:1.35;color:#13203A\">\u003cp>\u003cb style=\"color:#1A6B62\">▲ Softer tyres:\u003c/b> faster corners, harder braking. \u003cb style=\"color:#B8500F\">▼\u003c/b> rolling loss: more energy (4× in mud), a little slower in a straight line.\u003c/p>\u003cp>\u003cb style=\"color:#1A6B62\">▲ Downforce:\u003c/b> grip in \u003ci>fast\u003c/i> corners, hardly any in hairpins. \u003cb style=\"color:#B8500F\">▼\u003c/b> drag on every straight, much more energy. Note: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">\"none\"\u003c/span> has \u003ci>more\u003c/i> drag than \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">\"lowdrag\"\u003c/span>.\u003c/p>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the model: tyres and aero\u003c/p>\n\u003caside>The corner-speed table is the point of this slide: soft tyres help everywhere in corners, while the downforce kit adds almost nothing in a 10 m hairpin (10.5 to 10.9 m/s) but a lot in a 40 m sweeper (21.7 to 25.6 m/s), because downforce grows with v². Ask: which path has hairpins, and which has fast sweepers? Then: what does each cost on the endurance?\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model-energy", "html": "\u003csection id=\"p2-model-energy\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL · BATTERY AND MASS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">What every lap costs\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px;align-items:stretch\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">BATTERY · EQ. 8\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#13203A\">E ← E − F_drive·v·dt / η, &nbsp;η = 0.85\u003c/p>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:30%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">OPTION\u003c/th>\u003cth style=\"width:26%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">ENERGY\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MASS\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"45Wh\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">45 Wh\u003c/td>\u003ctd style=\"padding:11px 18px\">5 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"70Wh\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">70 Wh\u003c/td>\u003ctd style=\"padding:11px 18px\">8 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">18\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"100Wh\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">100 Wh\u003c/td>\u003ctd style=\"padding:11px 18px\">12 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">30\u003c/td>\u003c/tr>\n\u003c/table>\u003cul style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">\u003cli>Energy is used only while driving, and faster costs more (drag grows with v²)\u003c/li>\u003cli>Braking recovers nothing; an empty battery means the car \u003cb>coasts\u003c/b>\u003c/li>\u003cli>Starting car, near-perfect driver: the endurance needs ≈ 58 Wh\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">MASS · EQS. 1, 4, 6, 9\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#13203A\">m = 70 kg chassis + parts\u003c/p>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:44%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">PART\u003c/th>\u003cth style=\"width:56%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">OPTIONS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Motor\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">7 · 11 · 16 kg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Battery\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">5 · 8 · 12 kg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Aero kit\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">0 · 2 · 4 kg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Tyres, gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">0 kg\u003c/td>\u003c/tr>\n\u003c/table>\u003cul style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">\u003cli>Every kilogram slows every acceleration (eq. 1)\u003c/li>\u003cli>Hills: F_grade = m·g·sin α; a 5&nbsp;% hill on 95 kg ≈ 46 N (eq. 9)\u003c/li>\u003cli>Without downforce, mass doesn't change the safe corner speed: m cancels in eq. 6\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:26px;line-height:1.35;color:#13203A\">\u003cb style=\"color:#1A6B62\">▲ Bigger battery:\u003c/b> the endurance at full pace without running dry. \u003cb style=\"color:#B8500F\">▼\u003c/b> credits and kilograms on every path, and it only helps if you would otherwise run out.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the model: battery and mass\u003c/p>\n\u003caside>The battery is the clearest 'just enough' part: with 45 Wh the starting car has to slow down on the endurance (estimated 136 s instead of 122 s), while 100 Wh gains nothing on that car and adds 4 kg to every path. Mass is not chosen directly: it follows from the motor, battery and aero, from 82 kg to 102 kg.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-paths", "html": "\u003csection id=\"p2-paths\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE PATHS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Four paths, four different tests\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px\">\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:20px 22px\">\u003cdiv style=\"display:flex;flex-direction:column;gap:2px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:29px;font-weight:600;color:#13203A\">Drag strip\u003c/h3>\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;color:#B8500F\">\"drag\"\u003c/span>\u003c/div>\u003csvg viewBox=\"0 0 520 300\" width=\"100%\" height=\"210\" role=\"img\" aria-label=\"Drag strip, side view of the layout\">\n\u003crect x=\"20\" y=\"128\" width=\"480\" height=\"44\" fill=\"#D9D3C7\"/>\n\u003crect x=\"420\" y=\"128\" width=\"27\" height=\"44\" fill=\"#FF8A3D\"/>\n\u003cline x1=\"500\" y1=\"110\" x2=\"500\" y2=\"190\" stroke=\"#13203A\" stroke-width=\"8\"/>\n\u003cline x1=\"420\" y1=\"116\" x2=\"420\" y2=\"184\" stroke=\"#13203A\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\n\u003crect x=\"17\" y=\"110\" width=\"6\" height=\"80\" fill=\"#B8500F\"/>\n\u003cg font-family=\"IBM Plex Sans, Arial\" font-size=\"20\" fill=\"#3E4A5C\">\n\u003ctext x=\"20\" y=\"100\" fill=\"#B8500F\">start\u003c/text>\u003ctext x=\"220\" y=\"210\" text-anchor=\"middle\">150 m, standing start\u003c/text>\n\u003ctext x=\"414\" e=\"font-size:21px;line-height:1.35;color:#1B2433\">383 m fast circuit with a 5&nbsp;% hill, 5 laps.\u003c/p>\u003cp style=\"font-size:18px;line-height:1.35;color:#3E4A5C\">Empty battery: the car coasts, and finishes only if it rolls over the line\u003c/p>\u003cp style=\"font-size:19px;line-height:1.35;color:#13203A\">\u003cb>Tests:\u003c/b> battery, aero, rolling loss, energy\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:20px 22px\">\u003cdiv style=\"display:flex;flex-direction:column;gap:2px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:29px;font-weight:600;color:#13203A\">Muddy road\u003c/h3>\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;color:#B8500F\">\"mud\"\u003c/span>\u003c/div>\u003csvg viewBox=\"0 0 520 300\" width=\"100%\" height=\"210\" role=\"img\" aria-label=\"mud path, top view\">\n\u003cpolyline points=\"214,286 220,286 227,286 234,286 240,286 247,286 253,286 260,286 266,286 273,286 280,286 286,286 293,286 299,286 306,286 312,286 319,286 326,286 332,286 339,286 345,286 352,285 358,284 364,281 370,278 375,273 379,268 382,262 384,256 385,249 385,243 385,236 385,230 385,223 385,217 385,210 385,203 385,197 385,190 385,184 385,177 385,171 385,164 385,157 385,151 385,144 384,138 381,132 378,126 374,121 369,117 364,113 358,110 351,109 345,109 338,108 332,108 325,108 318,108 312,108 305,108 299,108 292,108 286,108 279,106 273,103 269,99 265,93 262,87 260,81 260,75 260,68 260,61 260,55 260,48 260,42 258,35 256,29 252,24 247,20 241,17 235,15 228,14 222,14 215,14 208,14 202,14 195,14 189,14 182,14 176,14 169,14 163,16 157,18 151,22 146,26 142,31 139,37 136,43 135,50 135,56 135,63 135,69 135,76 135,82 135,89 135,96 135,102 135,109 135,115 135,122 135,128 135,135 135,142 135,148 135,155 135,161 135,168 135,174 135,181 135,188 135,194 135,201 135,207 135,214 135,220 13 \"#7A5230\" stroke-width=\"12\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n\u003cpolyline points=\"135,253 136,260 138,266 142,272 146,276 151,280 157,283 164,285 170,286 177,286 183,286 190,286 196,286 203,286\" fill=\"none\" stroke=\"#7A5230\" stroke-width=\"12\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n\u003crect x=\"211\" y=\"268\" width=\"6\" height=\"36\" fill=\"#B8500F\"/>\n\u003ctext x=\"214\" y=\"262\" text-anchor=\"middle\" font-size=\"18\" fill=\"#B8500F\" font-family=\"IBM Plex Sans, Arial\">start\u003c/text>\u003c/svg>\u003cp style=\"font-size:21px;line-height:1.35;color:#1B2433\">434 m rally loop, 1 lap: three mud sections (brown) and a hill.\u003c/p>\u003cp style=\"font-size:18px;line-height:1.35;color:#3E4A5C\">Mud: grip × 0.6, rolling resistance × 4, flagged ahead\u003c/p>\u003cp style=\"font-size:19px;line-height:1.35;color:#13203A\">\u003cb>Tests:\u003c/b> tyres, motor, energy, reading the road\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:25px;line-height:1.4;color:#13203A\">\u003cb>Race day:\u003c/b> the same four kinds of path with \u003cb>new layouts\u003c/b>: longer and busier, other lengths, radii and turn directions, wet or muddy patches. The wet loop is extra practice.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the practice paths, drawn from the simulator\u003c/p>\n\u003caside>These are the real practice layouts, drawn from the simulator. Each one leans on a different part of the design: the drag strip on power, gearing and the stop; the technical circuit on grip and the driver; the endurance on energy over five laps with a hill; the muddy road on traction, power and a driver that slows for mud it can see coming (previewPoints columns 4 and 5). On race day the layouts change, so anything tuned to these coordinates breaks. Practice commands: practiceRace('Path', 'drag' | 'technical' | 'endurance' | 'mud' | 'wet').\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-matrix", "html": "\u003csection id=\"p2-matrix\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · WHERE EACH PART MATTERS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Every path leans on different parts\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:23px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:13%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">PART\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">DRAG STRIP\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">TECHNICAL\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">ENDURANCE\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MUDDY ROAD\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Motor\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; launch, top
