<html lang="en">
<head>

<title>AI Workshop — slide viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0d1628; color: #f5f3ee; font: 15px Arial, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #334155; }
header strong { margin-right: auto; }
button, select { border: 1px solid #536279; background: #1e2b42; color: #fff; border-radius: 6px; padding: 8px 12px; font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #7fd3c7; outline-offset: 2px; }
label { display: flex; align-items: center; gap: 5px; }
#stage { flex: 1; min-height: 120px; position: relative; overflow: hidden; margin: 12px; }
#canvas { width: 1920px; height: 1080px; position: absolute; transform-origin: top left; background: #f5f3ee; }
#canvas > section { display: none !important; width: 1920px; height: 1080px; position: relative; overflow: hidden; }
#canvas > section.active { display: flex !important; }
#canvas h1, #canvas h2, #canvas h3, #canvas p { margin: 0; }
#canvas table { border-collapse: collapse; width: 100%; }
#canvas th, #canvas td { padding: 15px 18px; border-bottom: 1px solid #d9d5ce; vertical-align: top; }
#canvas ul, #canvas ol { padding-left: 1.25em; margin: 0; }
#canvas li + li { margin-top: .35em; }
#canvas aside { display: none; }
#notes { max-height: 25vh; overflow: auto; background: #18243a; padding: 16px 24px; border-top: 1px solid #334155; line-height: 1.5; white-space: pre-wrap; }
#notes[hidden] { display: none; }
footer { padding: 8px 18px; font-size: 12px; color: #b9c6d8; }
body.presenting header, body.presenting footer, body.presenting #notes { display: none; }
body.presenting #stage { margin: 0; }
/* ---- interactive topic draw (slide p1-draw); sizes are on the 1920x1080 slide canvas */
#canvas > section.drawapp { background: #13203A; color: #F5F3EE; font-family: 'IBM Plex Sans', Arial, sans-serif; padding: 60px 112px 52px; flex-direction: column; gap: 18px; }
.drawapp .da-head { display: flex; align-items: flex-end; gap: 48px; }
.drawapp .da-eyebrow { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 24px; letter-spacing: 2px; color: #7FD3C7; }
.drawapp .da-title { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 56px; font-weight: 600; line-height: 1.1; }
.drawapp .da-stats { display: flex; gap: 36px; margin-left: auto; font-variant-numeric: tabular-nums; }
.drawapp .da-stats div { display: flex; flex-direction: column; }
.drawapp .da-stats b { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 44px; line-height: 1; }
.drawapp .da-stats span { font-size: 20px; color: #9AA7BD; }
.drawapp .da-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.drawapp .da-btn { font: 600 24px 'IBM Plex Sans', Arial, sans-serif; padding: 14px 24px; border-radius: 12px; background: #1D2D4C; border: 2px solid #2C3D60; color: #F5F3EE; }
.drawapp .da-btn:hover:not(:disabled) { border-color: #9AA7BD; }
.drawapp .da-primary { background: #FF8A3D; border-color: #FF8A3D; color: #13203A; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 30px; padding: 16px 34px; }
.drawapp .da-armed { background: #FFC857 !important; border-color: #FFC857 !important; color: #13203A !important; }
.drawapp .da-note { font-size: 24px; color: #C9D3E3; }
.drawapp .da-body { display: grid; grid-template-columns: 1fr 1.55fr; gap: 32px; flex: 1; min-height: 0; }
.drawapp .da-pane { background: #16233D; border: 2px solid #2C3D60; border-radius: 18px; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.drawapp .da-h3 { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 30px; font-weight: 600; }
.drawapp form { display: flex; flex-wrap: wrap; gap: 12px; }
.drawapp input, .drawapp textarea { font: 24px 'IBM Plex Sans', Arial, sans-serif; color: #F5F3EE; background: #0F1A2F; border: 2px solid #2C3D60; border-radius: 10px; padding: 12px 14px; flex: 1 1 340px; min-width: 0; }
.drawapp textarea { width: 100%; min-height: 150px; resize: vertical; }
.drawapp input::placeholder, .drawapp textarea::placeholder { color: #9AA7BD; }
.drawapp .da-choice { display: inline-flex; border: 2px solid #2C3D60; border-radius: 10px; overflow: hidden; }
.drawapp .da-choice button { font: 600 22px 'IBM Plex Sans', Arial, sans-serif; padding: 12px 18px; background: transparent; border: none; border-radius: 0; color: #C9D3E3; }
.drawapp .da-choice button.on[data-c="pool"] { background: #3FB8A6; color: #13203A; }
.drawapp .da-choice button.on[data-c="own"] { background: #FF8A3D; color: #13203A; }
.drawapp details summary { font-size: 22px; color: #9AA7BD; cursor: pointer; }
.drawapp details[open] { display: flex; flex-direction: column; gap: 10px; }
#canvas .drawapp .da-list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; }
#canvas .drawapp .da-list li { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid #2C3D60; margin: 0; }
#canvas .drawapp .da-list li:first-child { border-top: none; }
.drawapp .da-chip { font: 600 18px 'JetBrains Mono', 'Courier New', monospace; padding: 4px 10px; border-radius: 999px; color: #13203A; min-width: 70px; text-align: center; }
.drawapp .da-chip.pool { background: #3FB8A6; } .drawapp .da-chip.own { background: #FF8A3D; }
.drawapp .da-who { display: flex; flex-direction: column; min-width: 0; }
.drawapp .da-who b { font-size: 26px; font-weight: 600; overflow-wrap: anywhere; }
.drawapp .da-who small { font-size: 21px; color: #9AA7BD; overflow-wrap: anywhere; }
.drawapp .da-who small.got { color: #FFC27F; }
.drawapp .da-x { font: 18px 'IBM Plex Sans', Arial, sans-serif; background: none; border: 2px solid transparent; color: #9AA7BD; padding: 6px 12px; }
.drawapp .da-x:hover { border-color: #2C3D60; }
.drawapp .da-empty { color: #9AA7BD; font-size: 22px; display: block !important; }
#canvas .drawapp .da-topics { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(10, auto); grid-auto-flow: column; column-gap: 36px; row-gap: 2px; margin: 0; padding: 0; list-style: none; overflow-x: hidden; overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
#canvas .drawapp .da-topics li { display: flex; gap: 12px; font-size: 20px; line-height: 1.2; padding: 3px 0; margin: 0; min-width: 0; }
#canvas .drawapp .da-topics li span { font: 600 19px 'JetBrains Mono', 'Courier New', monospace; color: #7FD3C7; min-width: 30px; padding-top: 2px; }
#canvas .drawapp .da-topics li.taken { color: #6E7C95; text-decoration: line-through; }
.drawapp .da-seed { font: 20px 'JetBrains Mono', 'Courier New', monospace; color: #9AA7BD; }
.drawapp .da-stage { position: absolute; inset: 0; background: #0F1A2F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; text-align: center; padding: 80px; z-index: 5; }
.drawapp .da-stage[hidden] { display: none; }
.drawapp .da-count { font: 28px 'JetBrains Mono', 'Courier New', monospace; color: #9AA7BD; letter-spacing: 3px; }
.drawapp .da-name { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 112px; font-weight: 700; line-height: 1.05; max-width: 1500px; }
.drawapp .da-slip { background: #F5F3EE; color: #13203A; border-radius: 8px; padding: 32px 48px; max-width: 1500px; min-height: 150px; display: flex; align-items: center; gap: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.4); transform: rotate(-1.2deg); }
.drawapp .da-slip .no { font: 600 40px 'JetBrains Mono', 'Courier New', monospace; color: #8A5A2B; }
.drawapp .da-slip .t { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 60px; font-weight: 700; line-height: 1.15; text-align: left; }
.drawapp .da-slip.spinning { filter: blur(1.5px); opacity: .8; }
.drawapp .da-hint { font-size: 22px; color: #9AA7BD; }
@media (prefers-reduced-motion: reduce) { .drawapp .da-slip { transform: none; } .drawapp .da-slip.spinning { filter: none; } }
@media print {
  @page { size: 16in 9in; margin: 0; }
  html, body { height: auto; background: white; display: block; }
  header, footer, #notes { display: none !important; }
  #stage { margin: 0; overflow: visible; }
  #canvas { position: static; width: auto; height: auto; transform: none !important; }
  #canvas > section { display: flex !important; width: 1920px; height: 1080px; zoom: .8; break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  #canvas > section:last-child { break-after: auto; }
  #canvas > section.excluded { display: none !important; }
}
</style>

<script id="slideData" type="application/json">[{"id": "cover", "html": "\u003csection id=\"cover\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between\">\n\u003cdiv style=\"position:absolute;left:0;top:0;width:1920px;height:16px;background:linear-gradient(90deg, #2A9D8F 0%, #2A9D8F 50%, #FF8A3D 50%, #FF8A3D 100%)\">\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#FF8A3D;letter-spacing:2px\">HANDS-ON WORKSHOP\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:32px\">\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:160px;font-weight:700;line-height:1.0;color:#F5F3EE\">AI Workshop\u003c/h1>\n\u003cp style=\"font-size:44px;line-height:1.3;color:#C9D3E3;width:1400px\">Put AI agents to work: on your research, and on a race car.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:32px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#7FD3C7\">Part 1 · AI tools\u003c/p>\n\u003cp style=\"font-size:28px;color:#C9D3E3\">Topic → literature review → research proposal\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;border-top:4px solid #FF8A3D;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#FF8A3D\">Part 2 · AI Grand Prix\u003c/p>\n\u003cp style=\"font-size:28px;color:#C9D3E3\">Design a car and its controller, then race everyone\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003caside>Welcome. Two halves today. In the first half you learn the vocabulary of AI tools and use an agent as a research assistant. After the break you become race engineers: you design a car and its controller with an agent that runs MATLAB for you, and everyone races at the end. [Presenter: date, room and duration still to be filled in.]\u003c/aside>\n\u003c/section>\n"}, {"id": "agenda", "html": "\u003csection id=\"agenda\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">THE DAY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Six blocks, two hands-on parts\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:30px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:18%;text-align:left\">Time\u003c/th>\u003cth style=\"width:34%;text-align:left\">Block\u003c/th>\u003cth style=\"width:48%;text-align:left\">What happens\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Opening\u003c/td>\u003ctd>The vocabulary of AI tools\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Setup check\u003c/td>\u003ctd>Everyone has ALL SET and four tools\u003c/td>\u003c/tr>\n\u003ctr style=\"background:#E3EFEC\">\u003ctd>[__:__]\u003c/td>\u003ctd>Part 1 · AI tools\u003c/td>\u003ctd>Topic → review → proposal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Break\u003c/td>\u003ctd>Coffee\u003c/td>\u003c/tr>\n\u003ctr style=\"background:#FBE8DA\">\u003ctd>[__:__]\u003c/td>\u003ctd>Part 2 · Grand Prix\u003c/td>\u003ctd>Design, test, improve your car\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Race and wrap-up\u003c/td>\u003ctd>Everyone races, awards, next steps\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Opening\u003c/p>\n\u003caside>Times are placeholders until the date and length are fixed. Suggested Part 1 split from the plan: vocabulary 10 min, grill-me 10, search 15, manual PDF download 15, review and proposal 30, figure and report 20.\u003c/aside>\n\u003c/section>\n"}, {"id": "status", "html": "\u003csection id=\"status\" data-transition=\"fade\" style=\"background:#E9E6DF;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">PREPARATION STATUS\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#13203A;color:#F5F3EE;padding:6px 20px;border-radius:999px;white-space:nowrap\">Instructor only · hide before class\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Where the preparation stands\u003c/h2>\n\u003cdiv style=\"display:flex;gap:32px;flex:1\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#F5F3EE;padding:40px;border-top:8px solid #1A6B62;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#1A6B62\">Ready\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.4\">\n\u003cli>One-command setup, one clean folder\u003c/li>\n\u003cli>Four tools: MATLAB, Scholar, Scopus, MarkItDown\u003c/li>\n\u003cli>Part 1 skills written\u003c/li>\n\u003cli>Baseline race runs through the agent's MATLAB tool (R2024b)\u003c/li>\n\u003cli>Grand Prix: parts, four paths, scoring, best model + ghost\u003c/li>\n\u003cli>Race day: finalRace, rehearsed with test models\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#F5F3EE;padding:40px;border-top:8px solid #4A5568;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#13203A\">To test\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.4\">\n\u003cli>Tools and skills inside the VS Code Antigravity extension\u003c/li>\n\u003cli>A real Scopus key\u003c/li>\n\u003cli>MATLAB R2025b\u003c/li>\n\u003cli>A lab PC with a student account\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#F5F3EE;padding:40px;border-top:8px solid #FF8A3D;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#B8500F\">To design\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.4\">\n\u003cli>Race-day secret number: makeFinals on the day\u003c/li>\n\u003cli>PaperViz figure: test on a lab PC\u003c/li>\n\u003cli>Topic list\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Instructor view (see instructor/TODO_WORKSHOP.md)\u003c/p>\n\u003caside>Instructor-only slide: mark it hidden before presenting. Details and owners are in instructor/TODO_WORKSHOP.md, sections 3, 4 and 7.\u003c/aside>\n\u003c/section>\n"}, {"id": "vocab-words", "html": "\u003csection id=\"vocab-words\" data-section=\"The vocabulary of AI tools.\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">VOCABULARY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Eight words you will hear today\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:26px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:17%;text-align:left\">Word\u003c/th>\u003cth style=\"width:45%;text-align:left\">What it is\u003c/th>\u003cth style=\"width:38%;text-align:left\">In this workshop\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Model\u003c/b>\u003c/td>\u003ctd>The \"brain\" that reads and writes text\u003c/td>\u003ctd>Claude Sonnet 4.6 · Gemini\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Agent\u003c/b>\u003c/td>\u003ctd>A model in a loop: plan → act → check\u003c/td>\u003ctd>The agent panel\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Harness\u003c/b>\u003c/td>\u003ctd>The app that runs the agent\u003c/td>\u003ctd>Antigravity\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Tool\u003c/b>\u003c/td>\u003ctd>One action the agent can take\u003c/td>\u003ctd>Run MATLAB code · search Scopus\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>MCP server\u003c/b>\u003c/td>\u003ctd>A plug-in that gives an agent new tools\u003c/td>\u003ctd>matlab · scholar · scopus\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Skill\u003c/b>\u003c/td>\u003ctd>A reusable recipe, loaded when needed\u003c/td>\u003ctd>grill-me · race-debrief\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Rules\u003c/b>\u003c/td>\u003ctd>Standing instructions, read every time\u003c/td>\u003ctd>AGENTS.md\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Subagent\u003c/b>\u003c/td>\u003ctd>A helper agent with a fresh memory\u003c/td>\u003ctd>Reads a batch of papers\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Vocabulary\u003c/p>\n\u003caside>Go row by row and point at the right-hand column: everything in it is something they will use today. MCP = Model Context Protocol, an open standard, so the same MATLAB plug works in Antigravity, Claude, Cursor and others. The difference between a tool and a skill: a tool is an action (run this code); a skill is know-how (how to do a literature search well), written as a text file.\u003c/aside>\n\u003c/section>\n"}, {"id": "vocab-stack", "html": "\u003csection id=\"vocab-stack\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">VOCABULARY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">How the pieces fit together\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:16px\">\n\u003cdiv style=\"width:240px;display:flex;flex-direction:column;gap:8px;background:#13203A;padding:32px;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#F5F3EE\">You\u003c/h3>\n\u003cp style=\"font-size:26px;color:#C9D3E3\">Ask in plain language\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#4A5568;width:80px;height:40px\">\u003c/x-shape>\n\u003cdiv style=\"width:640px;display:flex;flex-direction:column;gap:12px;border:3px solid #13203A;padding:32px;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#13203A\">Harness · Antigravity\u003c/h3>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Model\u003c/b> · Claude Sonnet 4.6 or Gemini\u003c/p>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Agent loop\u003c/b> · plan → act → check\u003c/p>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Rules\u003c/b> · AGENTS.md\u003c/p>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Skills\u003c/b> · SKILL.md recipes\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#4A5568;width:80px;height:40px\">\u003c/x-shape>\n\u003cdiv style=\"width:560px;display:flex;flex-direction:column;gap:12px;border:3px solid #1A6B62;padding:32px;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#1A6B62\">MCP servers → tools\u003c/h3>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>matlab\u003c/b> · run code and files\u003c/p>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>google-scholar\u003c/b> · find papers\u003c/p>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>scopus\u003c/b> · papers + citations\u003c/p>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>markitdown\u003c/b> · PDF → text\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Vocabulary\u003c/p>\n\u003caside>Read it left to right. You ask. The harness (Antigravity) runs a model in a loop and gives it rules and skills. When the agent needs to act on the outside world it calls a tool, and tools come from MCP servers. Swap the harness (Claude Code, Cursor) and the same MCP servers still work.\u003c/aside>\n\u003c/section>\n"}, {"id": "vocab-files", "html": "\u003csection id=\"vocab-files\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">VOCABULARY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">No magic: it is all text files you can open\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px;align-items:start\">\n\u003cdiv style=\"width:980px;display:flex;flex-direction:column;gap:6px;background:#13203A;padding:40px;border-radius:16px;font-family:'JetBrains Mono', 'Courier New', monospace\">\n\u003cp style=\"font-size:28px;color:#F5F3EE\">AI_Tools\\\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 40px\">AGENTS.md \u003cspan style=\"color:#FF8A3D\">← rules\u003c/span>\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 40px\">.agents\\\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 80px\">skills\\\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 120px\">grill-me\\SKILL.md \u003cspan style=\"color:#FF8A3D\">← a skill\u003c/span>\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 120px\">research-question\\\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 120px\">literature-search\\ …\u003c/p>\n\u003cp style=\"font-size:28px;color:#F5F3EE;padding:0 0 0 40px\">1_topic\\ … 6_report\\\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:24px\">\n\u003cp style=\"font-size:36px;line-height:1.3;color:#13203A\">Rules, skills and tool plugs are plain text.\u003c/p>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#3E4A5C\">Open them. Read them. Change one and watch the agent behave differently.\u003c/p>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#3E4A5C\">The tool plugs (MCP servers) are one list for every folder:\u003cbr>\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">%USERPROFILE%\\.gemini\\config\\mcp_config.json\u003c/span>\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Vocabulary\u003c/p>\n\u003caside>Live demo option: open AI_Tools\\.agents\\skills\\literature-search\\SKILL.md in VS Code and show that a skill is just a markdown recipe with a name and a description at the top. The agent reads the description to decide when to use it.\u003c/aside>\n\u003c/section>\n"}, {"id": "setup", "html": "\u003csection id=\"setup\" data-section=\"One command sets up everything in one clean folder.\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">SETUP\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">One command, one folder\u003c/h2>\n\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#F5F3EE;background:#13203A;padding:28px 32px;border-radius:12px\">irm https://raw.githubusercontent.com/Rasoolpey/AI_Grand_Prix/main/setup.ps1 | iex\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#13203A\">Before you paste it\u003c/h3>\n\u003col style=\"font-size:28px;line-height:1.5\">\n\u003cli>In VS Code, add the Google Antigravity extension and sign in\u003c/li>\n\u003cli>Get a Scopus key at dev.elsevier.com\u003c/li>\n\u003cli>Download the ZIP, extract it into Documents, open a terminal in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">AI_Grand_Prix-main\u003c/span>, paste the command\u003c/li>\n\u003cli>Wait for \u003cb>ALL SET!\u003c/b> (1–3 min)\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#E9E6DF;padding:32px;border-radius:16px;font-family:'JetBrains Mono', 'Courier New', monospace\">\n\u003cp style=\"font-size:26px;color:#13203A\">AI_Grand_Prix-main\\\u003c/p>\n\u003cp style=\"font-size:26px;color:#3E4A5C;padding:0 0 0 32px\">README.md\u003c/p>\n\u003cp style=\"font-size:26px;color:#3E4A5C;padding:0 0 0 32px\">AI_Tools\\       \u003cspan style=\"color:#1A6B62\">Part 1 + your key\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#3E4A5C;padding:0 0 0 32px\">AI_Grand_Prix\\  \u003cspan style=\"color:#B8500F\">Part 2\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#3E4A5C;padding:0 0 0 32px\">remove-keys.ps1\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Setup · no admin rights needed; the tools live inside this folder\u003c/p>\n\u003caside>The script finds MATLAB and installs everything inside the extracted folder, AI_Grand_Prix-main (the tools hide in a hidden .tools folder); it installs in whichever folder holds setup.ps1, AI_Tools and AI_Grand_Prix, so a Git clone works too. It registers the four MCP servers for the Antigravity extension (one global list, %USERPROFILE%\\.gemini\\config\\mcp_config.json) and the skills per part folder, adds the extension to VS Code if it is missing (per user, no admin), puts two shortcuts on the desktop, then tests each tool and drives a baseline race in MATLAB through the agent's tool. Re-running it is safe. Anyone with yellow [!!] lines: hand up. After ALL SET, reload VS Code (Ctrl+Shift+P, Reload Window).\u003c/aside>\n\u003c/section>\n"}, {"id": "keys", "html": "\u003csection id=\"keys\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">SETUP\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Your key: one file, in Part 1\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px;align-items:start\">\n\u003cdiv style=\"width:820px;display:flex;flex-direction:column;gap:8px;background:#13203A;padding:40px;border-radius:16px;font-family:'JetBrains Mono', 'Courier New', monospace\">\n\u003cp style=\"font-size:26px;color:#9AA7BD\"># AI_Tools\\my_keys.env\u003c/p>\n\u003cp style=\"font-size:30px;color:#F5F3EE\">SCOPUS_API_KEY=\u003cspan style=\"color:#FF8A3D\">your-key\u003c/span>\u003c/p>\n\u003cp style=\"font-size:30px;color:#F5F3EE\">SCOPUS_INST_TOKEN=\u003c/p>\n\u003c/div>\n\u003cul style=\"flex:1;font-size:30px;line-height:1.5\">\n\u003cli>Open it in VS Code, paste after the =\u003c/li>\n\u003cli>Save (Ctrl+S), then Reload Window (Ctrl+Shift+P)\u003c/li>\n\u003cli>Off campus: VPN or an institution token\u003c/li>\n\u003cli>Shared PC: run \u003cb>remove-keys.ps1\u003c/b> at the end\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Setup · the key never leaves your computer\u003c/p>\n\u003caside>Only Scopus needs a key. Setup asks for it and writes it into AI_Tools\\my_keys.env; students who skipped it paste it there later. The figure (PaperViz) needs no key: the agent draws it with Antigravity's built-in image generation. The Antigravity extension uses the student's own Google account; Google Scholar and MarkItDown need nothing.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-divider", "html": "\u003csection id=\"p1-divider\" data-section=\"Part 1: from a research topic to a literature review and a proposal with an AI agent.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n\u003cdiv style=\"position:absolute;left:0;top:0;width:24px;height:1080px;background:#2A9D8F\">\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;letter-spacing:2px;color:#7FD3C7\">PART 1\u003c/p>\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:140px;font-weight:700;line-height:1.0;color:#F5F3EE\">AI tools for research\u003c/h1>\n\u003cp style=\"font-size:44px;line-height:1.3;color:#C9D3E3;width:1400px\">From a topic to a research proposal, with an agent as your research assistant.\u003c/p>\n\u003cp style=\"font-size:28px;color:#9AA7BD\">Open \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">AI_Grand_Prix-main\\AI_Tools\u003c/span> in VS Code (or the desktop shortcut)\u003c/p>\n\u003caside>Check: everyone has AI_Tools open and the agent panel's MCP Servers list shows matlab, google-scholar, scopus and markitdown. Hand out topics now.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-topics", "html": "\u003csection id=\"p1-topics\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · YOUR TOPIC\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Bring your own topic, or join the draw\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:2px solid #CFE3DF;padding:40px;border-radius:16px\">\n\u003cx-icon name=\"Lightbulb\" style=\"color:#1A6B62;width:56px;height:56px\">\u003c/x-icon>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600\">Own topic\u003c/h3>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#3E4A5C\">You already have something you want to explore: a thesis idea, a project, a question you care about.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:2px solid #CFE3DF;padding:40px;border-radius:16px\">\n\u003cx-icon name=\"Star\" style=\"color:#1A6B62;width:56px;height:56px\">\u003c/x-icon>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600\">Topic pool\u003c/h3>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#3E4A5C\">Join the draw and get one of 20 engineering topics, each one testable in MATLAB.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#13203A\">Tell us your choice now: your name (or your group), \u003cb>own\u003c/b> or \u003cb>pool\u003c/b>. Then we draw lots live.\u003c/p>\n\u003cp style=\"font-size:28px;font-weight:600;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">▶ \u003ca href=\"https://claude.ai/artifact/Kqoie5VeZBXJkag3DCoUqx\" style=\"color:#FF8A3D\">Open the Topic Draw\u003c/a>  \u003cspan style=\"color:#C9D3E3;font-weight:400\">· the list fills in as you call out names\u003c/span>\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · individuals or groups\u003c/p>\n\u003caside>Click \"Open the Topic Draw\" (opens the instructor page). Type each name or group as students call it out, marked Pool or Own topic (with their topic); \"Paste a list of names\" adds many at once to the pool. Press Draw lots: the projector reveals one name and topic per key press, with the seed shown. Afterwards: Download assignments.csv or Copy as text. Own-topic students can start the research-question skill while the draw runs. Offline fallback: instructor/topics/draw_lots.m in MATLAB.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-pool", "html": "\u003csection id=\"p1-pool\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · THE TOPIC POOL\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#FF8A3D;color:#13203A;padding:6px 20px;border-radius:999px;white-space:nowrap\">DRAFT list\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">20 topics in the draw\u003c/h2>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:2px\">\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 1\u003c/span>  Battery thermal management in EVs\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 2\u003c/span>  MPC for autonomous racing\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 3\u003c/span>  State-of-charge estimation for batteries\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 4\u003c/span>  Grid-forming inverters\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 5\u003c/span>  Wind turbine pitch control\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 6\u003c/span>  Regenerative braking in EVs\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 7\u003c/span>  Robot path planning, moving obstacles\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 8\u003c/span>  Vibration in lightweight robot arms\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\"> 9\u003c/span>  Motor fault detection from vibration\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">10\u003c/span>  Home batteries and solar PV\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:2px\">\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">11\u003c/span>  Drone attitude control in gusts\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">12\u003c/span>  Active noise cancellation\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">13\u003c/span>  Solar MPPT under partial shading\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">14\u003c/span>  Vehicle-to-grid frequency support\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">15\u003c/span>  Traffic signals with reinforcement learning\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">16\u003c/span>  Tyre–road friction estimation\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">17\u003c/span>  Digital twins for maintenance\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">18\u003c/span>  Energy-efficient HVAC control\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">19\u003c/span>  Fuel cell vehicle energy management\u003c/p>\n\u003cp style=\"font-size:24px;line-height:1.45\">\u003cspan style=\"color:#1A6B62\">20\u003c/span>  IMU + GPS sensor fusion\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · draw live in the \u003ca href=\"https://claude.ai/artifact/Kqoie5VeZBXJkag3DCoUqx\" style=\"color:#1A6B62\">Topic Draw\u003c/a>, then copy your topic into 1_topic/my_topic.md\u003c/p>\n\u003caside>The draw runs in the Topic Draw page (link in the footer); the same 20 topics are loaded there and can be edited on the page. The list is a draft: keep this slide, the page and instructor/topics/topic_pool.csv in step. Offline fallback: draw_lots in MATLAB from instructor/topics.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-draw", "html": "\u003csection id=\"p1-draw\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#7FD3C7\">PART 1 · TOPIC DRAW\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#F5F3EE\">Drawing lots, live\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#7FD3C7\">1\u003c/p>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#C9D3E3\">Every name or group goes on the list: \u003cb>pool\u003c/b> or \u003cb>own topic\u003c/b>\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#7FD3C7\">2\u003c/p>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#C9D3E3\">Lots are drawn one by one: each pool entry gets a different topic\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;border-top:4px solid #FF8A3D;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#FF8A3D\">3\u003c/p>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#C9D3E3\">Copy your topic into \u003cb>1_topic/my_topic.md\u003c/b> and run the research-question skill\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"font-size:28px;font-weight:600;background:#1D2D4C;color:#F5F3EE;padding:20px 28px;border-radius:12px\">▶ \u003ca href=\"https://claude.ai/artifact/Kqoie5VeZBXJkag3DCoUqx\" style=\"color:#FF8A3D\">Open the Topic Draw\u003c/a>  \u003cspan style=\"color:#C9D3E3;font-weight:400\">· in the local viewer (index.html) this slide is the draw itself\u003c/span>\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#9AA7BD\">AI Workshop · Part 1 · the seed is shown, so the draw can be checked and repeated\u003c/p>\n\u003caside>In the local viewer (instructor/presentation/index.html, built by build_preview.py) this slide is the interactive draw: add names (Pool or Own topic), press Draw lots, reveal with Space or →, then Save assignments.csv. The list is remembered in that browser. In the online deck, use the \"Open the Topic Draw\" link instead. Offline fallback without a browser: draw_lots in MATLAB from instructor/topics.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-workspace", "html": "\u003csection id=\"p1-workspace\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · YOUR WORKSPACE\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Every result has its own folder\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:48px;align-items:start\">\n\u003cdiv style=\"width:960px;display:flex;flex-direction:column;gap:4px;background:#13203A;padding:36px 40px;border-radius:16px;font-family:'JetBrains Mono', 'Courier New', monospace\">\n\u003cp style=\"font-size:26px;color:#F5F3EE\">AI_Tools\\\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">my_keys.env        \u003cspan style=\"color:#FF8A3D\">← your Scopus key\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">my_instructions.md \u003cspan style=\"color:#FF8A3D\">← your rules\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">1_topic\\    \u003cspan style=\"color:#9AA7BD\">my_topic · research_brief\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">2_search\\   \u003cspan style=\"color:#9AA7BD\">papers.csv · search_log\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">3_papers\\   \u003cspan style=\"color:#9AA7BD\">pdf\\ (yours) · text\\\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">4_review\\   \u003cspan style=\"color:#9AA7BD\">evidence.csv · review\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">5_proposal\\ \u003cspan style=\"color:#9AA7BD\">proposal · figure\\\u003c/span>\u003c/p>\n\u003cp style=\"font-size:26px;color:#F5F3EE;padding:0 0 0 36px\">6_report\\   \u003cspan style=\"color:#9AA7BD\">report\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:24px\">\n\u003cp style=\"font-size:32px;line-height:1.35;color:#13203A\">The agent only writes into these files, so you always know where to look.\u003c/p>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#3E4A5C\">Each file starts as a template: you can see what will appear there before you begin.\u003c/p>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#3E4A5C\">Want it done differently? Write it in \u003cb>my_instructions.md\u003c/b>; your rules beat the defaults.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · the default rules are in AGENTS.md\u003c/p>\n\u003caside>Two files students edit themselves: my_keys.env (paste the Scopus key, save, reload the VS Code window) and my_instructions.md (optional overrides). Everything else is filled by the skills. Integrity and key-secrecy rules cannot be overridden.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-pipeline", "html": "\u003csection id=\"p1-pipeline\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · THE PIPELINE\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Six steps from topic to an IEEE report\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(3, 1fr);gap:24px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">1\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Sharpen the topic\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: research-question\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">2\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Search Scopus, Q1 only\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: literature-search\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">3\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Download the PDFs\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">you → 3_papers/pdf\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">4\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Review, gaps, proposal\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: literature-review\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">5\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Draw the figure\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: research-figure\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">6\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">IEEE report → PDF\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: research-report\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 1\u003c/p>\n\u003caside>Step 3 is the only manual step, and it is deliberate: students download through the library themselves. Everything else is the agent with tools and skills. The MATLAB experiment that would prove the idea is specified in the proposal but left pending; students finish it after the workshop.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step1", "html": "\u003csection id=\"p1-step1\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 1 OF 6\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Sharpen the topic into one research question\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\n\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the research-question skill\u003c/p>\n\u003cp style=\"width:620px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#1A6B62;background:#E3EFEC;padding:24px 28px;border-radius:12px\">→ 1_topic/research_brief.md\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\n\u003cdiv style=\"width:560px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">SKILL\u003c/p>\n\u003ch3 style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#13203A\">research-question\u003c/h3>\n\u003cp style=\"font-size:24px;line-height:1.35;color:#3E4A5C\">Reads your topic and interviews you until it is one precise, answerable question.\u003c/p>\n\u003cul style=\"font-size:23px;line-height:1.35;color:#1B2433\">\n\u003cli>At most 10 questions, most important first\u003c/li>\n\u003cli>Problem · scope · out of scope · evidence\u003c/li>\n\u003cli>Shows the brief, saves only when you agree\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">WHAT IT USES\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">grilling  (via grill-me)\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">Matt Pocock&#x27;s method: questions in rounds, each with a recommended answer\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">1_topic/my_topic.md  →  research_brief.md\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">question · scope · keywords · synonyms · what a good answer looks like\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">BUILT-IN\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">no MCP server\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">just conversation: no search yet\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · step 1 of 6\u003c/p>\n\u003caside>Point out that this is a skill, not a tool: a recipe for interviewing, written as a text file. Good answers here make the search in step 2 much better: the keywords and synonyms become the Scopus queries. Keep it to about 10 minutes.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step2", "html": "\u003csection id=\"p1-step2\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 2 OF 6\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Search Scopus, keep only Q1 journals\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\n\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the literature-search skill\u003c/p>\n\u003cp style=\"width:620px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#1A6B62;background:#E3EFEC;padding:24px 28px;border-radius:12px\">→ 2_search/papers.csv  (30–40 papers)\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\n\u003cdiv style=\"width:560px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">SKILL\u003c/p>\n\u003ch3 style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#13203A\">literature-search\u003c/h3>\n\u003cp style=\"font-size:24px;line-height:1.35;color:#3E4A5C\">Writes 3–5 Scopus queries from your brief, runs a filtered search, then judges relevance from the abstracts.\u003c/p>\n\u003cul style=\"font-size:23px;line-height:1.35;color:#1B2433\">\n\u003cli>Only journal articles and reviews\u003c/li>\n\u003cli>Only IEEE and Elsevier, only Q1\u003c/li>\n\u003cli>Relevance 0–3, keeps the 30–40 best\u003c/li>\n\u003cli>No paper that Scopus did not return\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">WHAT IT USES\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus_q1.py search &quot;QUERY&quot; … --since 2015\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">Scopus Search API + journal rank (Serial Title API): CiteScore percentile ≥ 75 = Q1 → candidates.csv\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus_q1.py finalize\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">refills every field from Scopus, drops anything invented, ranks: relevance → citations/year → recency\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">google-scholar · search_google_scholar_key_words(query, num_results)\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">optional extra; each find must pass  scopus_q1.py add &quot;&lt;DOI&gt;&quot;\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus · scopus_search(query, count)\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">quick hit count to test a query before the real search\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · step 2 of 6\u003c/p>\n\u003caside>Show the queries the agent proposes before it searches and ask students to check them against their keywords. Options students can ask for in my_instructions.md: --publishers ieee,elsevier,springer (or any), --max-quartile 2, --since. Q1 here is Scopus&#x27;s CiteScore quartile: the journal is in the top 25 % of at least one of its subject areas. About 15 minutes.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step3", "html": "\u003csection id=\"p1-step3\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 3 OF 6\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Download the PDFs yourself\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\n\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#FBE8DA;color:#13203A;border:2px solid #F3C9A8;padding:22px 30px;border-radius:12px\">(you)  Download the PDFs you can, through the library\u003c/p>\n\u003cp style=\"width:620px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#1A6B62;background:#E3EFEC;padding:24px 28px;border-radius:12px\">→ 3_papers/pdf/\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\n\u003cdiv style=\"width:560px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">THE STEP\u003c/p>\n\u003ch3 style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#13203A\">no agent in this step\u003c/h3>\n\u003cp style=\"font-size:24px;line-height:1.35;color:#3E4A5C\">Open each doi_link in papers.csv through the library (on campus or VPN) and save the PDF.\u003c/p>\n\u003cul style=\"font-size:23px;line-height:1.35;color:#1B2433\">\n\u003cli>Start with the top-ranked papers\u003c/li>\n\u003cli>Name it 03_Kabzan_2019.pdf, or keep the publisher&#x27;s name\u003c/li>\n\u003cli>No PDF? The paper stays abstract-only\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">WHAT IT USES\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">2_search/papers.csv\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">rank · title · venue · quartile · doi_link: your reading list\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">3_papers/pdf/&lt;rank&gt;_&lt;author&gt;_&lt;year&gt;.pdf\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">e.g. 03_Kabzan_2019.pdf; 1-s2.0-S0196…-main.pdf also works (matched by DOI or title)\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">BUILT-IN\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">your library account\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">licensed access is personal: the agent never downloads papers\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · step 3 of 6\u003c/p>\n\u003caside>Step 3 is the only manual step, on purpose: licensed access through the library is personal, and students choose which papers to read in full. Papers without a PDF are still used, marked abstract-only.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step4", "html": "\u003csection id=\"p1-step4\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 4 OF 6\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Read with evidence, find gaps, write the proposal\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\n\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the literature-review skill\u003c/p>\n\u003cp style=\"width:620px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#1A6B62;background:#E3EFEC;padding:24px 28px;border-radius:12px\">→ 4_review/  then  5_proposal/proposal.md\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\n\u003cdiv style=\"width:560px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">SKILL\u003c/p>\n\u003ch3 style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#13203A\">literature-review\u003c/h3>\n\u003cp style=\"font-size:24px;line-height:1.35;color:#3E4A5C\">Turns the PDFs into text, fills one evidence row per paper, writes the review and 3 candidate gaps; you pick one.\u003c/p>\n\u003cul style=\"font-size:23px;line-height:1.35;color:#1B2433\">\n\u003cli>evidence.csv: method · finding · limitation · where\u003c/li>\n\u003cli>review.md: 3–5 themes, every claim cited [rank]\u003c/li>\n\u003cli>Proposal with a Figure brief and a pending MATLAB experiment\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">WHAT IT USES\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">pdf_to_text.py  [--fast]\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">Docling (IBM): page-layout + table models, all PDFs → Markdown; matches each to its rank → index.csv\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">2_search/candidates.csv\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">the Scopus abstract of every paper without a PDF: marked abstract-only\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus · scopus_get_abstract(identifier_type=&quot;doi&quot;, identifier)\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">only if an abstract is missing\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">markitdown · convert_to_markdown(uri=&quot;file:///…&quot;)\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">fallback if Docling fails (lower quality)\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · step 4 of 6\u003c/p>\n\u003caside>Docling takes about 1–2 s per page on a laptop, so a few minutes for 15 papers: a good moment to explain evidence.csv. Ask each student to spot-check three claims in review.md against evidence.csv and the PDF. The agent stops and asks which gap to pursue before writing the proposal.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step5", "html": "\u003csection id=\"p1-step5\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 5 OF 6\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Draw the proposal&#x27;s figure with PaperViz\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\n\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the research-figure skill\u003c/p>\n\u003cp style=\"width:620px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#1A6B62;background:#E3EFEC;padding:24px 28px;border-radius:12px\">→ 5_proposal/figure/&lt;name&gt;.png\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\n\u003cdiv style=\"width:560px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">SKILL\u003c/p>\n\u003ch3 style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#13203A\">research-figure\u003c/h3>\n\u003cp style=\"font-size:24px;line-height:1.35;color:#3E4A5C\">Runs Google Research&#x27;s PaperViz method inside the agent to draw the proposal&#x27;s Figure brief.\u003c/p>\n\u003cul style=\"font-size:23px;line-height:1.35;color:#1B2433\">\n\u003cli>Tells you the plan first, you confirm\u003c/li>\n\u003cli>Never overwrites: _v2, _v3\u003c/li>\n\u003cli>You check every label before using it\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">WHAT IT USES\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">Planner → Stylist → Visualizer → Critic\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">four roles the agent plays in turn; the Critic sends it back at most twice\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">prompts.md · style_guide.md\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">PaperViz&#x27;s own prompts and diagram style guide (Apache-2.0)\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">BUILT-IN\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">image generation  (Antigravity, 16:9)\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">draws the figure: no API key, no cost\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">proposal.md: Method + Figure brief\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">the input; the final description is saved next to the image\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · step 5 of 6\u003c/p>\n\u003caside>PaperViz is github.com/google-research/papervizagent. Running its own code would need a paid Gemini API key; as a skill the agent follows the same prompts and draws with Antigravity&#x27;s built-in image model. Generated figures can contain wrong labels or invented details: students must check them.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step6", "html": "\u003csection id=\"p1-step6\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 6 OF 6\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:60px;font-weight:600;line-height:1.1;color:#13203A\">Write the report as an IEEE paper\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\n\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:
