;color:#6B7280\">AI Workshop · Part 1 · step 3 of 6\u003c/p>\n\u003caside>The only manual step, on purpose. Files named 1-s2.0-S0196...-main.pdf (ScienceDirect) also work: pdf_to_text.py matches them by PII, DOI or title.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-docling", "html": "\u003csection id=\"p1-tool-docling\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · SCRIPT pdf_to_text.py + Docling\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 4\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">From PDF to text the agent can read\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">A Python program in the literature-review skill. It uses \u003cb>Docling\u003c/b>, IBM's open-source document converter, to turn every PDF into Markdown with headings, paragraphs and tables, then matches each text to its paper.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">In the terminal, on your PC: Docling's page-layout and table AI models run on the processor (downloaded by setup). About 1–2 s per page: a few minutes for 15 papers. \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#13203A\">--fast\u003c/span>: quicker, rougher tables.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Nothing online. Your PDFs in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#13203A\">3_papers\\pdf\\\u003c/span>.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">WHAT IT DOES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>convert\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">3_papers/pdf/*.pdf → 3_papers/text/&lt;same name&gt;.md (only new or changed PDFs)\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>match\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">each text to its rank: file name (03_Kabzan_2019), ScienceDirect PII, DOI on page 1, or title\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>index\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">3_papers/text/index.csv, and the list of abstract-only papers (no PDF)\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">fallback\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">no Docling? it uses MarkItDown instead and says so (lower quality)\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> one terminal command and its progress, file by file; then the agent opens the texts (built-in file reading).\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: script pdf_to_text.py + docling\u003c/p>\n\u003caside>Docling is the reason students can trust 'full-text': the agent reads the actual paper, tables included. Papers without a PDF stay abstract-only and are marked as such in evidence.csv.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-markitdown", "html": "\u003csection id=\"p1-tool-markitdown\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · MCP SERVER markitdown\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 4 · FALLBACK\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">The back-up converter\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">Microsoft's MarkItDown as an MCP server: it turns a file (PDF, Word, PowerPoint, Excel, HTML) into Markdown text the agent can read.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">On your PC. Antigravity starts it with the others; it only works when the agent calls it.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Nothing: no key, no internet for local files.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">THE TOOL IT GIVES THE AGENT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>convert_to_markdown(uri)\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">one file → Markdown, e.g. uri = \"file:///C:/.../3_papers/pdf/03_Kabzan_2019.pdf\"\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> a tool-call card \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#7FD3C7\">convert_to_markdown\u003c/span> with a file:/// address. You should rarely see it: Docling comes first.\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: mcp server markitdown\u003c/p>\n\u003caside>Used only if pdf_to_text.py fails (AGENTS.md §3). The text is rougher than Docling's: words can run together and tables lose their shape, so findings taken from it deserve a second look.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step4", "html": "\u003csection id=\"p1-step4\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 4 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:600;line-height:1.1;color:#13203A\">Read with evidence, find gaps, write the proposal\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">Run the literature-review skill\u003c/p>\u003cp style=\"width:560px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;color:#1A6B62;background:#E3EFEC;padding:20px 26px;border-radius:12px\">→ 4_review/  then  5_proposal/proposal.md\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT RUNS, IN ORDER\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">1\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>pdf_to_text.py\u003c/b>: Docling turns every PDF into text → 3_papers/text/ (1–2 s per page)\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">2\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">MCP\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">fallback only: \u003cb>convert_to_markdown\u003c/b> (markitdown) if Docling fails\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">3\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">MCP\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>scopus_get_abstract\u003c/b> for an abstract-only paper with no abstract yet\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">4\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">reads the texts in batches of 5 → one row per paper in \u003cb>evidence.csv\u003c/b>\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">5\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">writes \u003cb>review.md\u003c/b>: 3–5 themes, every claim cited [rank], 3 candidate gaps\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">6\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">asks you to choose a gap, then writes \u003cb>proposal.md\u003c/b> with a Figure brief\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFF8DC;border:2px solid #EBD9A0;padding:24px 28px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">YOU\u003c/p>\u003cul style=\"font-size:23px;line-height:1.4;color:#1B2433\">\u003cli>Choose the gap: the agent waits for you\u003c/li>\u003cli>Spot-check 3 claims against evidence.csv and the PDF\u003c/li>\u003cli>Abstract-only claims are weaker\u003c/li>\u003c/ul>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">TOOLS IN THIS STEP\u003c/p>\u003cp style=\"line-height:2.1\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">literature-review\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">pdf_to_text.py\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">Docling\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">markitdown\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">scopus\u003c/span>\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · step 4 of 6\u003c/p>\n\u003caside>Docling takes a few minutes for 15 papers: a good moment to explain evidence.csv. The proposal's MATLAB experiment stays PENDING.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-paperviz", "html": "\u003csection id=\"p1-tool-paperviz\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · PAPERVIZ + IMAGE GENERATION\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 5\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">Four roles, one figure\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">PaperViz is Google Research's method for academic figures. The research-figure skill makes the agent play its four roles in turn, and draw with its \u003cb>own built-in image generation\u003c/b>.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Inside the agent: no server, no script. The prompts and style rules are files in the skill: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#13203A\">prompts.md · style_guide.md\u003c/span>.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Nothing: no API key, no cost.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">THE FOUR ROLES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>Planner\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">a detailed description: every element, arrow, label and colour, from your Method and Figure brief\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>Stylist\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">refines the look only, with the style guide; the content stays\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>Visualizer\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">built-in image generation, 16:9 → 5_proposal/figure/&lt;name&gt;.png\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>Critic\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">checks labels and faithfulness; at most two redraws (_v2, _v3)\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> the plan in 3–4 lines (confirm it), then the image and the critic's notes. Check every label before you use it.\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: paperviz + image generation\u003c/p>\n\u003caside>PaperViz itself (github.com/google-research/papervizagent) needs a paid Gemini key; as a skill the agent follows the same prompts and draws with Antigravity's image model. If the agent has no image tool it must say so, not fake a figure.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step5", "html": "\u003csection id=\"p1-step5\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 5 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:600;line-height:1.1;color:#13203A\">Draw the proposal's figure with PaperViz\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">Run the research-figure skill\u003c/p>\u003cp style=\"width:560px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;color:#1A6B62;background:#E3EFEC;padding:20px 26px;border-radius:12px\">→ 5_proposal/figure/&lt;name&gt;.png\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT RUNS, IN ORDER\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">1\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SKILL\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>research-figure\u003c/b> reads your Method and \u003cb>Figure brief\u003c/b>, tells you the plan in 3–4 lines\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">2\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SKILL\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>Planner\u003c/b> then \u003cb>Stylist\u003c/b> (prompts.md, style_guide.md) write the figure's description\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">3\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>image generation\u003c/b> draws it, 16:9 → 5_proposal/figure/&lt;name&gt;.png\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">4\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SKILL\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>Critic\u003c/b> checks it; at most two redraws (_v2, _v3)\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">5\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">FILES\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">saves the description and links the figure in proposal.md\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFF8DC;border:2px solid #EBD9A0;padding:24px 28px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">YOU\u003c/p>\u003cul style=\"font-size:23px;line-height:1.4;color:#1B2433\">\u003cli>Confirm or correct the plan first\u003c/li>\u003cli>Check every label in the image\u003c/li>\u003cli>Nothing drawn that the proposal does not say\u003c/li>\u003c/ul>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">TOOLS IN THIS STEP\u003c/p>\u003cp style=\"line-height:2.1\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">research-figure\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">PaperViz\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">image generation\u003c/span>\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · step 5 of 6\u003c/p>\n\u003caside>No server and no script: the agent plays PaperViz's four roles itself. Generated figures can contain wrong labels: students must check them before using them anywhere.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-report", "html": "\u003csection id=\"p1-tool-report\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · SCRIPT build_report.py + Overleaf\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 6\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">From Markdown to an IEEE PDF\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">A Python program in the research-report skill. It turns \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">6_report/report.md\u003c/span> into an IEEE conference paper (LaTeX, IEEEtran class) with an automatic IEEE reference list and your figure.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">In the terminal, on your PC, for the files. The PDF is made online by \u003cb>Overleaf\u003c/b> (pdflatex): no LaTeX on your PC.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">A free Overleaf account (sign in before you click).\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">WHAT IT WRITES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>overleaf/main.tex\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">two-column IEEE paper\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>overleaf/references.bib\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">only the papers you cite, numbered by first citation\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">report_overleaf.zip\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">for Overleaf → New Project → Upload Project\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>open_in_overleaf.html\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">double-click it: one button opens and compiles the paper\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>checks\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">stops on a citation not in papers.csv, a missing figure, or the proposal's figure unused\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> a terminal command, then its report: ERROR or WARNING lines to fix, and the length in words and pages (aim: about 4).\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: script build_report.py + overleaf\u003c/p>\n\u003caside>To change the text: edit report.md and ask the agent to build again, or edit main.tex directly in Overleaf.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step6", "html": "\u003csection id=\"p1-step6\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 6 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:600;line-height:1.1;color:#13203A\">Write the report as an IEEE paper\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">Run the research-report skill\u003c/p>\u003cp style=\"width:560px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;color:#1A6B62;background:#E3EFEC;padding:20px 26px;border-radius:12px\">→ 6_report/report.md → PDF in Overleaf\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT RUNS, IN ORDER\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">1\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">asks your name, department, what the agent did well and what you had to correct\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">2\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">writes \u003cb>report.md\u003c/b>: fixed IEEE sections, citations [rank] only, no new facts\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">3\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>build_report.py\u003c/b>: LaTeX (IEEEtran) + references + figure → open_in_overleaf.html\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">4\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">WEB\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">you double-click \u003cb>open_in_overleaf.html\u003c/b>: Overleaf compiles the PDF\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFF8DC;border:2px solid #EBD9A0;padding:24px 28px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">YOU\u003c/p>\u003cul style=\"font-size:23px;line-height:1.4;color:#1B2433\">\u003cli>Sign in to Overleaf first (free account)\u003c/li>\u003cli>Read it: you are the author\u003c/li>\u003cli>Change the text in report.md, then ask for a rebuild\u003c/li>\u003c/ul>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">TOOLS IN THIS STEP\u003c/p>\u003cp style=\"line-height:2.1\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">research-report\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">build_report.py\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">Overleaf\u003c/span>\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · step 6 of 6\u003c/p>\n\u003caside>If the Overleaf button fails: Overleaf, New Project, Upload Project, report_overleaf.zip. The 'Use of AI Tools' section is in the student's own words.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-rules", "html": "\u003csection id=\"p1-rules\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:center;gap:48px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#7FD3C7\">PART 1 · TRUST, BUT VERIFY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1.05;color:#F5F3EE\">You are the researcher. The agent is your assistant.\u003c/h2>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px\">\n\u003cp style=\"flex:1;font-size:30px;line-height:1.4;color:#C9D3E3;border-top:4px solid #2A9D8F;padding:20px 0 0 0\">No invented papers, authors or numbers\u003c/p>\n\u003cp style=\"flex:1;font-size:30px;line-height:1.4;color:#C9D3E3;border-top:4px solid #2A9D8F;padding:20px 0 0 0\">Every claim points to an evidence row\u003c/p>\n\u003cp style=\"flex:1;font-size:30px;line-height:1.4;color:#C9D3E3;border-top:4px solid #2A9D8F;padding:20px 0 0 0\">Abstract-only is never passed off as read\u003c/p>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#9AA7BD\">AI Workshop · Part 1 · These rules are in AI_Tools\\AGENTS.md\u003c/p>\n\u003caside>Ask each student to spot-check three claims in their review against evidence.csv and the PDF. If a claim has no row, delete it or ask the agent where it came from.\u003c/aside>\n\u003c/section>\n"}, {"id": "break", "html": "\u003csection id=\"break\" data-section=\"Break.\" data-transition=\"fade\" style=\"background:#FF8A3D;color:#13203A;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:180px;font-weight:700;line-height:1.0;color:#13203A\">Break\u003c/h1>\n\u003cp style=\"font-size:44px;color:#13203A\">Back in [__] minutes. Then: start your engines.\u003c/p>\n\u003caside>During the break, open AI_Grand_Prix-main\\AI_Grand_Prix in VS Code (or the desktop shortcut AI Workshop - Part 2 Grand Prix), and set car.team in student\\carDesign.m to your team name.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-divider", "html": "\u003csection id=\"p2-divider\" data-section=\"Part 2: the AI Grand Prix. The car and its model, four paths, the trade-offs, your best model, then six steps to race day.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n\u003cdiv style=\"position:absolute;left:0;top:0;width:24px;height:1080px;background:#FF8A3D\">\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;letter-spacing:2px;color:#FF8A3D\">PART 2\u003c/p>\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:140px;font-weight:700;line-height:1.0;color:#F5F3EE\">AI Grand Prix\u003c/h1>\n\u003cp style=\"font-size:44px;line-height:1.3;color:#C9D3E3;width:1400px\">You are the race engineer. The agent is your pit crew, and MATLAB is the track.\u003c/p>\n\u003cp style=\"font-size:28px;color:#9AA7BD\">Open \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">Documents\\AI_Grand_Prix-main\\AI_Grand_Prix\u003c/span> in VS Code\u003c/p>\n\u003caside>Part 2 in one breath: students build a car from five parts on a budget, write its driver, race it on four practice paths and then on new layouts on race day. They make every decision; the agent runs MATLAB and writes code. Running order: the car and how it is modelled, the paths, which part matters where, the trade-offs and scoring, then the five steps. Everything here is also in AI_Grand_Prix\\README.md.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-car", "html": "\u003csection id=\"p2-car\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · YOUR CAR\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">A 70 kg chassis, five parts and a driver\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:40px;align-items:center\">\u003csvg viewBox=\"0 0 600 600\" width=\"560\" height=\"560\" role=\"img\" aria-label=\"Top view of the car with its parts\" style=\"flex:none\">\n\u003crect x=\"160\" y=\"34\" width=\"280\" height=\"28\" rx=\"6\" fill=\"#FF8A3D\"/>\n\u003crect x=\"138\" y=\"92\" width=\"48\" height=\"96\" rx=\"12\" fill=\"#1B2433\"/>\u003crect x=\"414\" y=\"92\" width=\"48\" height=\"96\" rx=\"12\" fill=\"#1B2433\"/>\n\u003crect x=\"138\" y=\"408\" width=\"48\" height=\"104\" rx=\"12\" fill=\"#1B2433\"/>\u003crect x=\"414\" y=\"408\" width=\"48\" height=\"104\" rx=\"12\" fill=\"#1B2433\"/>\n\u003crect x=\"206\" y=\"62\" width=\"188\" height=\"490\" rx=\"80\" fill=\"#13203A\"/>\n\u003ccircle cx=\"300\" cy=\"180\" r=\"34\" fill=\"#F5F3EE\"/>\u003ctext x=\"300\" y=\"188\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#13203A\" font-family=\"JetBrains Mono, monospace\">AI\u003c/text>\n\u003crect x=\"236\" y=\"240\" width=\"128\" height=\"110\" rx=\"10\" fill=\"#2A9D8F\"/>\u003ctext x=\"300\" y=\"302\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#FFFFFF\" font-family=\"IBM Plex Sans, Arial\">BATTERY\u003c/text>\n\u003crect x=\"236\" y=\"372\" width=\"128\" height=\"82\" rx=\"10\" fill=\"#B8500F\"/>\u003ctext x=\"300\" y=\"420\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#FFFFFF\" font-family=\"IBM Plex Sans, Arial\">MOTOR\u003c/text>\n\u003crect x=\"262\" y=\"468\" width=\"76\" height=\"40\" rx=\"8\" fill=\"#9AA7BD\"/>\u003ctext x=\"300\" y=\"495\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#13203A\" font-family=\"IBM Plex Sans, Arial\">GEARS\u003c/text>\n\u003crect x=\"160\" y=\"556\" width=\"280\" height=\"30\" rx=\"6\" fill=\"#FF8A3D\"/>\n\u003cg font-family=\"IBM Plex Sans, Arial\" font-size=\"21\" fill=\"#3E4A5C\">\n\u003cline x1=\"160\" y1=\"48\" x2=\"70\" y2=\"48\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"6\" y=\"40\">aero kit\u003c/text>\n\u003cline x1=\"138\" y1=\"140\" x2=\"70\" y2=\"140\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"6\" y=\"132\">tyres\u003c/text>\n\u003cline x1=\"266\" y1=\"180\" x2=\"70\" y2=\"230\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"6\" y=\"252\">driver\u003c/text>\u003ctext x=\"6\" y=\"276\" font-size=\"17\">(your code)\u003c/text>\n\u003cline x1=\"364\" y1=\"295\" x2=\"480\" y2=\"295\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"594\" y=\"287\" text-anchor=\"end\">battery\u003c/text>\n\u003cline x1=\"364\" y1=\"413\" x2=\"480\" y2=\"360\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"594\" y=\"352\" text-anchor=\"end\">motor\u003c/text>\n\u003cline x1=\"338\" y1=\"488\" x2=\"480\" y2=\"540\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"594\" y=\"532\" text-anchor=\"end\">gearing\u003c/text>\n\u003ctext x=\"300\" y=\"20\" text-anchor=\"middle\" font-size=\"17\" fill=\"#6B7280\">front\u003c/text>\n\u003c/g>\u003c/svg>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:20px\">\u003ctable style=\"font-size:25px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">PART\u003c/th>\u003cth style=\"width:40%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">YOU CHOOSE\u003c/th>\u003cth style=\"width:38%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">IT SETS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Motor\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">2kW · 3.5kW · 5.5kW\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">power P\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Battery\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">45Wh · 70Wh · 100Wh\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">energy E\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Tyres\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">hard · medium · soft\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">grip μ, rolling loss C_rr\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Aero kit\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">none · lowdrag · downforce\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">drag C_D·A, downforce C_L·A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Gearing \u003cspan style=\"font-weight:400;color:#6B7280\">(free)\u003c/span>\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">short · medium · long\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">top speed v_gear, pull F_gear\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Driver\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">controller.m\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">throttle and steering, 50× a second\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-size:24px;line-height:1.4;color:#3E4A5C\">Chosen in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">student/carDesign.m\u003c/span> (five lines). The driver is your code in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">student/controller.m\u003c/span>.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px\">\u003cp style=\"flex:1;font-size:25px;line-height:1.3;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Budget 80 credits.\u003c/b> The best of everything costs 105.\u003c/p>\u003cp style=\"flex:1;font-size:25px;line-height:1.3;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Mass\u003c/b> = 70 kg + motor + battery + aero (82–102 kg).\u003c/p>\u003cp style=\"flex:1;font-size:25px;line-height:1.3;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Starting car:\u003c/b> 3.5kW · 70Wh · medium · lowdrag · medium. 60 credits, 91 kg.\u003c/p>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · your car\u003c/p>\n\u003caside>Walk round the drawing: the same top view appears in the garage figure. Each part changes one or two numbers in the physics; the next four slides show which. The driver is the sixth design decision and usually the bigger one: the Garage estimates assume a near-perfect driver, and the starting controller scores about 68 overall against estimates near 100.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model", "html": "\u003csection id=\"p2-model\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">One mass, a few forces, one grip budget\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:36px;align-items:flex-start\">\u003csvg viewBox=\"0 0 820 520\" width=\"820\" height=\"520\" role=\"img\" aria-label=\"Forces on the car\" style=\"flex:none\">\n\u003cdefs>\u003cmarker id=\"ah-t\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1A6B62\"/>\u003c/marker>\n\u003cmarker id=\"ah-o\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#B8500F\"/>\u003c/marker>\n\u003cmarker id=\"ah-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#FF8A3D\"/>\u003c/marker>\u003c/defs>\n\u003cline x1=\"30\" y1=\"404\" x2=\"790\" y2=\"404\" stroke=\"#9AA7BD\" stroke-width=\"3\"/>\n\u003crect x=\"300\" y=\"250\" width=\"230\" height=\"112\" rx=\"18\" fill=\"#13203A\"/>\n\u003ctext x=\"415\" y=\"316\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"700\" fill=\"#FFFFFF\" font-family=\"IBM Plex Sans, Arial\">mass m\u003c/text>\n\u003ccircle cx=\"350\" cy=\"380\" r=\"24\" fill=\"#1B2433\"/>\u003ccircle cx=\"480\" cy=\"380\" r=\"24\" fill=\"#1B2433\"/>\n\u003cline x1=\"530\" y1=\"306\" x2=\"700\" y2=\"306\" stroke=\"#1A6B62\" stroke-width=\"9\" marker-end=\"url(#ah-t)\"/>\n\u003ctext x=\"548\" y=\"286\" font-size=\"28\" font-weight=\"700\" fill=\"#1A6B62\" font-family=\"IBM Plex Sans, Arial\">F_drive\u003c/text>\n\u003ctext x=\"548\" y=\"346\" font-size=\"21\" fill=\"#3E4A5C\" font-family=\"IBM Plex Sans, Arial\">motor, through the gearing\u003c/text>\n\u003cg stroke=\"#B8500F\" stroke-width=\"7\">\u003cline x1=\"300\" y1=\"262\" x2=\"186\" y2=\"262\" marker-end=\"url(#ah-o)\"/>\u003cline x1=\"300\" y1=\"292\" x2=\"186\" y2=\"292\" marker-end=\"url(#ah-o)\"/>\n\u003cline x1=\"300\" y1=\"322\" x2=\"186\" y2=\"322\" marker-end=\"url(#ah-o)\"/>\u003cline x1=\"300\" y1=\"352\" x2=\"186\" y2=\"352\" marker-end=\"url(#ah-o)\"/>\u003c/g>\n\u003cg font-family=\"IBM Plex Sans, Arial\" font-size=\"23\" text-anchor=\"end\">\u003ctext x=\"172\" y=\"270\" fill=\"#B8500F\" font-weight=\"700\">F_drag \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">air\u003c/tspan>\u003c/text>\n\u003ctext x=\"172\" y=\"300\" fill=\"#B8500F\" font-weight=\"700\">F_roll \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">tyres\u003c/tspan>\u003c/text>\n\u003ctext x=\"172\" y=\"330\" fill=\"#B8500F\" font-weight=\"700\">F_grade \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">hill\u003c/tspan>\u003c/text>\n\u003ctext x=\"172\" y=\"360\" fill=\"#B8500F\" font-weight=\"700\">F_brake \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">brakes\u003c/tspan>\u003c/text>\u003c/g>\n\u003cline x1=\"415\" y1=\"110\" x2=\"415\" y2=\"240\" stroke=\"#FF8A3D\" stroke-width=\"9\" marker-end=\"url(#ah-a)\"/>\n\u003ctext x=\"436\" y=\"150\" font-size=\"26\" font-weight=\"700\" fill=\"#B8500F\" font-family=\"IBM Plex Sans, Arial\">F_down\u003c/text>\n\u003ctext x=\"436\" y=\"180\" font-size=\"21\" fill=\"#3E4A5C\" font-family=\"IBM Plex Sans, Arial\">aero kit: presses the car onto the road\u003c/text>\n\u003ctext x=\"415\" y=\"450\" text-anchor=\"middle\" font-size=\"25\" fill=\"#13203A\" font-family=\"JetBrains Mono, monospace\">N = m·g·cos α + F_down\u003c/text>\n\u003ctext x=\"415\" y=\"490\" text-anchor=\"middle\" font-size=\"22\" fill=\"#3E4A5C\" font-family=\"IBM Plex Sans, Arial\">load on the tyres: their grip budget is μ·N\u003c/text>\n\u003c/svg>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">EVERY 0.02 s\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">1\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Steer \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eq. 7\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">The front wheel turns towards your command: at most 0.5 rad, at most 1.5 rad/s.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">2\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Push and resist \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eqs. 1–4, 9\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">Speed changes by the force balance: m·dv/dt = F_drive − F_drag − F_roll − F_grade − F_brake.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">3\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Share the grip \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eq. 5\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">Turning, driving and braking share one budget: √(F_x² + F_y²) ≤ μ·N. Too much turning and the car understeers: it runs wide, with no grip left to brake. Wet or mud: μ × 0.6; mud also rolls 4× harder.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">4\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Spend energy \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eq. 8\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">E ← E − F_drive·v·dt / 0.85. Braking recovers nothing. An empty battery means no drive: the car coasts.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the nine equations are in AI_Grand_Prix\\PHYSICS.md\u003c/p>\n\u003caside>The whole simulator is these four steps with the nine short equations in PHYSICS.md. It is deterministic: the same car and driver always give the same run, so a change in the result is caused by a change the student made. The grip budget (eq. 5) is the one idea to land: braking in a corner steals grip from turning, which is why braking before the corner beats braking in it. In the race view, the HUD's friction-circle dot shows this live.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model-push", "html": "\u003csection id=\"p2-model-push\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL · MOTOR AND GEARING\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">How hard the car can push\u003c/h2>\n\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:20px 30px;border-radius:12px\">F_drive ≤ min(P / v, F_gear), and F_drive = 0 at or above v_gear \u003cspan style=\"color:#FF8A3D\">&nbsp;&nbsp;eq. 2\u003c/span>\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:36px;align-items:flex-start\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:18px\">\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:34%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MOTOR\u003c/th>\u003cth style=\"width:24%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">POWER P\u003c/th>\u003cth style=\"width:20%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MASS\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"2kW\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">2.0 kW\u003c/td>\u003ctd style=\"padding:11px 18px\">7 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"3.5kW\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">3.5 kW\u003c/td>\u003ctd style=\"padding:11px 18px\">11 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">20\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"5.5kW\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">5.5 kW\u003c/td>\u003ctd style=\"padding:11px 18px\">16 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">35\u003c/td>\u003c/tr>\n\u003c/table>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:34%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">GEARING (FREE)\u003c/th>\u003cth style=\"width:33%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">TOP SPEED v_gear\u003c/th>\u003cth style=\"width:33%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px
