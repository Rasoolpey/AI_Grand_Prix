<html lang="en">
<head>

<title>AI Workshop — slide viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0d1628; color: #f5f3ee; font: 15px Arial, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #334155; }
header strong { margin-right: auto; }
button, select { border: 1px solid #536279; background: #1e2b42; color: #fff; border-radius: 6px; padding: 8px 12px; font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #7fd3c7; outline-offset: 2px; }
label { display: flex; align-items: center; gap: 5px; }
#stage { flex: 1; min-height: 120px; position: relative; overflow: hidden; margin: 12px; }
#canvas { width: 1920px; height: 1080px; position: absolute; transform-origin: top left; background: #f5f3ee; }
#canvas > section { display: none !important; width: 1920px; height: 1080px; position: relative; overflow: hidden; }
#canvas > section.active { display: flex !important; }
#canvas h1, #canvas h2, #canvas h3, #canvas p { margin: 0; }
#canvas table { border-collapse: collapse; width: 100%; }
#canvas th, #canvas td { padding: 15px 18px; border-bottom: 1px solid #d9d5ce; vertical-align: top; }
#canvas ul, #canvas ol { padding-left: 1.25em; margin: 0; }
#canvas li + li { margin-top: .35em; }
#canvas aside { display: none; }
#notes { max-height: 25vh; overflow: auto; background: #18243a; padding: 16px 24px; border-top: 1px solid #334155; line-height: 1.5; white-space: pre-wrap; }
#notes[hidden] { display: none; }
footer { padding: 8px 18px; font-size: 12px; color: #b9c6d8; }
body.presenting header, body.presenting footer, body.presenting #notes { display: none; }
body.presenting #stage { margin: 0; }
/* ---- interactive topic draw (slide p1-draw); sizes are on the 1920x1080 slide canvas */
#canvas > section.drawapp { background: #13203A; color: #F5F3EE; font-family: 'IBM Plex Sans', Arial, sans-serif; padding: 60px 112px 52px; flex-direction: column; gap: 18px; }
.drawapp .da-head { display: flex; align-items: flex-end; gap: 48px; }
.drawapp .da-eyebrow { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 24px; letter-spacing: 2px; color: #7FD3C7; }
.drawapp .da-title { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 56px; font-weight: 600; line-height: 1.1; }
.drawapp .da-stats { display: flex; gap: 36px; margin-left: auto; font-variant-numeric: tabular-nums; }
.drawapp .da-stats div { display: flex; flex-direction: column; }
.drawapp .da-stats b { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 44px; line-height: 1; }
.drawapp .da-stats span { font-size: 20px; color: #9AA7BD; }
.drawapp .da-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.drawapp .da-btn { font: 600 24px 'IBM Plex Sans', Arial, sans-serif; padding: 14px 24px; border-radius: 12px; background: #1D2D4C; border: 2px solid #2C3D60; color: #F5F3EE; }
.drawapp .da-btn:hover:not(:disabled) { border-color: #9AA7BD; }
.drawapp .da-primary { background: #FF8A3D; border-color: #FF8A3D; color: #13203A; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 30px; padding: 16px 34px; }
.drawapp .da-armed { background: #FFC857 !important; border-color: #FFC857 !important; color: #13203A !important; }
.drawapp .da-note { font-size: 24px; color: #C9D3E3; }
.drawapp .da-body { display: grid; grid-template-columns: 1fr 1.55fr; gap: 32px; flex: 1; min-height: 0; }
.drawapp .da-pane { background: #16233D; border: 2px solid #2C3D60; border-radius: 18px; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.drawapp .da-h3 { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 30px; font-weight: 600; }
.drawapp form { display: flex; flex-wrap: wrap; gap: 12px; }
.drawapp input, .drawapp textarea { font: 24px 'IBM Plex Sans', Arial, sans-serif; color: #F5F3EE; background: #0F1A2F; border: 2px solid #2C3D60; border-radius: 10px; padding: 12px 14px; flex: 1 1 340px; min-width: 0; }
.drawapp textarea { width: 100%; min-height: 150px; resize: vertical; }
.drawapp input::placeholder, .drawapp textarea::placeholder { color: #9AA7BD; }
.drawapp .da-choice { display: inline-flex; border: 2px solid #2C3D60; border-radius: 10px; overflow: hidden; }
.drawapp .da-choice button { font: 600 22px 'IBM Plex Sans', Arial, sans-serif; padding: 12px 18px; background: transparent; border: none; border-radius: 0; color: #C9D3E3; }
.drawapp .da-choice button.on[data-c="pool"] { background: #3FB8A6; color: #13203A; }
.drawapp .da-choice button.on[data-c="own"] { background: #FF8A3D; color: #13203A; }
.drawapp details summary { font-size: 22px; color: #9AA7BD; cursor: pointer; }
.drawapp details[open] { display: flex; flex-direction: column; gap: 10px; }
#canvas .drawapp .da-list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; }
#canvas .drawapp .da-list li { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid #2C3D60; margin: 0; }
#canvas .drawapp .da-list li:first-child { border-top: none; }
.drawapp .da-chip { font: 600 18px 'JetBrains Mono', 'Courier New', monospace; padding: 4px 10px; border-radius: 999px; color: #13203A; min-width: 70px; text-align: center; }
.drawapp .da-chip.pool { background: #3FB8A6; } .drawapp .da-chip.own { background: #FF8A3D; }
.drawapp .da-who { display: flex; flex-direction: column; min-width: 0; }
.drawapp .da-who b { font-size: 26px; font-weight: 600; overflow-wrap: anywhere; }
.drawapp .da-who small { font-size: 21px; color: #9AA7BD; overflow-wrap: anywhere; }
.drawapp .da-who small.got { color: #FFC27F; }
.drawapp .da-x { font: 18px 'IBM Plex Sans', Arial, sans-serif; background: none; border: 2px solid transparent; color: #9AA7BD; padding: 6px 12px; }
.drawapp .da-x:hover { border-color: #2C3D60; }
.drawapp .da-empty { color: #9AA7BD; font-size: 22px; display: block !important; }
#canvas .drawapp .da-topics { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(10, auto); grid-auto-flow: column; column-gap: 36px; row-gap: 2px; margin: 0; padding: 0; list-style: none; overflow-x: hidden; overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
#canvas .drawapp .da-topics li { display: flex; gap: 12px; font-size: 20px; line-height: 1.2; padding: 3px 0; margin: 0; min-width: 0; }
#canvas .drawapp .da-topics li span { font: 600 19px 'JetBrains Mono', 'Courier New', monospace; color: #7FD3C7; min-width: 30px; padding-top: 2px; }
#canvas .drawapp .da-topics li.taken { color: #6E7C95; text-decoration: line-through; }
.drawapp .da-seed { font: 20px 'JetBrains Mono', 'Courier New', monospace; color: #9AA7BD; }
.drawapp .da-stage { position: absolute; inset: 0; background: #0F1A2F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; text-align: center; padding: 80px; z-index: 5; }
.drawapp .da-stage[hidden] { display: none; }
.drawapp .da-count { font: 28px 'JetBrains Mono', 'Courier New', monospace; color: #9AA7BD; letter-spacing: 3px; }
.drawapp .da-name { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 112px; font-weight: 700; line-height: 1.05; max-width: 1500px; }
.drawapp .da-slip { background: #F5F3EE; color: #13203A; border-radius: 8px; padding: 32px 48px; max-width: 1500px; min-height: 150px; display: flex; align-items: center; gap: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.4); transform: rotate(-1.2deg); }
.drawapp .da-slip .no { font: 600 40px 'JetBrains Mono', 'Courier New', monospace; color: #8A5A2B; }
.drawapp .da-slip .t { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 60px; font-weight: 700; line-height: 1.15; text-align: left; }
.drawapp .da-slip.spinning { filter: blur(1.5px); opacity: .8; }
.drawapp .da-hint { font-size: 22px; color: #9AA7BD; }
@media (prefers-reduced-motion: reduce) { .drawapp .da-slip { transform: none; } .drawapp .da-slip.spinning { filter: none; } }
@media print {
  @page { size: 16in 9in; margin: 0; }
  html, body { height: auto; background: white; display: block; }
  header, footer, #notes { display: none !important; }
  #stage { margin: 0; overflow: visible; }
  #canvas { position: static; width: auto; height: auto; transform: none !important; }
  #canvas > section { display: flex !important; width: 1920px; height: 1080px; zoom: .8; break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  #canvas > section:last-child { break-after: auto; }
  #canvas > section.excluded { display: none !important; }
}
</style>

<script id="slideData" type="application/json">[{"id": "cover", "html": "\u003csection id=\"cover\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between\">\n\u003cdiv style=\"position:absolute;left:0;top:0;width:1920px;height:16px;background:linear-gradient(90deg, #2A9D8F 0%, #2A9D8F 50%, #FF8A3D 50%, #FF8A3D 100%)\">\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#FF8A3D;letter-spacing:2px\">HANDS-ON WORKSHOP\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:32px\">\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:160px;font-weight:700;line-height:1.0;color:#F5F3EE\">AI Workshop\u003c/h1>\n\u003cp style=\"font-size:44px;line-height:1.3;color:#C9D3E3;width:1400px\">Put AI agents to work: on your research, and on a race car.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:32px\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;border-top:4px solid #2A9D8F;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#7FD3C7\">Part 1 · AI tools\u003c/p>\n\u003cp style=\"font-size:28px;color:#C9D3E3\">Topic → literature review → research proposal\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;border-top:4px solid #FF8A3D;padding:24px 0 0 0\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#FF8A3D\">Part 2 · AI Grand Prix\u003c/p>\n\u003cp style=\"font-size:28px;color:#C9D3E3\">Design a car and its controller, then race everyone\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003caside>Welcome. Two halves today. In the first half you learn the vocabulary of AI tools and use an agent as a research assistant. After the break you become race engineers: you design a car and its controller with an agent that runs MATLAB for you, and everyone races at the end. [Presenter: date, room and duration still to be filled in.]\u003c/aside>\n\u003c/section>\n"}, {"id": "agenda", "html": "\u003csection id=\"agenda\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">THE DAY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Six blocks, two hands-on parts\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:30px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:18%;text-align:left\">Time\u003c/th>\u003cth style=\"width:34%;text-align:left\">Block\u003c/th>\u003cth style=\"width:48%;text-align:left\">What happens\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Opening\u003c/td>\u003ctd>The vocabulary of AI tools\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Setup check\u003c/td>\u003ctd>Everyone has ALL SET and four tools\u003c/td>\u003c/tr>\n\u003ctr style=\"background:#E3EFEC\">\u003ctd>[__:__]\u003c/td>\u003ctd>Part 1 · AI tools\u003c/td>\u003ctd>Topic → review → proposal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Break\u003c/td>\u003ctd>Coffee\u003c/td>\u003c/tr>\n\u003ctr style=\"background:#FBE8DA\">\u003ctd>[__:__]\u003c/td>\u003ctd>Part 2 · Grand Prix\u003c/td>\u003ctd>Design, test, improve your car\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>[__:__]\u003c/td>\u003ctd>Race and wrap-up\u003c/td>\u003ctd>Everyone races, awards, next steps\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Opening\u003c/p>\n\u003caside>Times are placeholders until the date and length are fixed. Suggested Part 1 split from the plan: vocabulary 10 min, grill-me 10, search 15, manual PDF download 15, review and proposal 30, figure and report 20.\u003c/aside>\n\u003c/section>\n"}, {"id": "status", "html": "\u003csection id=\"status\" data-transition=\"fade\" style=\"background:#E9E6DF;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:24px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">PREPARATION STATUS\u003c/p>\n\u003cp style=\"font-size:24px;font-weight:600;background:#13203A;color:#F5F3EE;padding:6px 20px;border-radius:999px;white-space:nowrap\">Instructor only · hide before class\u003c/p>\n\u003c/div>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Where the preparation stands\u003c/h2>\n\u003cdiv style=\"display:flex;gap:32px;flex:1\">\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#F5F3EE;padding:40px;border-top:8px solid #1A6B62;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#1A6B62\">Ready\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.4\">\n\u003cli>One-command setup, one clean folder\u003c/li>\n\u003cli>Four tools: MATLAB, Scholar, Scopus, MarkItDown\u003c/li>\n\u003cli>Part 1 skills written\u003c/li>\n\u003cli>Baseline race runs through the agent's MATLAB tool (R2024b)\u003c/li>\n\u003cli>Grand Prix: parts, four paths, scoring, best model + ghost\u003c/li>\n\u003cli>Race day: finalRace, rehearsed with test models\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#F5F3EE;padding:40px;border-top:8px solid #4A5568;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#13203A\">To test\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.4\">\n\u003cli>Tools and skills inside the VS Code Antigravity extension\u003c/li>\n\u003cli>A real Scopus key\u003c/li>\n\u003cli>MATLAB R2025b\u003c/li>\n\u003cli>A lab PC with a student account\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#F5F3EE;padding:40px;border-top:8px solid #FF8A3D;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#B8500F\">To design\u003c/h3>\n\u003cul style=\"font-size:28px;line-height:1.4\">\n\u003cli>Race-day secret number: makeFinals on the day\u003c/li>\n\u003cli>PaperViz figure: test on a lab PC\u003c/li>\n\u003cli>Topic list\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Instructor view (see instructor/TODO_WORKSHOP.md)\u003c/p>\n\u003caside>Instructor-only slide: mark it hidden before presenting. Details and owners are in instructor/TODO_WORKSHOP.md, sections 3, 4 and 7.\u003c/aside>\n\u003c/section>\n"}, {"id": "vocab-words", "html": "\u003csection id=\"vocab-words\" data-section=\"The vocabulary of AI tools.\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">VOCABULARY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Eight words you will hear today\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:26px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:17%;text-align:left\">Word\u003c/th>\u003cth style=\"width:45%;text-align:left\">What it is\u003c/th>\u003cth style=\"width:38%;text-align:left\">In this workshop\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Model\u003c/b>\u003c/td>\u003ctd>The \"brain\" that reads and writes text\u003c/td>\u003ctd>Claude Sonnet 4.6 · Gemini\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Agent\u003c/b>\u003c/td>\u003ctd>A model in a loop: plan → act → check\u003c/td>\u003ctd>The agent panel\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Harness\u003c/b>\u003c/td>\u003ctd>The app that runs the agent\u003c/td>\u003ctd>Antigravity\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Tool\u003c/b>\u003c/td>\u003ctd>One action the agent can take\u003c/td>\u003ctd>Run MATLAB code · search Scopus\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>MCP server\u003c/b>\u003c/td>\u003ctd>A plug-in that gives an agent new tools\u003c/td>\u003ctd>matlab · scholar · scopus\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Skill\u003c/b>\u003c/td>\u003ctd>A reusable recipe, loaded when needed\u003c/td>\u003ctd>grill-me · race-debrief\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Rules\u003c/b>\u003c/td>\u003ctd>Standing instructions, read every time\u003c/td>\u003ctd>AGENTS.md\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Subagent\u003c/b>\u003c/td>\u003ctd>A helper agent with a fresh memory\u003c/td>\u003ctd>Reads a batch of papers\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Vocabulary\u003c/p>\n\u003caside>Go row by row and point at the right-hand column: everything in it is something they will use today. MCP = Model Context Protocol, an open standard, so the same MATLAB plug works in Antigravity, Claude, Cursor and others. The difference between a tool and a skill: a tool is an action (run this code); a skill is know-how (how to do a literature search well), written as a text file.\u003c/aside>\n\u003c/section>\n"}, {"id": "vocab-stack", "html": "\u003csection id=\"vocab-stack\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#4A5568\">VOCABULARY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">How the pieces fit together\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:16px\">\n\u003cdiv style=\"width:240px;display:flex;flex-direction:column;gap:8px;background:#13203A;padding:32px;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:40px;font-weight:600;color:#F5F3EE\">You\u003c/h3>\n\u003cp style=\"font-size:26px;color:#C9D3E3\">Ask in plain language\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#4A5568;width:80px;height:40px\">\u003c/x-shape>\n\u003cdiv style=\"width:640px;display:flex;flex-direction:column;gap:12px;border:3px solid #13203A;padding:32px;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#13203A\">Harness · Antigravity\u003c/h3>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Model\u003c/b> · Claude Sonnet 4.6 or Gemini\u003c/p>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Agent loop\u003c/b> · plan → act → check\u003c/p>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Rules\u003c/b> · AGENTS.md\u003c/p>\n\u003cp style=\"font-size:26px;background:#E9E6DF;padding:14px 20px;border-radius:10px\">\u003cb>Skills\u003c/b> · SKILL.md recipes\u003c/p>\n\u003c/div>\n\u003cx-shape kind=\"arrow-right\" style=\"background:#4A5568;width:80px;height:40px\">\u003c/x-shape>\n\u003cdiv style=\"width:560px;display:flex;flex-direction:column;gap:12px;border:3px solid #1A6B62;padding:32px;border-radius:16px\">\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;color:#1A6B62\">MCP servers → tools\u003c/h3>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>matlab\u003c/b> · run code and files\u003c/p>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>google-scholar\u003c/b> · find papers\u003c/p>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>scopus\u003c/b> · papers + citations\u003c/p>\n\u003cp style=\"font-size:26px;background:#E3EFEC;padding:14px 20px;border-radius:10px\">\u003cb>markitdown\u003c/b> · PDF → text\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Vocabulary\u003c/p>\n\u003caside>Read it left to right. You ask. The harness (Antigravity) runs a model in a loop and gives it rules and skills. When the agent needs to act on the outside world it calls a tool, and tools come from MCP servers. Swap the harness (Claude Code, Cursor) and the same MCP servers still work.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-divider", "html": "\u003csection id=\"p1-divider\" data-section=\"Part 1: from a research topic to a literature review and a proposal with an AI agent.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n\u003cdiv style=\"position:absolute;left:0;top:0;width:24px;height:1080px;background:#2A9D8F\">\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;letter-spacing:2px;color:#7FD3C7\">PART 1\u003c/p>\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:140px;font-weight:700;line-height:1.0;color:#F5F3EE\">AI tools for research\u003c/h1>\n\u003cp style=\"font-size:44px;line-height:1.3;color:#C9D3E3;width:1400px\">From a topic to a research proposal, with an agent as your research assistant.\u003c/p>\n\u003cp style=\"font-size:28px;color:#9AA7BD\">Open \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">AI_Grand_Prix-main\\AI_Tools\u003c/span> in VS Code (or the desktop shortcut)\u003c/p>\n\u003caside>Check: everyone has AI_Tools open and the agent panel's MCP Servers list shows matlab, google-scholar, scopus and markitdown. Hand out topics now.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-pipeline", "html": "\u003csection id=\"p1-pipeline\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · THE PIPELINE\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Six steps from topic to an IEEE report\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(3, 1fr);gap:24px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">1\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Sharpen the topic\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: research-question\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">2\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Search Scopus, Q1 only\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: literature-search\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#B8500F\">3\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Download the PDFs\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">you → 3_papers/pdf\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">4\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Review, gaps, proposal\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: literature-review\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">5\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">Draw the figure\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: research-figure\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #CFE3DF;padding:32px;border-radius:16px\">\n\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700;color:#1A6B62\">6\u003c/p>\n\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600\">IEEE report → PDF\u003c/h3>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#3E4A5C\">skill: research-report\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 1\u003c/p>\n\u003caside>Step 3 is the only manual step, and it is deliberate: students download through the library themselves. Everything else is the agent with tools and skills. The MATLAB experiment that would prove the idea is specified in the proposal but left pending; students finish it after the workshop.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-toolmap", "html": "\u003csection id=\"p1-toolmap\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:26px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · THE TOOL MAP\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:58px;font-weight:600;line-height:1.1;color:#13203A\">Which tools run at each step\u003c/h2>\u003c/div>\n\u003ctable style=\"font-size:20px;color:#1B2433\">\u003ctr>\u003cth style=\"text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:1px;color:#1A6B62;padding:14px 14px\">STEP\u003c/th>\u003cth style=\"text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:1px;color:#1A6B62;padding:14px 14px\">SKILL\u003c/th>\u003cth style=\"text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:1px;color:#13203A;padding:14px 14px\">MCP SERVERS\u003c/th>\u003cth style=\"text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:1px;color:#B8500F;padding:14px 14px\">SCRIPT\u003c/th>\u003cth style=\"text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:1px;color:#3E4A5C;padding:14px 14px\">BUILT-IN / YOU\u003c/th>\u003cth style=\"text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:1px;color:#1A6B62;padding:14px 14px\">RESULT\u003c/th>\u003c/tr>\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:27px;color:#1A6B62\">1\u003c/b> \u003cspan style=\"font-size:23px\">Sharpen the topic\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#1A6B62\">research-question\u003cbr>+ grilling\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#B8500F\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-size:21px;color:#3E4A5C\">ask you questions\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#3E4A5C\">1_topic/research_brief.md\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:27px;color:#1A6B62\">2\u003c/b> \u003cspan style=\"font-size:23px\">Search Scopus, Q1 only\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#1A6B62\">literature-search\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">scopus: test a query\u003cbr>google-scholar: optional\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#B8500F\">scopus_q1.py\u003cbr>search · add · finalize\u003c/td>\u003ctd style=\"padding:16px 14px;font-size:21px;color:#3E4A5C\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#3E4A5C\">2_search/papers.csv\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:27px;color:#1A6B62\">3\u003c/b> \u003cspan style=\"font-size:23px\">Download the PDFs\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#1A6B62\">\u003ci>you\u003c/i>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#B8500F\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-size:21px;color:#3E4A5C\">your library login\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#3E4A5C\">3_papers/pdf/\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:27px;color:#1A6B62\">4\u003c/b> \u003cspan style=\"font-size:23px\">Review, gaps, proposal\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#1A6B62\">literature-review\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">scopus: missing abstracts\u003cbr>markitdown: fallback\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#B8500F\">pdf_to_text.py\u003cbr>(Docling)\u003c/td>\u003ctd style=\"padding:16px 14px;font-size:21px;color:#3E4A5C\">read the texts\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#3E4A5C\">4_review/ · 5_proposal/\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:27px;color:#1A6B62\">5\u003c/b> \u003cspan style=\"font-size:23px\">Draw the figure\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#1A6B62\">research-figure\u003cbr>(PaperViz)\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#B8500F\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-size:21px;color:#3E4A5C\">image generation\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#3E4A5C\">5_proposal/figure/\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:27px;color:#1A6B62\">6\u003c/b> \u003cspan style=\"font-size:23px\">IEEE report → PDF\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#1A6B62\">research-report\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">—\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#B8500F\">build_report.py\u003c/td>\u003ctd style=\"padding:16px 14px;font-size:21px;color:#3E4A5C\">Overleaf (web)\u003c/td>\u003ctd style=\"padding:16px 14px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#3E4A5C\">6_report/\u003c/td>\u003c/tr>\u003c/table>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · the tool map\u003c/p>\n\u003caside>Keep this slide up while students work, or come back to it when someone asks 'what is it doing now?'. The middle columns are the things that run on their PC: the MCP servers start when Antigravity starts; the scripts run only when the agent launches them in the terminal.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-grilling", "html": "\u003csection id=\"p1-tool-grilling\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · SKILLS grill-me + grilling\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 1\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">The interview behind step 1\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SKILL\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">Two skills from Matt Pocock's open skill collection. \u003cb>grill-me\u003c/b> starts an interview; \u003cb>grilling\u003c/b> is the method: questions in rounds, one idea at a time, each with a recommended answer you can accept or change.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Nowhere but the conversation: a skill is only instructions. Setup copies the pinned version into \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#13203A\">AI_Tools\\.agents\\skills\\\u003c/span>.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Nothing: no server, no internet, no key.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">HOW research-question USES IT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>1 · read your topic\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">1_topic/my_topic.md; if it is still [...], it asks for it\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>2 · grill you\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">problem · scope · out of scope · what evidence would answer it\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>3 · stop at 10 questions\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">workshop rule in AGENTS.md: the most important first; the rest become stated assumptions\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>4 · show, then save\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">the brief is saved to 1_topic/research_brief.md only when you say yes\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> questions, one at a time, in the chat. No tool calls and no terminal: just you and the agent.\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: skills grill-me + grilling\u003c/p>\n\u003caside>This is the one step with no tools at all, on purpose: the quality of the question decides everything after it. The keywords and synonyms in the brief become the Scopus queries in step 2.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step1", "html": "\u003csection id=\"p1-step1\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 1 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:600;line-height:1.1;color:#13203A\">Write your topic, then sharpen it into one question\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">Run the research-question skill\u003c/p>\u003cp style=\"width:560px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;color:#1A6B62;background:#E3EFEC;padding:20px 26px;border-radius:12px\">→ 1_topic/research_brief.md\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT RUNS, IN ORDER\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">1\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FFF3C4;color:#7A5A00;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">YOU\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>first:\u003c/b> open \u003cb>1_topic/my_topic.md\u003c/b> in VS Code, write your name and your topic, save\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">2\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">FILES\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">the agent reads your topic\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">3\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SKILL\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>research-question\u003c/b> loads, and with it the \u003cb>grilling\u003c/b> method\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">4\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">asks you up to \u003cb>10 questions\u003c/b>, one at a time: problem, scope, out of scope, evidence\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">5\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">shows you the brief: question, scope, keywords, synonyms\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">6\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">FILES\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">saves \u003cb>research_brief.md\u003c/b>, only when you say yes\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFF8DC;border:2px solid #EBD9A0;padding:24px 28px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">YOU\u003c/p>\u003cul style=\"font-size:23px;line-height:1.4;color:#1B2433\">\u003cli>Write your topic in 1_topic/my_topic.md before you type the command\u003c/li>\u003cli>Answer in your own words; push back\u003c/li>\u003cli>Check the keywords: they become the search queries\u003c/li>\u003c/ul>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">TOOLS IN THIS STEP\u003c/p>\u003cp style=\"line-height:2.1\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">research-question\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">grill-me\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">grilling\u003c/span>\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · step 1 of 6\u003c/p>\n\u003caside>No MCP server and no script in this step: only the conversation. Good answers here make the search in step 2 much better. About 10 minutes.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-scopusq1", "html": "\u003csection id=\"p1-tool-scopusq1\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · SCRIPT scopus_q1.py\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 2\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">The Q1 filter: papers come only from here\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">A Python program in the literature-search skill. It searches Scopus with your queries and keeps only \u003cb>journal articles and reviews\u003c/b> from \u003cb>IEEE or Elsevier\u003c/b> in \u003cb>Q1 journals\u003c/b> (CiteScore percentile ≥ 75 in at least one subject area).\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">In the terminal, on your PC, with the workshop Python: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#13203A\">..\\.tools\\py\\Scripts\\python.exe .agents\\skills\\literature-search\\scripts\\scopus_q1.py search ...\u003c/span>. It calls Elsevier's Scopus Search API and Serial Title API (journal rank).\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Your Scopus key, read from \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#13203A\">my_keys.env\u003c/span> (never printed); on campus or the VPN. Standard Python only.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">ITS COMMANDS\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>search \"QUERY\" ... --since 2015\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">40 most relevant + 15 most cited per query, Q1 check → candidates.csv (with abstracts) + search_log.md\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">add \"&lt;DOI or exact title&gt;\"\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">checks a paper found elsewhere (Google Scholar); only Q1 papers are added\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>finalize\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">refills papers.csv from the Scopus records, drops anything not a candidate, ranks: relevance → citations/year → recency\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">selftest\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">one search and one journal lookup, to test the key\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> a terminal command (approve it if asked) and its output: how many candidates each query gave.\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: script scopus_q1.py\u003c/p>\n\u003caside>Why a script and not the agent: the filter must be the same every time and nothing invented can slip in. finalize overwrites every title, author and DOI with what Scopus says. Options students can set in my_instructions.md: --publishers ieee,elsevier,springer (or any), --max-quartile 2, --since.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-scopus", "html": "\u003csection id=\"p1-tool-scopus\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · MCP SERVER scopus\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 2 · STEP 4\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">Single Scopus lookups for the agent\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">An MCP server (github.com/JOSETRA44/scopus-mcp, pinned by setup) that lets the agent ask Scopus one question at a time. It is \u003cb>not\u003c/b> how the paper list is made: that is \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">scopus_q1.py\u003c/span>.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">On your PC: Antigravity starts it through a small loader that reads your key from \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;color:#13203A\">my_keys.env\u003c/span>, so the key is never in the tool list. It talks to api.elsevier.com.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Your Scopus key; on campus or the VPN (or an institution token).\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">THE TOOLS IT GIVES THE AGENT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>scopus_search(query, count)\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">a quick hit count, to test a query before the real search (step 2)\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>scopus_get_abstract(identifier_type, identifier)\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">the abstract of one paper by DOI, when it is missing (step 4)\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus_get_citation_count\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">how often a paper is cited\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus_get_citations_overview\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">citations per year\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">scopus_get_author · scopus_search_authors · scopus_search_affiliations\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">author and institution look-ups\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> a tool-call card named \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#7FD3C7\">scopus_search\u003c/span> or \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#7FD3C7\">scopus_get_abstract\u003c/span>, with its arguments and Scopus's reply.\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: mcp server scopus\u003c/p>\n\u003caside>If the key is missing or rejected, this server and scopus_q1.py both fail with a clear message: check AI_Tools\\my_keys.env and reload VS Code. The agent must never print or read the key itself (AGENTS.md §5).\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-tool-scholar", "html": "\u003csection id=\"p1-tool-scholar\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · TOOL · MCP SERVER google-scholar\u003c/p>\u003cp style=\"font-size:22px;font-weight:600;background:#1A6B62;color:#F5F3EE;padding:6px 18px;border-radius:999px;white-space:nowrap\">STEP 2 · OPTIONAL\u003c/p>\u003c/div>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:54px;font-weight:600;line-height:1.1;color:#13203A\">An optional second search\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:center\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:128px;flex:none\">MCP\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT IT IS\u003c/p>\u003c/div>\u003cp style=\"font-size:25px;line-height:1.4;color:#1B2433\">An MCP server (github.com/JackKuo666/Google-Scholar-MCP-Server, pinned) that searches Google Scholar. Useful for papers Scopus missed, but Scholar does not check quality, so every find must pass the Q1 filter: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#13203A\">scopus_q1.py add\u003c/span>.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHERE IT RUNS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">On your PC: it reads Google Scholar's public web pages. Heavy use can be slowed down or blocked by Google.\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">NEEDS\u003c/p>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Nothing: no key.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#13203A\">THE TOOLS IT GIVES THE AGENT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">\u003cb>search_google_scholar_key_words(query, num_results)\u003c/b> \u003cspan style=\"font-family:IBM Plex Sans, Arial;font-size:17px;font-weight:600;color:#1A6B62\">● used in the workshop\u003c/span>\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">a keyword search: titles, authors, links\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">search_google_scholar_advanced(query, author, year_range)\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">the same, by author or years\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:3px;border-top:1px solid #E3DDD2;padding-top:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">get_author_info(author_name)\u003c/p>\u003cp style=\"font-size:21px;line-height:1.35;color:#3E4A5C\">an author's profile and top papers\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:24px;line-height:1.4;color:#F5F3EE;background:#13203A;padding:16px 26px;border-radius:12px\">\u003cb style=\"color:#7FD3C7\">In the agent panel you see:\u003c/b> a tool-call card \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#7FD3C7\">search_google_scholar_key_words\u003c/span>, then a terminal command \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;color:#7FD3C7\">scopus_q1.py add ...\u003c/span>: only papers it reports as ADDED count.\u003c/p>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · tool: mcp server google-scholar\u003c/p>\n\u003caside>Google Scholar never replaces the Scopus search (AGENTS.md §3): if Scopus fails, the agent must say so, not quietly switch.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step2", "html": "\u003csection id=\"p1-step2\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 2 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:600;line-height:1.1;color:#13203A\">Search Scopus, keep only Q1 journals\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:26px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">Run the literature-search skill\u003c/p>\u003cp style=\"width:560px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;color:#1A6B62;background:#E3EFEC;padding:20px 26px;border-radius:12px\">→ 2_search/papers.csv (30–40 papers)\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT RUNS, IN ORDER\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">1\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E3EFEC;color:#1A6B62;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SKILL\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>literature-search\u003c/b> writes 3–5 Scopus queries from your brief and shows them to you\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">2\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">MCP\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">optional: \u003cb>scopus_search\u003c/b> tests a query's hit count\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">3\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>scopus_q1.py search\u003c/b>: Scopus + journal rank, Q1 / IEEE / Elsevier only → candidates.csv\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">4\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#13203A;color:#F5F3EE;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">MCP\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">optional: \u003cb>search_google_scholar_key_words\u003c/b>, each find checked by \u003cb>scopus_q1.py add\u003c/b>\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">5\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">BUILT-IN\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">scores every candidate's relevance 0–3 from its abstract, keeps the 30–40 best → papers.csv\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">6\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">SCRIPT\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">\u003cb>scopus_q1.py finalize\u003c/b>: refills every field from Scopus and ranks the list\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFF8DC;border:2px solid #EBD9A0;padding:24px 28px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">YOU\u003c/p>\u003cul style=\"font-size:23px;line-height:1.4;color:#1B2433\">\u003cli>Check the queries before it searches\u003c/li>\u003cli>Approve the terminal commands if asked\u003c/li>\u003cli>Skim papers.csv: does the list fit your question?\u003c/li>\u003c/ul>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">TOOLS IN THIS STEP\u003c/p>\u003cp style=\"line-height:2.1\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">literature-search\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">scopus_q1.py\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">scopus\u003c/span> \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">google-scholar\u003c/span>\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px;color:#6B7280\">AI Workshop · Part 1 · step 2 of 6\u003c/p>\n\u003caside>Papers come only from scopus_q1.py: the agent never adds a paper it rejected, and finalize overwrites every detail with the Scopus record. Q1 = the journal is in the top 25 % (CiteScore) of at least one subject area. About 15 minutes.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-step3", "html": "\u003csection id=\"p1-step3\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:104px 120px 140px;display:flex;flex-direction:column;gap:22px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · STEP 3 OF 6\u003c/p>\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:600;line-height:1.1;color:#13203A\">Download the PDFs yourself\u003c/h2>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px;align-items:stretch\">\u003cp style=\"flex:1;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;background:#13203A;color:#F5F3EE;padding:20px 28px;border-radius:12px\">(you) Download the PDFs you can, through the library\u003c/p>\u003cp style=\"width:560px;flex:none;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;line-height:1.35;color:#1A6B62;background:#E3EFEC;padding:20px 26px;border-radius:12px\">→ 3_papers/pdf/\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:26px;flex:1;min-height:0\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;border-radius:16px;padding:24px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#1A6B62\">WHAT RUNS, IN ORDER\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">1\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FFF3C4;color:#7A5A00;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">YOU\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">open each \u003cb>doi_link\u003c/b> in papers.csv, top-ranked first, on campus or through the VPN\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">2\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#FFF3C4;color:#7A5A00;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">YOU\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">save the PDF into \u003cb>3_papers/pdf/\u003c/b>: 03_Kabzan_2019.pdf, or keep the publisher's name\u003c/p>\u003c/div>\u003cdiv style=\"display:flex;flex-direction:row;gap:14px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:700;color:#1A6B62;width:26px;flex:none;line-height:1.15\">3\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:5px 0;border-radius:8px;text-align:center;width:118px;flex:none\">FILES\u003c/p>\u003cp style=\"font-size:24px;line-height:1.35;color:#1B2433\">no PDF for a paper? it stays \u003cb>abstract-only\u003c/b>, and is marked so later\u003c/p>\u003c/div>\u003c/div>\u003cdiv style=\"width:520px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFF8DC;border:2px solid #EBD9A0;padding:24px 28px;border-radius:16px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">YOU\u003c/p>\u003cul style=\"font-size:23px;line-height:1.4;color:#1B2433\">\u003cli>Licensed access is personal: the agent never downloads papers\u003c/li>\u003cli>Aim for the top 10–15 papers\u003c/li>\u003c/ul>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:19px;letter-spacing:2px;color:#7A5A00\">TOOLS IN THIS STEP\u003c/p>\u003cp style=\"line-height:2.1\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;background:#E3EFEC;color:#1A6B62;padding:4px 10px;border-radius:8px;white-space:nowrap\">your library login\u003c/span>\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:52px;width:1680px;font-size:22px
