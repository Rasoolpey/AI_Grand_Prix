#13203A;color:#F5F3EE;padding:22px 30px;border-radius:12px\">Run the research-report skill\u003c/p>\n\u003cp style=\"width:620px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;color:#1A6B62;background:#E3EFEC;padding:24px 28px;border-radius:12px\">→ 6_report/report.md  →  PDF in Overleaf\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px;flex:1;min-height:0\">\n\u003cdiv style=\"width:560px;flex:none;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">SKILL\u003c/p>\n\u003ch3 style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;font-weight:600;color:#13203A\">research-report\u003c/h3>\n\u003cp style=\"font-size:24px;line-height:1.35;color:#3E4A5C\">Asks your name and how you used the AI, then writes a ~4-page review paper with fixed IEEE sections.\u003c/p>\n\u003cul style=\"font-size:23px;line-height:1.35;color:#1B2433\">\n\u003cli>Abstract · Introduction · Search Method · Review · Gap and Proposed Study · MATLAB plan · Conclusion\u003c/li>\n\u003cli>Cites [rank] only; the reference list is automatic\u003c/li>\n\u003cli>Includes the comparison table and Fig. 1\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;border:2px solid #CFE3DF;padding:28px 32px;border-radius:16px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#1A6B62\">WHAT IT USES\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FBE8DA;color:#B8500F;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">SCRIPT\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">build_report.py  [--open]\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">report.md → IEEEtran LaTeX + IEEE references (cited papers only) + figure → report_overleaf.zip; stops on an unknown citation\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#FFFFFF;color:#13203A;border:2px solid #13203A;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">WEB\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">overleaf.com/docs  ·  snip_uri=&lt;zip&gt;  engine=pdflatex\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">open_in_overleaf.html: one click compiles the PDF online, no LaTeX on your PC\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px;align-items:flex-start\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:600;letter-spacing:1px;background:#E9E6DF;color:#3E4A5C;padding:6px 0;border-radius:8px;text-align:center;width:128px;flex:none\">FILES\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:23px;color:#13203A\">papers.csv · evidence.csv · review.md · proposal.md · figure/\u003c/p>\u003cp style=\"font-size:22px;line-height:1.3;color:#3E4A5C\">everything from steps 1–5; no new facts\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:120px;bottom:56px;width:1680px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · step 6 of 6\u003c/p>\n\u003caside>Students need a free Overleaf account (sign in before clicking). If the button fails: Overleaf, New Project, Upload Project, report_overleaf.zip. To change the text they edit report.md and ask the agent to build again, or edit main.tex in Overleaf directly.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-rules", "html": "\u003csection id=\"p1-rules\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:center;gap:48px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#7FD3C7\">PART 1 · TRUST, BUT VERIFY\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1.05;color:#F5F3EE\">You are the researcher. The agent is your assistant.\u003c/h2>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px\">\n\u003cp style=\"flex:1;font-size:30px;line-height:1.4;color:#C9D3E3;border-top:4px solid #2A9D8F;padding:20px 0 0 0\">No invented papers, authors or numbers\u003c/p>\n\u003cp style=\"flex:1;font-size:30px;line-height:1.4;color:#C9D3E3;border-top:4px solid #2A9D8F;padding:20px 0 0 0\">Every claim points to an evidence row\u003c/p>\n\u003cp style=\"flex:1;font-size:30px;line-height:1.4;color:#C9D3E3;border-top:4px solid #2A9D8F;padding:20px 0 0 0\">Abstract-only is never passed off as read\u003c/p>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#9AA7BD\">AI Workshop · Part 1 · These rules are in AI_Tools\\AGENTS.md\u003c/p>\n\u003caside>Ask each student to spot-check three claims in their review against evidence.csv and the PDF. If a claim has no row, delete it or ask the agent where it came from.\u003c/aside>\n\u003c/section>\n"}, {"id": "p1-outputs", "html": "\u003csection id=\"p1-outputs\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#1A6B62\">PART 1 · CHECKLIST\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;color:#13203A\">Before the break, you have\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(2, 1fr);gap:24px 64px\">\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cx-icon name=\"CheckCircle\" style=\"color:#1A6B62;width:44px;height:44px\">\u003c/x-icon>\u003cp style=\"font-size:32px\">A precise research question\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cx-icon name=\"CheckCircle\" style=\"color:#1A6B62;width:44px;height:44px\">\u003c/x-icon>\u003cp style=\"font-size:32px\">papers.csv · top 30–40\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cx-icon name=\"CheckCircle\" style=\"color:#1A6B62;width:44px;height:44px\">\u003c/x-icon>\u003cp style=\"font-size:32px\">evidence.csv\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cx-icon name=\"CheckCircle\" style=\"color:#1A6B62;width:44px;height:44px\">\u003c/x-icon>\u003cp style=\"font-size:32px\">review.md\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cx-icon name=\"CheckCircle\" style=\"color:#1A6B62;width:44px;height:44px\">\u003c/x-icon>\u003cp style=\"font-size:32px\">proposal.md + a figure\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;align-items:center;gap:20px\">\u003cx-icon name=\"Clock\" style=\"color:#B8500F;width:44px;height:44px\">\u003c/x-icon>\u003cp style=\"font-size:32px\">MATLAB experiment: pending\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 1 · then run the research-report skill → your IEEE report as a PDF in Overleaf\u003c/p>\n\u003caside>Students who finish early: ask the agent to sketch the MATLAB experiment's model (inputs, outputs) without running it.\u003c/aside>\n\u003c/section>\n"}, {"id": "break", "html": "\u003csection id=\"break\" data-section=\"Break.\" data-transition=\"fade\" style=\"background:#FF8A3D;color:#13203A;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:180px;font-weight:700;line-height:1.0;color:#13203A\">Break\u003c/h1>\n\u003cp style=\"font-size:44px;color:#13203A\">Back in [__] minutes. Then: start your engines.\u003c/p>\n\u003caside>During the break, open AI_Grand_Prix-main\\AI_Grand_Prix in VS Code (or the desktop shortcut AI Workshop - Part 2 Grand Prix), and set car.team in student\\carDesign.m to your team name.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-divider", "html": "\u003csection id=\"p2-divider\" data-section=\"Part 2: the AI Grand Prix. The car and its model, four paths, the trade-offs, your best model, then six steps to race day.\" data-transition=\"fade\" style=\"background:#13203A;color:#F5F3EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n\u003cdiv style=\"position:absolute;left:0;top:0;width:24px;height:1080px;background:#FF8A3D\">\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;letter-spacing:2px;color:#FF8A3D\">PART 2\u003c/p>\n\u003ch1 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:140px;font-weight:700;line-height:1.0;color:#F5F3EE\">AI Grand Prix\u003c/h1>\n\u003cp style=\"font-size:44px;line-height:1.3;color:#C9D3E3;width:1400px\">You are the race engineer. The agent is your pit crew, and MATLAB is the track.\u003c/p>\n\u003cp style=\"font-size:28px;color:#9AA7BD\">Open \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">Documents\\AI_Grand_Prix-main\\AI_Grand_Prix\u003c/span> in VS Code\u003c/p>\n\u003caside>Part 2 in one breath: students build a car from five parts on a budget, write its driver, race it on four practice paths and then on new layouts on race day. They make every decision; the agent runs MATLAB and writes code. Running order: the aim, the car and how it is modelled, the paths, which part matters where, the trade-offs and scoring, then the six steps. Everything here is also in AI_Grand_Prix\\README.md.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-mission", "html": "\u003csection id=\"p2-mission\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE AIM\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Build a car and its driver that finish every path, fast\u003c/h2>\n\u003c/div>\n\u003cp style=\"font-size:34px;line-height:1.4;color:#13203A;width:1600px\">There is \u003cb>no single best car\u003c/b>. Every part that helps somewhere costs you somewhere else, and you can't afford the best of everything. \u003cb style=\"color:#B8500F\">Find the sweet spot\u003c/b>, show it with data, and explain it.\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:28px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU HAND IN\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;line-height:1.2;color:#13203A\">Your best model and your engineering log\u003c/h3>\u003cp style=\"font-size:24px;line-height:1.4;color:#3E4A5C\">The car, driver and tuning that scored your best overall, saved automatically as \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px\">best_model/&lt;team&gt;.zip\u003c/span>. \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px\">submitCar\u003c/span> hands it in.\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU ARE SCORED ON\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;line-height:1.2;color:#13203A\">Race day: four paths you have never seen\u003c/h3>\u003cp style=\"font-size:24px;line-height:1.4;color:#3E4A5C\">Overall score across the drag strip, technical circuit, endurance and muddy road. Two awards are judged from your log.\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:30px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">YOU WILL LEARN\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:32px;font-weight:600;line-height:1.2;color:#13203A\">Trade-offs from data, with you in charge\u003c/h3>\u003cp style=\"font-size:24px;line-height:1.4;color:#3E4A5C\">Predict, test, read the data, decide. The agent does the legwork; you make the calls.\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:28px;line-height:1.4;color:#13203A\">\u003cb>The catch:\u003c/b> race day uses new layouts. A car and driver tuned to the practice layouts will be caught out.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the aim\u003c/p>\n\u003caside>Say the aim in one sentence, then the catch. Stress that there is no answer key: two teams can race different cars and both be right if they can show why. The engineering log is handed in with the car and is what the judges read for best engineering explanation and best use of the agent.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-car", "html": "\u003csection id=\"p2-car\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · YOUR CAR\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">A 70 kg chassis, five parts and a driver\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:40px;align-items:center\">\u003csvg viewBox=\"0 0 600 600\" width=\"560\" height=\"560\" role=\"img\" aria-label=\"Top view of the car with its parts\" style=\"flex:none\">\n\u003crect x=\"160\" y=\"34\" width=\"280\" height=\"28\" rx=\"6\" fill=\"#FF8A3D\"/>\n\u003crect x=\"138\" y=\"92\" width=\"48\" height=\"96\" rx=\"12\" fill=\"#1B2433\"/>\u003crect x=\"414\" y=\"92\" width=\"48\" height=\"96\" rx=\"12\" fill=\"#1B2433\"/>\n\u003crect x=\"138\" y=\"408\" width=\"48\" height=\"104\" rx=\"12\" fill=\"#1B2433\"/>\u003crect x=\"414\" y=\"408\" width=\"48\" height=\"104\" rx=\"12\" fill=\"#1B2433\"/>\n\u003crect x=\"206\" y=\"62\" width=\"188\" height=\"490\" rx=\"80\" fill=\"#13203A\"/>\n\u003ccircle cx=\"300\" cy=\"180\" r=\"34\" fill=\"#F5F3EE\"/>\u003ctext x=\"300\" y=\"188\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#13203A\" font-family=\"JetBrains Mono, monospace\">AI\u003c/text>\n\u003crect x=\"236\" y=\"240\" width=\"128\" height=\"110\" rx=\"10\" fill=\"#2A9D8F\"/>\u003ctext x=\"300\" y=\"302\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#FFFFFF\" font-family=\"IBM Plex Sans, Arial\">BATTERY\u003c/text>\n\u003crect x=\"236\" y=\"372\" width=\"128\" height=\"82\" rx=\"10\" fill=\"#B8500F\"/>\u003ctext x=\"300\" y=\"420\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#FFFFFF\" font-family=\"IBM Plex Sans, Arial\">MOTOR\u003c/text>\n\u003crect x=\"262\" y=\"468\" width=\"76\" height=\"40\" rx=\"8\" fill=\"#9AA7BD\"/>\u003ctext x=\"300\" y=\"495\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#13203A\" font-family=\"IBM Plex Sans, Arial\">GEARS\u003c/text>\n\u003crect x=\"160\" y=\"556\" width=\"280\" height=\"30\" rx=\"6\" fill=\"#FF8A3D\"/>\n\u003cg font-family=\"IBM Plex Sans, Arial\" font-size=\"21\" fill=\"#3E4A5C\">\n\u003cline x1=\"160\" y1=\"48\" x2=\"70\" y2=\"48\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"6\" y=\"40\">aero kit\u003c/text>\n\u003cline x1=\"138\" y1=\"140\" x2=\"70\" y2=\"140\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"6\" y=\"132\">tyres\u003c/text>\n\u003cline x1=\"266\" y1=\"180\" x2=\"70\" y2=\"230\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"6\" y=\"252\">driver\u003c/text>\u003ctext x=\"6\" y=\"276\" font-size=\"17\">(your code)\u003c/text>\n\u003cline x1=\"364\" y1=\"295\" x2=\"480\" y2=\"295\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"594\" y=\"287\" text-anchor=\"end\">battery\u003c/text>\n\u003cline x1=\"364\" y1=\"413\" x2=\"480\" y2=\"360\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"594\" y=\"352\" text-anchor=\"end\">motor\u003c/text>\n\u003cline x1=\"338\" y1=\"488\" x2=\"480\" y2=\"540\" stroke=\"#3E4A5C\" stroke-width=\"2\"/>\u003ctext x=\"594\" y=\"532\" text-anchor=\"end\">gearing\u003c/text>\n\u003ctext x=\"300\" y=\"20\" text-anchor=\"middle\" font-size=\"17\" fill=\"#6B7280\">front\u003c/text>\n\u003c/g>\u003c/svg>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:20px\">\u003ctable style=\"font-size:25px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">PART\u003c/th>\u003cth style=\"width:40%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">YOU CHOOSE\u003c/th>\u003cth style=\"width:38%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">IT SETS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Motor\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">2kW · 3.5kW · 5.5kW\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">power P\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Battery\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">45Wh · 70Wh · 100Wh\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">energy E\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Tyres\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">hard · medium · soft\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">grip μ, rolling loss C_rr\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Aero kit\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">none · lowdrag · downforce\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">drag C_D·A, downforce C_L·A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Gearing \u003cspan style=\"font-weight:400;color:#6B7280\">(free)\u003c/span>\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">short · medium · long\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">top speed v_gear, pull F_gear\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Driver\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">controller.m\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">throttle and steering, 50× a second\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-size:24px;line-height:1.4;color:#3E4A5C\">Chosen in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">student/carDesign.m\u003c/span> (five lines). The driver is your code in \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">student/controller.m\u003c/span>.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px\">\u003cp style=\"flex:1;font-size:25px;line-height:1.3;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Budget 80 credits.\u003c/b> The best of everything costs 105.\u003c/p>\u003cp style=\"flex:1;font-size:25px;line-height:1.3;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Mass\u003c/b> = 70 kg + motor + battery + aero (82–102 kg).\u003c/p>\u003cp style=\"flex:1;font-size:25px;line-height:1.3;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Starting car:\u003c/b> 3.5kW · 70Wh · medium · lowdrag · medium. 60 credits, 91 kg.\u003c/p>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · your car\u003c/p>\n\u003caside>Walk round the drawing: the same top view appears in the garage figure. Each part changes one or two numbers in the physics; the next four slides show which. The driver is the sixth design decision and usually the bigger one: the Garage estimates assume a near-perfect driver, and the starting controller scores about 48 overall against estimates near 100.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model", "html": "\u003csection id=\"p2-model\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">One mass, a few forces, one grip budget\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:36px;align-items:flex-start\">\u003csvg viewBox=\"0 0 820 520\" width=\"820\" height=\"520\" role=\"img\" aria-label=\"Forces on the car\" style=\"flex:none\">\n\u003cdefs>\u003cmarker id=\"ah-t\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1A6B62\"/>\u003c/marker>\n\u003cmarker id=\"ah-o\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#B8500F\"/>\u003c/marker>\n\u003cmarker id=\"ah-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#FF8A3D\"/>\u003c/marker>\u003c/defs>\n\u003cline x1=\"30\" y1=\"404\" x2=\"790\" y2=\"404\" stroke=\"#9AA7BD\" stroke-width=\"3\"/>\n\u003crect x=\"300\" y=\"250\" width=\"230\" height=\"112\" rx=\"18\" fill=\"#13203A\"/>\n\u003ctext x=\"415\" y=\"316\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"700\" fill=\"#FFFFFF\" font-family=\"IBM Plex Sans, Arial\">mass m\u003c/text>\n\u003ccircle cx=\"350\" cy=\"380\" r=\"24\" fill=\"#1B2433\"/>\u003ccircle cx=\"480\" cy=\"380\" r=\"24\" fill=\"#1B2433\"/>\n\u003cline x1=\"530\" y1=\"306\" x2=\"700\" y2=\"306\" stroke=\"#1A6B62\" stroke-width=\"9\" marker-end=\"url(#ah-t)\"/>\n\u003ctext x=\"548\" y=\"286\" font-size=\"28\" font-weight=\"700\" fill=\"#1A6B62\" font-family=\"IBM Plex Sans, Arial\">F_drive\u003c/text>\n\u003ctext x=\"548\" y=\"346\" font-size=\"21\" fill=\"#3E4A5C\" font-family=\"IBM Plex Sans, Arial\">motor, through the gearing\u003c/text>\n\u003cg stroke=\"#B8500F\" stroke-width=\"7\">\u003cline x1=\"300\" y1=\"262\" x2=\"186\" y2=\"262\" marker-end=\"url(#ah-o)\"/>\u003cline x1=\"300\" y1=\"292\" x2=\"186\" y2=\"292\" marker-end=\"url(#ah-o)\"/>\n\u003cline x1=\"300\" y1=\"322\" x2=\"186\" y2=\"322\" marker-end=\"url(#ah-o)\"/>\u003cline x1=\"300\" y1=\"352\" x2=\"186\" y2=\"352\" marker-end=\"url(#ah-o)\"/>\u003c/g>\n\u003cg font-family=\"IBM Plex Sans, Arial\" font-size=\"23\" text-anchor=\"end\">\u003ctext x=\"172\" y=\"270\" fill=\"#B8500F\" font-weight=\"700\">F_drag \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">air\u003c/tspan>\u003c/text>\n\u003ctext x=\"172\" y=\"300\" fill=\"#B8500F\" font-weight=\"700\">F_roll \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">tyres\u003c/tspan>\u003c/text>\n\u003ctext x=\"172\" y=\"330\" fill=\"#B8500F\" font-weight=\"700\">F_grade \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">hill\u003c/tspan>\u003c/text>\n\u003ctext x=\"172\" y=\"360\" fill=\"#B8500F\" font-weight=\"700\">F_brake \u003ctspan fill=\"#3E4A5C\" font-weight=\"400\">brakes\u003c/tspan>\u003c/text>\u003c/g>\n\u003cline x1=\"415\" y1=\"110\" x2=\"415\" y2=\"240\" stroke=\"#FF8A3D\" stroke-width=\"9\" marker-end=\"url(#ah-a)\"/>\n\u003ctext x=\"436\" y=\"150\" font-size=\"26\" font-weight=\"700\" fill=\"#B8500F\" font-family=\"IBM Plex Sans, Arial\">F_down\u003c/text>\n\u003ctext x=\"436\" y=\"180\" font-size=\"21\" fill=\"#3E4A5C\" font-family=\"IBM Plex Sans, Arial\">aero kit: presses the car onto the road\u003c/text>\n\u003ctext x=\"415\" y=\"450\" text-anchor=\"middle\" font-size=\"25\" fill=\"#13203A\" font-family=\"JetBrains Mono, monospace\">N = m·g·cos α + F_down\u003c/text>\n\u003ctext x=\"415\" y=\"490\" text-anchor=\"middle\" font-size=\"22\" fill=\"#3E4A5C\" font-family=\"IBM Plex Sans, Arial\">load on the tyres: their grip budget is μ·N\u003c/text>\n\u003c/svg>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">EVERY 0.02 s\u003c/p>\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">1\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Steer \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eq. 7\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">The front wheel turns towards your command: at most 0.5 rad, at most 1.5 rad/s.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">2\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Push and resist \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eqs. 1–4, 9\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">Speed changes by the force balance: m·dv/dt = F_drive − F_drag − F_roll − F_grade − F_brake.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">3\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Share the grip \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eq. 5\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">Turning, driving and braking share one budget: √(F_x² + F_y²) ≤ μ·N. Too much turning and the car understeers: it runs wide, with no grip left to brake. Wet or mud: μ × 0.6; mud also rolls 4× harder.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:18px;align-items:flex-start\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:34px;font-weight:700;color:#B8500F;width:32px;flex:none;line-height:1.1\">4\u003c/p>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cp style=\"font-size:26px;font-weight:600;color:#13203A\">Spend energy \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;font-weight:400;color:#B8500F\">&nbsp;eq. 8\u003c/span>\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">E ← E − F_drive·v·dt / 0.85. Braking recovers nothing. An empty battery means no drive: the car coasts.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the nine equations are in AI_Grand_Prix\\PHYSICS.md\u003c/p>\n\u003caside>The whole simulator is these four steps with the nine short equations in PHYSICS.md. It is deterministic: the same car and driver always give the same run, so a change in the result is caused by a change the student made. The grip budget (eq. 5) is the one idea to land: braking in a corner steals grip from turning, which is why braking before the corner beats braking in it. In the race view, the HUD's friction-circle dot shows this live.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model-push", "html": "\u003csection id=\"p2-model-push\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL · MOTOR AND GEARING\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">How hard the car can push\u003c/h2>\n\u003c/div>\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;background:#13203A;color:#F5F3EE;padding:20px 30px;border-radius:12px\">F_drive ≤ min(P / v, F_gear), and F_drive = 0 at or above v_gear \u003cspan style=\"color:#FF8A3D\">&nbsp;&nbsp;eq. 2\u003c/span>\u003c/p>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:36px;align-items:flex-start\">\u003cdiv style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:18px\">\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:34%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MOTOR\u003c/th>\u003cth style=\"width:24%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">POWER P\u003c/th>\u003cth style=\"width:20%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MASS\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"2kW\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">2.0 kW\u003c/td>\u003ctd style=\"padding:11px 18px\">7 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"3.5kW\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">3.5 kW\u003c/td>\u003ctd style=\"padding:11px 18px\">11 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">20\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"5.5kW\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">5.5 kW\u003c/td>\u003ctd style=\"padding:11px 18px\">16 kg\ text x=\"750.9\" y=\"254.0\" text-anchor=\"middle\" font-size=\"18\" fill=\"#B8500F\" font-weight=\"700\" font-family=\"IBM Plex Sans, Arial\">20 m/s\u003c/text>\u003ctext x=\"0\" y=\"296\" font-size=\"18\" fill=\"#6B7280\" font-family=\"IBM Plex Sans, Arial\">push F_drive (0–900 N) against speed v (0–22 m/s), 3.5 kW motor · dashed: P / v\u003c/text>\u003c/svg>\u003cdiv style=\"display:flex;flex-direction:column;gap:10px;font-size:24px;line-height:1.35;color:#13203A\">\u003cp>\u003cb style=\"color:#1A6B62\">▲ Bigger motor:\u003c/b> faster out of every corner and along every straight. \u003cb style=\"color:#B8500F\">▼\u003c/b> credits, mass, more energy.\u003c/p>\u003cp>\u003cb style=\"color:#1A6B62\">▲ Short gearing:\u003c/b> launch, hairpin exits. \u003cb style=\"color:#B8500F\">▼\u003c/b> stuck at 14 m/s.\u003c/p>\u003cp>\u003cb style=\"color:#1A6B62\">▲ Long gearing:\u003c/b> 20 m/s on long straights. \u003cb style=\"color:#B8500F\">▼\u003c/b> weak launch, energy at speed.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the model: motor and gearing\u003c/p>\n\u003caside>Read the three small plots left to right: the motor's power curve P/v (dashed) is the same in all three; the gearing caps the push at low speed (the flat top) and cuts it off at its top speed. Short gearing pulls hard but stops at 14 m/s; long gearing reaches 20 m/s but pulls weakly. A bigger motor lifts the dashed curve, which only matters above v = P / F_gear. Gearing costs no credits: the trade-off is pure physics.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model-grip", "html": "\u003csection id=\"p2-model-grip\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL · TYRES AND AERO\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Grip, rolling loss, drag and downforce\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:36px;align-items:flex-start\">\u003cdiv style=\"width:880px;flex:none;display:flex;flex-direction:column;gap:14px\">\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:31%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">TYRES\u003c/th>\u003cth style=\"width:21%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">GRIP μ\u003c/th>\u003cth style=\"width:26%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">ROLLING C_rr\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"hard\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.9\u003c/td>\u003ctd style=\"padding:11px 18px\">0.012\u003c/td>\u003ctd style=\"padding:11px 18px\">5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"medium\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">1.1\u003c/td>\u003ctd style=\"padding:11px 18px\">0.020\u003c/td>\u003ctd style=\"padding:11px 18px\">12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"soft\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">1.3\u003c/td>\u003ctd style=\"padding:11px 18px\">0.032\u003c/td>\u003ctd style=\"padding:11px 18px\">20\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#3E4A5C;padding:0 18px\">F_roll = C_rr·N &nbsp;(eq. 4) · grip budget μ·N &nbsp;(eq. 5)\u003c/p>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:25%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">AERO KIT\u003c/th>\u003cth style=\"width:20%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">DRAG C_D·A\u003c/th>\u003cth style=\"width:25%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">DOWNFORCE C_L·A\u003c/th>\u003cth style=\"width:14%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MASS\u003c/th>\u003cth style=\"width:16%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"none\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.35 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">0\u003c/td>\u003ctd style=\"padding:11px 18px\">0 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"lowdrag\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.30 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">0.3 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">2 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"downforce\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">0.50 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">1.2 m²\u003c/td>\u003ctd style=\"padding:11px 18px\">4 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">20\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:21px;color:#3E4A5C;padding:0 18px\">F_drag = ½ρ·C_D·A·v² · F_down = ½ρ·C_L·A·v² &nbsp;(eq. 3)\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:26px 28px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">SAFE CORNER SPEED · EQ. 6\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px;line-height:1.4;color:#13203A\">v² = μ·g·cos α / (|κ| − μ·ρ·C_L·A / (2m))\u003c/p>\u003ctable style=\"font-size:22px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:56%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">STARTING CAR WITH…\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">R 10 m\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">R 40 m\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">hard tyres\u003c/td>\u003ctd style=\"padding:11px 18px\">9.5\u003c/td>\u003ctd style=\"padding:11px 18px\">19.5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">medium tyres \u003cspan style=\"color:#6B7280\">(starting car)\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">10.5\u003c/td>\u003ctd style=\"padding:11px 18px\">21.7\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">soft tyres\u003c/td>\u003ctd style=\"padding:11px 18px\">11.4\u003c/td>\u003ctd style=\"padding:11px 18px\">23.8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">no aero kit\u003c/td>\u003ctd style=\"padding:11px 18px\">10.4\u003c/td>\u003ctd style=\"padding:11px 18px\">20.8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">downforce kit\u003c/td>\u003ctd style=\"padding:11px 18px\">10.9\u003c/td>\u003ctd style=\"padding:11px 18px\">25.6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>medium tyres in mud\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cb>8.1\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">\u003cb>16.5\u003c/b>\u003c/td>\u003c/tr>\n\u003c/table>\u003cp style=\"font-size:19px;color:#6B7280\">m/s, from the Garage. Only one part changed each time.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px;font-size:25px;line-height:1.35;color:#13203A\">\u003cp>\u003cb style=\"color:#1A6B62\">▲ Softer tyres:\u003c/b> faster corners, harder braking. \u003cb style=\"color:#B8500F\">▼\u003c/b> rolling loss: more energy (4× in mud), a little slower in a straight line.\u003c/p>\u003cp>\u003cb style=\"color:#1A6B62\">▲ Downforce:\u003c/b> grip in \u003ci>fast\u003c/i> corners, hardly any in hairpins. \u003cb style=\"color:#B8500F\">▼\u003c/b> drag on every straight, much more energy. Note: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">\"none\"\u003c/span> has \u003ci>more\u003c/i> drag than \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">\"lowdrag\"\u003c/span>.\u003c/p>\u003c/div>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the model: tyres and aero\u003c/p>\n\u003caside>The corner-speed table is the point of this slide: soft tyres help everywhere in corners, while the downforce kit adds almost nothing in a 10 m hairpin (10.5 to 10.9 m/s) but a lot in a 40 m sweeper (21.7 to 25.6 m/s), because downforce grows with v². Ask: which path has hairpins, and which has fast sweepers? Then: what does each cost on the endurance?\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-model-energy", "html": "\u003csection id=\"p2-model-energy\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE MODEL · BATTERY AND MASS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">What every lap costs\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px;align-items:stretch\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">BATTERY · EQ. 8\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#13203A\">E ← E − F_drive·v·dt / η, &nbsp;η = 0.85\u003c/p>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:30%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">OPTION\u003c/th>\u003cth style=\"width:26%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">ENERGY\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MASS\u003c/th>\u003cth style=\"width:22%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">CREDITS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"45Wh\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">45 Wh\u003c/td>\u003ctd style=\"padding:11px 18px\">5 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"70Wh\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">70 Wh\u003c/td>\u003ctd style=\"padding:11px 18px\">8 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">18\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace\">\"100Wh\"\u003c/span>\u003c/td>\u003ctd style=\"padding:11px 18px\">100 Wh\u003c/td>\u003ctd style=\"padding:11px 18px\">12 kg\u003c/td>\u003ctd style=\"padding:11px 18px\">30\u003c/td>\u003c/tr>\n\u003c/table>\u003cul style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">\u003cli>Energy is used only while driving, and faster costs more (drag grows with v²)\u003c/li>\u003cli>Braking recovers nothing; an empty battery means the car \u003cb>coasts\u003c/b>\u003c/li>\u003cli>Starting car, near-perfect driver: the endurance needs ≈ 58 Wh\u003c/li>\u003c/ul>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 32px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">MASS · EQS. 1, 4, 6, 9\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#13203A\">m = 70 kg chassis + parts\u003c/p>\u003ctable style=\"font-size:24px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:44%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">PART\u003c/th>\u003cth style=\"width:56%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">OPTIONS\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Motor\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">7 · 11 · 16 kg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Battery\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">5 · 8 · 12 kg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Aero kit\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">0 · 2 · 4 kg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:11px 18px\">\u003cb>Tyres, gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:11px 18px\">0 kg\u003c/td>\u003c/tr>\n\u003c/table>\u003cul style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">\u003cli>Every kilogram slows every acceleration (eq. 1)\u003c/li>\u003cli>Hills: F_grade = m·g·sin α; a 5&nbsp;% hill on 95 kg ≈ 46 N (eq. 9)\u003c/li>\u003cli>Without downforce, mass doesn't change the safe corner speed: m cancels in eq. 6\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:26px;line-height:1.35;color:#13203A\">\u003cb style=\"color:#1A6B62\">▲ Bigger battery:\u003c/b> the endurance at full pace without running dry. \u003cb style=\"color:#B8500F\">▼\u003c/b> credits and kilograms on every path, and it only helps if you would otherwise run out.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the model: battery and mass\u003c/p>\n\u003caside>The battery is the clearest 'just enough' part: with 45 Wh the starting car has to slow down on the endurance (estimated 136 s instead of 122 s), while 100 Wh gains nothing on that car and adds 4 kg to every path. Mass is not chosen directly: it follows from the motor, battery and aero, from 82 kg to 102 kg.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-paths", "html": "\u003csection id=\"p2-paths\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE PATHS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Four paths, four different tests\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px\">\u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:20px 22px\">\u003cdiv style=\"display:flex;flex-direction:column;gap:2px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:29px;font-weight:600;color:#13203A\">Drag strip\u003c/h3>\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:18px;color:#B8500F\">\"drag\"\u003c/span>\u003c/div>\u003csvg viewBox=\"0 0 520 300\" width=\"100%\" height=\"210\" role=\"img\" aria-label=\"Drag strip, side view of the layout\">\n\u003crect x=\"20\" y=\"128\" width=\"480\" height=\"44\" fill=\"#D9 Workshop · Part 2 · the practice paths, drawn from the simulator\u003c/p>\n\u003caside>These are the real practice layouts, drawn from the simulator. Each one leans on a different part of the design: the drag strip on power, gearing and the stop; the technical circuit on grip and the driver; the endurance on energy over five laps with a hill; the muddy road on traction, power and a driver that slows for mud it can see coming (previewPoints columns 4 and 5). On race day the layouts change, so anything tuned to these coordinates breaks. Practice commands: practiceRace('Path', 'drag' | 'technical' | 'endurance' | 'mud' | 'wet').\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-matrix", "html": "\u003csection id=\"p2-matrix\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · WHERE EACH PART MATTERS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Every path leans on different parts\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:23px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:13%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">PART\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">DRAG STRIP\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">TECHNICAL\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">ENDURANCE\u003c/th>\u003cth style=\"width:21.75%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">MUDDY ROAD\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Motor\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; launch, top end\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; corner exits\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; exits; energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; push through mud\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Battery\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; dead weight\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; dead weight\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; run dry: slow down\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; dead weight\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Tyres\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; rolling loss\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; hairpins, braking\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; corners vs energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; grip; 4× rolling\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Aero kit\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; drag\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; hairpins: little\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; drag, energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; too slow to help\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; launch vs top\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; hairpin exits\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; top speed vs energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">●\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; pull out of mud\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 14px\">\u003cb>Driver\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; braking, the stop\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; eq. 6, no penalties\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; pace vs energy\u003c/span>\u003c/td>\u003ctd style=\"padding:16px 14px\">\u003cspan style=\"color:#B8500F;letter-spacing:3px\">●●●\u003c/span>\u003cspan style=\"color:#D9D3C7;letter-spacing:3px\">\u003c/span>\u003cspan style=\"color:#3E4A5C\">&nbsp; read the mud\u003c/span>\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">How much the estimated time changes between a part's worst and best option, swapping one part at a time on the starting car: \u003cspan style=\"color:#B8500F\">●\u003c/span> under 2.5&nbsp;% · \u003cspan style=\"color:#B8500F\">●●\u003c/span> 2.5–5&nbsp;% · \u003cspan style=\"color:#B8500F\">●●●\u003c/span> over 5&nbsp;%. Driver: the starting controller scores 48 overall on a car whose estimate is about 100.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · from the Garage estimates (near-perfect driving)\u003c/p>\n\u003caside>Measured, not guessed: each option of each part swapped on the starting car with garage(d), estimated times compared. Biggest single effects: gearing on the endurance (18 %: short gearing tops out at 14 m/s), battery on the endurance (11 %: 45 Wh runs short), tyres on the technical circuit (11 %) and in the mud (10 %), motor and gearing on the drag strip (10 %), motor in the mud (8 %). The driver row is the reminder: the starting controller drives at 7 m/s everywhere, so it leaves half of any car unused.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-tradeoffs", "html": "\u003csection id=\"p2-tradeoffs\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · TRADE-OFFS\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Every gain has a price\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:20px\">\u003cp style=\"flex:1;font-size:23px;line-height:1.35;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Budget:\u003c/b> 80 credits; the best of everything costs 105\u003c/p>\u003cp style=\"flex:1;font-size:23px;line-height:1.35;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Mass:\u003c/b> every upgrade but tyres and gearing adds kilograms\u003c/p>\u003cp style=\"flex:1;font-size:23px;line-height:1.35;background:#FBE8DA;color:#13203A;padding:16px 22px;border-radius:12px\">\u003cb>Physics:\u003c/b> grip ↔ rolling loss · downforce ↔ drag · pull ↔ top speed\u003c/p>\u003c/div>\n\u003ctable style=\"font-size:28px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:24%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">UPGRADE\u003c/th>\u003cth style=\"width:34%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">\u003cspan style=\"color:#1A6B62\">▲ YOU GAIN\u003c/span>\u003c/th>\u003cth style=\"width:42%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">▼ YOU PAY WITH\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Bigger motor\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">faster on every path\u003c/td>\u003ctd style=\"padding:16px 18px\">credits, +4–5 kg, more energy per lap\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Bigger battery\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">endurance at full pace\u003c/td>\u003ctd style=\"padding:16px 18px\">credits, +3–4 kg on every path\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Softer tyres\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">faster corners, harder braking\u003c/td>\u003ctd style=\"padding:16px 18px\">rolling loss: energy (4× in mud), straight-line speed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Downforce kit\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">grip in fast corners\u003c/td>\u003ctd style=\"padding:16px 18px\">drag: slower straights, much more energy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Shorter gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">launch, hairpin exits\u003c/td>\u003ctd style=\"padding:16px 18px\">top speed (14 m/s)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 18px\">\u003cb>Longer gearing\u003c/b>\u003c/td>\u003ctd style=\"padding:16px 18px\">top speed (20 m/s)\u003c/td>\u003ctd style=\"padding:16px 18px\">launch; energy at high speed\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · trade-offs\u003c/p>\n\u003caside>Three reasons no car wins everywhere: the budget, mass, and the physics built into each part. Go down the table and ask the room which path pays for each gain. Example: soft tyres win time on the technical circuit but cost energy on the endurance; the downforce kit helps the endurance's fast corners but its drag can make the starting car run short of energy.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-scoring", "html": "\u003csection id=\"p2-scoring\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · SCORING\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Balance beats one great result\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:26px 40px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:48px;font-weight:600;color:#13203A\">Overall = 0.6 × mean(s) + 0.4 × min(s)\u003c/p>\u003cp style=\"font-size:26px;color:#3E4A5C\">Per path: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">s = min(120, 100 × T_ref / T)\u003c/span>, T = your time + penalties, T_ref = the reference car. A DNF scores 0.\u003c/p>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:32px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#E9E6DF;padding:36px 40px;border-radius:16px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600\">Specialist\u003c/h3>\u003cp style=\"font-size:34px;color:#3E4A5C\">95 · 95 · 95 · 20\u003c/p>\u003cp style=\"font-size:40px;font-weight:600;color:#13203A\">Overall 54\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;padding:36px 40px;border-radius:16px\">\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:36px;font-weight:600\">All-rounder\u003c/h3>\u003cp style=\"font-size:34px;color:#3E4A5C\">75 · 75 · 75 · 75\u003c/p>\u003cp style=\"font-size:40px;font-weight:600;color:#B8500F\">Overall 75 · wins\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:30px;line-height:1.4;color:#13203A\">\u003cb>Your weakest path counts for 40&nbsp;%.\u003c/b> It is usually where your next point comes from.\u003c/p>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#13203A\">Cars that finish every path rank first. Awards: overall champion · best single path · best engineering explanation · best use of the agent.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · scoring\u003c/p>\n\u003caside>Specialist: 0.6 × 76.25 + 0.4 × 20 = 53.75. All-rounder: 0.6 × 75 + 0.4 × 75 = 75. Your weakest path counts for 40 %, so it is usually where the next point comes from. The last two awards are judged from the engineering log.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-sweetspot", "html": "\u003csection id=\"p2-sweetspot\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · THE SWEET SPOT\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Find your sweet spot: it's your call\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">WHY BETTER CAN LOSE\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.2;color:#13203A\">+10 on your best path, −5 on your weakest\u003c/h3>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:22px\">0.6 × (10 − 5) / 4 − 0.4 × 5 = −1.25\u003c/span>\u003cbr>Check all four paths before you keep a change.\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">PARTS INTERACT\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.2;color:#13203A\">Is 70 Wh enough?\u003c/h3>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">It depends on the motor, gearing, aero, tyres and how hard you drive. Long gearing or the downforce kit pushes the starting car to 69 of its 70 Wh.\u003c/p>\u003c/div>\n\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:2px solid #E3DDD2;border-radius:16px;padding:28px 30px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:2px;color:#B8500F\">THE DRIVER IS HALF THE CAR\u003c/p>\u003ch3 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:30px;font-weight:600;line-height:1.2;color:#13203A\">48 or 100 on the same car\u003c/h3>\u003cp style=\"font-size:23px;line-height:1.4;color:#3E4A5C\">Garage estimates assume a near-perfect driver (≈ 100). The starting controller scores 48. A better car pays off only if you drive near its limits.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:16px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">1\u003c/span>&nbsp; Find your weakest path\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">practiceRace('Path', 'all')\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">2\u003c/span>&nbsp; Predict the cost, in your log\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">which path pays?\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">3\u003c/span>&nbsp; Try it without editing\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">d = carDesign(); d.tyres = \"soft\"; garage(d)\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#13203A;color:#F5F3EE;padding:20px 22px;border-radius:12px\">\u003cp style=\"font-size:23px;font-weight:600\">\u003cspan style=\"color:#FF8A3D\">4\u003c/span>&nbsp; Race your best model's ghost\u003c/p>\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:17px;color:#C9D3E3\">a higher overall is saved\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#13203A\">There is no answer key. Two teams can race different cars and both be right, as long as each can show why.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · the sweet spot\u003c/p>\n\u003caside>The arithmetic assumes the weakest path stays the weakest: the mean rises by 5/4, times 0.6 is +0.75; the min drops by 5, times 0.4 is −2. The 69-of-70 Wh figure is the Garage estimate for the starting car with long gearing or with the downforce kit. Run garage once in a MATLAB session before the garage(d) trick, so MATLAB can find carDesign.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-best", "html": "\u003csection id=\"p2-best\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · YOUR BEST MODEL\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">Race your own ghost; keep only what is better\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:12px;align-items:stretch\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:24px 26px;border-radius:14px\">\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:600;color:#13203A\">practiceRace('Path', 'all')\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">your car drives all four paths\u003c/p>\u003c/div>\u003cp style=\"font-size:34px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:2px solid #E3DDD2;padding:24px 26px;border-radius:14px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600;color:#13203A\">Fast replay\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">you next to a grey ghost: your best run so far\u003c/p>\u003c/div>\u003cp style=\"font-size:34px;color:#B8500F;align-self:center\">→\u003c/p>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#FBE8DA;border:2px solid #F3C9A8;padding:24px 26px;border-radius:14px\">\u003cp style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:28px;font-weight:600;color:#13203A\">Overall better than your best?\u003c/p>\u003cp style=\"font-size:22px;line-height:1.35;color:#3E4A5C\">0.6 × mean + 0.4 × min, all four paths\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:row;gap:24px\">\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#E3F1E7;border:2px solid #9CCFAA;padding:24px 28px;border-radius:14px\">\u003cp style=\"font-size:28px;font-weight:600;color:#1F6B3A\">Yes: saved as your best model\u003c/p>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">It replaces the old one: \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px\">best_model/&lt;team&gt;.zip\u003c/span>. There is only ever one, and it is what you hand in.\u003c/p>\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#E9E6DF;padding:24px 28px;border-radius:14px\">\u003cp style=\"font-size:28px;font-weight:600;color:#13203A\">No: nothing is saved\u003c/p>\u003cp style=\"font-size:22px;line-height:1.4;color:#3E4A5C\">Your best model stays as it was. An experiment can never cost you your best car.\u003c/p>\u003c/div>\u003c/div>\n\u003cp style=\"font-size:26px;line-height:1.4;color:#13203A\">\u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">bestModel\u003c/span> shows it: scores, parts, the file. The name on race day is \u003cspan style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px\">car.team\u003c/span> inside it, so set your team name first.\u003c/p>\n\u003cp style=\"position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B7280\">AI Workshop · Part 2 · your best model\u003c/p>\n\u003caside>This is what makes it safe to experiment: the best model only ever moves up. Students see the ghost in the fast replay of practiceRace('Path', 'all') and in single-path animated runs. Renaming the team (same car) refreshes the best model too. On race day you collect exactly these files.\u003c/aside>\n\u003c/section>\n"}, {"id": "p2-roles", "html": "\u003csection id=\"p2-roles\" data-transition=\"fade\" style=\"background:#F5F3EE;color:#1B2433;font-family:'IBM Plex Sans', Arial, sans-serif;padding:120px 128px 150px;display:flex;flex-direction:column;gap:32px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n\u003cp style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;letter-spacing:2px;color:#B8500F\">PART 2 · WHO DOES WHAT\u003c/p>\n\u003ch2 style=\"font-family:'Space Grotesk', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.1;color:#13203A\">You are the race engineer. The agent is your pit crew.\u003c/h2>\n\u003c/div>\n\u003ctable style=\"font-size:28px;color:#1B2433\">\n\u003ctr>\u003cth style=\"width:50%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">YOU\u003c/th>\u003cth style=\"width:50%;text-align:left;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:20px;letter-spacing:1px;color:#B8500F;font-weight:600\">THE AGENT\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Decide which path to work on, and why\u003c/td>\u003ctd style=\"padding:17px 18px\">Runs MATLAB: garage, practiceRace, plotLap\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:17px 18px\">Choose the designs to compare, and \u003cb>predict\u003c/b> first\u003c/td>\u003ctd style=\
